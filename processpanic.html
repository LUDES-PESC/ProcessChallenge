<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,select{font:inherit}button{cursor:pointer}#app{width:100%;max-width:var(--max);margin:auto;min-height:100dvh;background:linear-gradient(180deg,var(--bg),var(--panel) 52%,var(--bg));border-inline:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(var(--max),100%);z-index:100;height:calc(54px + env(safe-area-inset-top));padding:calc(7px + env(safe-area-inset-top)) 9px 7px;display:grid;grid-template-columns:40px max-content max-content 1fr 40px;align-items:center;gap:7px;background:color-mix(in srgb,var(--bg) 96%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topName{font-weight:900;white-space:nowrap;letter-spacing:-.025em}.topVersion{font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap}.iconBtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);display:grid;place-items:center;font-size:19px;padding:0}
main{padding:calc(66px + env(safe-area-inset-top)) 10px calc(28px + env(safe-area-inset-bottom))}.screen{display:none}.screen.active{display:block}.hero,.card,.pagePanel,.debrief{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:15px}.hero{padding:20px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),var(--panel));box-shadow:0 16px 44px rgba(0,0,0,.18)}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:850;color:var(--accent)}h1{font-size:30px;line-height:1.04;margin:7px 0 9px;letter-spacing:-.045em}h2{font-size:20px;margin:0 0 8px}p{line-height:1.48}.lead{font-size:13px;color:var(--muted);margin:0}.primary,.secondary,.danger{border-radius:12px;min-height:44px;padding:10px 13px;font-weight:800;border:1px solid var(--line)}.primary{background:#0b6f9e;color:#fff;border-color:#1988bb}.secondary{background:var(--panel2);color:var(--ink)}.danger{background:color-mix(in srgb,var(--bad) 18%,var(--panel));color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}.stat{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:9px;color:var(--muted)}
.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:20px 2px 9px}.sectionHead h2{margin:0}.sectionHead span{font-size:10px;color:var(--muted)}.lessonList{display:grid;gap:9px}.lessonCard{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:13px;color:var(--ink)}.lessonCard.locked{opacity:.48}.lessonCard h3{margin:4px 0 5px;font-size:15px}.lessonCard p{margin:0;color:var(--muted);font-size:11px;line-height:1.4}.lessonTop{display:flex;justify-content:space-between;gap:8px;font-size:9px;color:var(--accent);text-transform:uppercase;font-weight:800;letter-spacing:.08em}.progressTrack{height:5px;border-radius:999px;background:var(--panel2);overflow:hidden;margin-top:9px}.progressTrack span{display:block;height:100%;background:var(--accent)}
.missionCard{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}.missionHead{padding:13px;border-bottom:1px solid var(--line)}.missionMeta{display:flex;justify-content:space-between;gap:8px;color:var(--accent);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.missionHead h2{margin:5px 0}.prompt{padding:11px 13px;background:var(--panel2);font-size:12px;line-height:1.45}.diagramWrap{margin:11px;border:1px solid var(--line);border-radius:14px;overflow:auto;background:#fff}.diagramWrap svg{display:block;width:100%;min-width:350px;height:auto;max-height:300px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 11px 11px}.choice{border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:8px;text-align:left;min-height:86px}.choice.selected{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}.choiceIcon{height:43px;display:flex;align-items:center;justify-content:center}.choiceIcon svg{height:40px;width:66px}.choiceText{display:none}.choice.revealedChoice .choiceText{display:block}.textChoice{min-height:72px;display:flex;align-items:center}.choiceTextVisible{display:block;width:100%;font-size:12px;line-height:1.25}.screenId{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin:0 0 7px;font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--accent);background:var(--panel2)}.menuGrid>.screenId,.setupGrid>.screenId{grid-column:1/-1;justify-self:start}.choice b{font-size:10.5px;display:block;margin-top:4px;line-height:1.15}.choice small{font-size:8.5px;color:var(--muted);display:block;margin-top:2px;line-height:1.2}.missionActions{display:flex;gap:7px;padding:0 11px 11px}.missionActions button:last-child{flex:1}.feedback{display:none;margin:0 11px 11px;border-radius:12px;padding:10px;font-size:11px;line-height:1.45}.feedback.show{display:block}.feedback.ok{border:1px solid color-mix(in srgb,var(--good) 55%,var(--line));background:color-mix(in srgb,var(--good) 12%,var(--panel))}.feedback.bad{border:1px solid color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 12%,var(--panel))}.feedback.info{border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--panel))}.token{filter:drop-shadow(0 1px 2px rgba(0,0,0,.32))}
.debriefBadge{font-size:42px}.debrief h1{font-size:27px}.debriefStats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:13px 0}.debriefStat{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px;text-align:center}.debriefStat b{font-size:18px;display:block}.debriefStat span{font-size:8px;color:var(--muted)}.takeaways{margin:12px 0;padding:0;list-style:none}.takeaways li{padding:9px 9px 9px 30px;border-top:1px solid var(--line);font-size:11px;line-height:1.4;position:relative}.takeaways li:before{content:'✓';position:absolute;left:9px;color:var(--good);font-weight:900}.debriefActions{display:grid;gap:6px}.starsBig{font-size:24px;color:var(--warn);letter-spacing:2px}
.pagePanel p{font-size:12px;color:var(--muted)}.groupTitle{margin:19px 0 7px;font-size:12px;text-transform:uppercase;color:var(--accent);letter-spacing:.09em}.glossGrid{display:grid;gap:7px}.glossItem{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--panel2)}.glossItem svg{width:70px;height:50px}.glossItem b{font-size:11px;display:block}.glossItem span{font-size:9px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}.refLink{display:block;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:8px;background:var(--panel2);color:var(--ink);text-decoration:none;font-size:12px;font-weight:800}.refLink small{display:block;font-weight:400;color:var(--muted);margin-top:3px}
.overlay{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:calc(62px + env(safe-area-inset-top)) 9px 12px}.overlay.show{display:flex}.modal{width:min(460px,100%);max-height:calc(100dvh - 80px);overflow:auto;border:1px solid var(--line);background:var(--panel);border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.4);padding:11px}.modalHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.modalHead h2{font-size:16px;margin:0}.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.menuItem{min-height:46px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:9px;text-align:left;font-size:10px}.setupGrid{display:grid;gap:8px}.field{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:5px}.field select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);padding:7px}.setupHint{font-size:9px;color:var(--muted);line-height:1.4}.toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,120px);transition:.25s;z-index:200;width:min(420px,calc(100% - 20px));padding:10px;border-radius:12px;background:#050b12;color:#fff;border:1px solid #4a5c72;font-size:10px;text-align:center}.toast.show{transform:translate(-50%,0)}.restartBar{margin-top:12px;display:flex}.restartBar .danger{width:100%;min-height:46px}

<script>
"use strict";
const VERSION="v0.2", LANGS=["en","pt","fr","es","it"];
const I18N={"en":{"menu.course":"Course map","menu.glossary":"BPMN symbol guide","menu.reference":"References","menu.about":"About","menu.install":"Install app","menu.reset":"Reset progress","setup.title":"Setup","setup.language":"Language","setup.theme":"Theme","setup.theme.system":"System","setup.theme.light":"Light","setup.theme.dark":"Dark","setup.motion":"Motion","setup.motion.normal":"Normal","setup.motion.reduced":"Reduced","setup.installHint":"Installation appears when the browser supports web apps.","setup.saved":"Changes apply immediately.","home.kicker":"Mobile BPMN learning game","home.title":"Repair the process. Then run it.","home.lead":"Learn BPMN by choosing notation, executing token behavior, observing failures, and debriefing what happened.","home.continue":"Continue course","home.start":"Start course","home.completed":"missions completed","home.stars":"stars","home.lessons":"lessons","home.course":"Course","home.lesson":"Lesson","home.done":"Lesson completed","mission.label":"Mission","mission.run":"Run process","mission.hint":"Hint","mission.retry":"Try another choice","mission.next":"Next mission","mission.toDebrief":"Lesson debrief","mission.correct":"Process behaves as intended.","mission.wrong":"Execution exposes a modeling problem.","feedback.observe":"Observe the behavior and compare it with the BPMN rule.","debrief.completed":"Lesson completed","debrief.accuracy":"First-try accuracy","debrief.hints":"Hints used","debrief.stars":"Stars earned","debrief.keyIdeas":"What this lesson should leave with you","debrief.continue":"Continue to next lesson","debrief.replay":"Replay lesson","debrief.course":"Back to course map","final.title":"Final debrief","final.subtitle":"You completed the v0.2 BPMN route.","final.score":"Total stars","final.accuracy":"First-try accuracy","final.hints":"Hints used","final.message":"The goal is more than symbol recall: you should be able to predict how tokens, messages, participants, gateways, and events change process behavior.","final.replay":"Review the course","final.reset":"Start over","glossary.title":"BPMN symbol guide","glossary.lead":"Symbols are redrawn in the visual style used by the BPMN Quick Guide and BPMN 2.0. Color only indicates game state; it is not normative BPMN semantics.","glossary.events":"Events","glossary.activities":"Activities","glossary.gateways":"Gateways","glossary.flows":"Flows and associations","glossary.data":"Data","glossary.swimlanes":"Pools and lanes","reference.title":"References and notation policy","reference.quick":"BPMN Quick Guide","reference.omg":"OMG BPMN 2.0.2","reference.policy":"Process Panic redraws notation as native SVG and does not embed Quick Guide images. The game favors explicit gateways and readable left-to-right layouts.","reference.course":"Course materials supplied by Geraldo Xexéo define the teaching order used by the game.","about.title":"About Process Panic!","about.text":"Process Panic! is a LUDES/PESC educational browser game designed to make BPMN execution semantics visible. The core loop is choose → execute → observe → debrief.","about.version":"Version v0.2","about.license":"MIT License — Copyright (c) 2026 Geraldo Xexéo.","install.unavailable":"Your browser did not expose an installation prompt. Use its menu and choose Add to Home Screen / Install App when available.","reset.confirm":"Reset all Process Panic! progress on this device?","toast.installed":"Process Panic! is installed.","toast.reset":"Progress reset.","toast.lang":"Language changed immediately.","lessons":[["Introduction: flow and tokens","Start/end events, tasks, exclusive choices, parallel paths, and token semantics.",["A process instance needs an explicit start and end.","Tasks perform work; gateways route flow.","Exclusive gateways route one path; parallel gateways create or synchronize concurrent paths."]],["Flows, data, and activities","Default flows, data, task types, and sub-process structure.",["Sequence Flow orders work inside a process.","Data Objects carry information; Data Stores represent persistence.","Task type communicates who or what performs the work."]],["Pools, lanes, and messages","Participants, internal categories, and communication between processes.",["A Pool represents a Participant; a Lane categorizes work inside a Pool.","Sequence Flow may cross Lane boundaries but cannot cross Pool boundaries.","Message Flow connects different Participants."]],["Gateway semantics","Exclusive, parallel, inclusive, and event-based routing.",["Gateways route flow; they do not perform the business decision.","Parallel joins synchronize all required branches.","Event-Based Gateways route according to the first event that occurs."]],["Events","Event positions, messages, boundary events, and termination.",["Single, double, and thick circles distinguish start, intermediate, and end positions.","Catching and throwing message markers distinguish receiving from sending.","Interrupting boundary events stop the attached activity; Terminate ends all tokens in scope."]],["Naming activities and events","Choose names that make work, triggers, states, and business objects readable without extra explanation.",["Activities use meaningful verb–noun phrases.","Events describe what happened, the schedule, condition, or end state.","Data objects use meaningful business nouns and states."]],["Naming gateways and collaboration","Name questions, outcomes, participants, and categories so routing and responsibility are explicit.",["Diverging Exclusive Gateways are best named as questions.","Outgoing conditions are named as outcomes; default flows are normally left unnamed.","Pools name participants; lanes name categories such as roles, systems, or departments."]]],"missions":[["A process begins","A pizza order arrives, but the model has no element that creates the process instance.","A Start Event has no incoming Sequence Flow.","A None Start Event creates the first token for this order."],["Work is not an event","The clerk must record the order in the system. Choose the BPMN element that represents this work.","Look for an atomic unit of work.","A Task receives a token, performs work, and passes the token forward."],["Show the end state","The pizza has been delivered and this path is complete. Choose the element that marks its end.","An End Event uses a thick circle.","A None End Event consumes the arriving token and closes this path."],["Only one route","After availability is checked, the result is either room available or no room. Route exactly one alternative.","The activity determines the result; the gateway only routes it.","An Exclusive Gateway routes one outgoing path."],["Two things at once","The kitchen must prepare the main dish and the side dish independently, and both are required.","Use a gateway that activates every outgoing branch.","A Parallel Gateway creates concurrent tokens for both branches."],["A fallback path","Several conditions may route a request. If none is true, one fallback path must be followed.","Look for the Sequence Flow marked with a slash near its source.","A Default Sequence Flow is used when the other eligible conditions are false."],["Information, not work","A task reads and updates an order form. Choose the BPMN element that represents the form.","The form is data, not work.","A Data Object represents information used or produced by activities."],["Who performs it?","The process automatically calls an external tax-calculation web service.","Choose the task type for automated application/service work.","A Service Task represents automated work performed by an application or service."],["Hide internal detail","Prepare shipment contains several internal steps, but this diagram should keep them hidden.","Look for the activity marker with a small plus sign.","A collapsed Sub-Process hides internal flow while remaining part of the parent process."],["Organize responsibility","The restaurant is one participant, while cashier and kitchen perform different work inside it.","Use a partition inside a Pool, not another Participant.","A Lane organizes activities inside a Pool."],["Cross internal roles","Cashier and kitchen are different lanes of the same pool. Which connector may cross the lane boundary?","Lane boundaries do not separate Participants.","Sequence Flow may cross Lane boundaries because the work remains in the same process."],["Talk to another participant","The restaurant sends a payment request to an external payment provider in another Pool.","Communication between Participants uses a dashed connector with an open source circle.","Message Flow connects different Participants or Pools."],["A black-box provider","The payment provider participates, but its internal process is unknown and irrelevant.","A Participant does not need to expose its internal process.","A black-box Pool represents the external Participant."],["Exclusive, not parallel","After Evaluate application, the result is Approved or Rejected, never both.","The activity determines the outcome; the gateway routes it.","An Exclusive Gateway selects exactly one outgoing path."],["Wait for both","Two parallel branches prepare a document and obtain a signature. Continue only after both finish.","A parallel split usually needs a parallel join when all branches are required.","A Parallel Gateway waits for all required incoming tokens."],["One or more options","A customer may request gift wrap, insurance, or both.","This is neither exactly-one nor all-paths behavior.","An Inclusive Gateway activates one or more outgoing paths according to conditions."],["Whichever happens first","After sending a request, wait for either a reply message or a timeout. The first event determines the route.","The targets after this gateway are catching events or receive activities.","An Event-Based Gateway routes to the first subsequent event that occurs."],["Wait before continuing","After sending a reminder, the process must wait until the next business day before continuing. Which BPMN element belongs at the waiting point?","Use an intermediate catching event triggered by time, not a boundary event attached to an activity.","An Intermediate Timer Event pauses the token until the configured time condition is reached; then the process continues."],["Catch the message","During the process, execution must wait until a customer message arrives.","Catching message markers are unfilled; throwing markers are filled.","A catching Message Intermediate Event waits for the incoming message."],["Timeout the activity","A service call may take too long. After 30 seconds, abandon that call and follow a timeout path.","The timeout must stop the attached activity.","An interrupting Boundary Timer Event cancels the attached activity and creates the timeout path."],["Stop every active path","A fatal cancellation arrives while parallel branches are active. All tokens in this process scope must stop.","A normal End Event ends only the flow that reaches it.","A Terminate End Event immediately terminates all tokens in the current process scope."],["Parallel without a gateway","Choose the fragment that correctly shows one activity activating two unconditional outgoing paths without an explicit gateway.","In BPMN, multiple unconditional Sequence Flows leaving an Activity are all activated.","Two unconditional outgoing Sequence Flows from an Activity create implicit parallelism; an explicit Parallel Gateway is clearer but not required."],["Persistent information","The process reads and updates customer records that must remain available after this process instance ends. What represents that persistent repository?","A document that flows through work is different from persistent storage.","A Data Store represents a database or similar persistent information repository."],["Hands-on work","A worker physically inspects a package without using an application. Which Task type is appropriate?","This work is done by a person without software assistance.","A Manual Task represents human work performed without the aid of a software application."],["The message that starts the collaboration","The first message from the customer initiates the interaction. Choose the Message Flow notation with the initiating decorator.","The decorator is an unfilled envelope placed on the Message Flow.","An Initiating Message Flow with Decorator identifies the message that initiates the collaboration exchange."],["A later message in the collaboration","A later reply belongs to an already established interaction. Choose the non-initiating Message Flow with decorator.","Compare the fill of the envelope decorator.","The non-initiating decorated Message Flow uses the filled/gray envelope decorator."],["A rule the standard gateways cannot express","A join must continue after any three of five incoming branches complete. Which gateway represents such custom synchronization logic?","Exclusive, Parallel, and Inclusive do not express this threshold rule directly.","A Complex Gateway is used for complex synchronization or routing behavior not captured by the other gateway types."],["Split into required parallel work","After an order is accepted, inventory must be reserved and an invoice generated. No closing gateway is shown. Which element should create both branches?","Do not infer the answer from a matching + later in the model; there is none.","A Parallel Gateway activates every outgoing branch."],["Start on an incoming message","A new process instance must be created when an order message arrives.","The envelope is a catching trigger inside a thin Start Event circle.","A Message Start Event catches the incoming message and creates a process instance."],["Start on a schedule","A reconciliation process starts automatically every weekday at 09:00.","Look for the clock marker inside a Start Event.","A Timer Start Event creates the process instance according to a schedule or time condition."],["Start when a condition becomes true","A monitoring process starts when stock falls below the reorder level.","This is a condition becoming true, not a clock or message.","A Conditional Start Event starts when its configured condition is satisfied."],["Start from a broadcast signal","Several independent processes may start when the enterprise broadcasts a 'Disaster declared' signal.","Signals are broadcast and use a triangle marker.","A Signal Start Event catches a matching broadcast signal."],["Any one of several triggers may start it","A case may start from either a message, a signal, or another configured trigger; any one is sufficient.","The pentagon marker denotes Multiple.","A Multiple Start Event starts when any one of its configured triggers occurs."],["All configured triggers are required","A case should start only after all configured initiating triggers have occurred.","The plus marker inside a Start Event denotes Parallel Multiple.","A Parallel Multiple Start Event requires all configured triggers."],["Escalate without ending the process","During processing, raise an escalation to a higher level while representing it as a throwing intermediate event.","The Escalation marker is the upward chevron; throwing markers are filled.","A Throw Escalation Intermediate Event emits an escalation from the current flow."],["Trigger compensation","The process must throw a compensation trigger for work that has already completed.","Compensation uses the double-left-triangle marker; throw is filled.","A Throw Compensation Intermediate Event triggers compensation handling."],["Catch an error from an activity","An activity fails with a BPMN Error and the normal activity must stop while an exception path begins.","Error boundary events are interrupting and use the lightning marker.","A Boundary Error Event catches the error and interrupts the attached activity."],["Catch compensation on the boundary","A completed activity has a compensation handler that should be invoked during rollback.","Look for the unfilled double-left-triangle marker on the boundary.","A Boundary Compensation Event identifies the compensation handler attached to an activity."],["Catch a transaction cancellation","Inside a Transaction, a cancellation must be caught on the transaction boundary.","Cancel uses the X-shaped cancel marker and is specific to transaction cancellation semantics.","A Boundary Cancel Event catches cancellation on a Transaction boundary."],["Name the work","Choose the best BPMN name for an activity that examines a business request.","Use a meaningful active verb plus the business object.","'Review request' states the work directly without naming the BPMN element type."],["Name what happened","Choose the best name for a Message Event that occurs when an order arrives.","Events describe something that happened rather than work to perform.","'Order received' describes the business occurrence using a past participle."],["Name the timer","Choose the best name for a Timer Event that fires at 09:00 every weekday.","Timer Event names should state the schedule.","'Every weekday at 09:00' communicates the actual trigger."],["Name the data object","Choose the best name for an approved purchase order Data Object.","Use the business object name and, when useful, its state in square brackets.","'Purchase order [Approved]' identifies both the information object and its state."],["Name the decision point","Choose the best name for a diverging Exclusive Gateway about payment approval.","A diverging Exclusive Gateway is best named with an interrogative phrase.","'Is payment approved?' makes the routing question explicit."],["Name the outgoing condition","The gateway question is 'Is payment approved?'. Choose the best label for the successful outgoing Sequence Flow.","Name outgoing conditions as outcomes.","'Approved' is a concise outcome consistent with the gateway question."],["Name the default flow","What is the best name for the Default Sequence Flow?","The slash marker already identifies the default path.","Best practice is normally to leave a Default Sequence Flow unnamed."],["Name the Pool","A black-box Pool represents the external company that processes payments. Choose its best name.","Pools are named for Participants, not process names.","'Payment Provider' names the Participant represented by the Pool."],["Name the Lane","A Lane groups the people responsible for supplier invoices. Choose its best name.","Lanes are named for categories such as roles, systems, or departments.","'Accounts Payable' identifies the organizational category responsible for the work."]],"diagram":{"record":"Record order","prepare":"Prepare order","deliver":"Deliver order","check":"Check availability","available":"Room available","noneAvailable":"No room","main":"Prepare main dish","side":"Prepare side dish","flowA":"Other condition","fallback":"Fallback","form":"Order form","tax":"Calculate tax","shipment":"Prepare shipment","restaurant":"Restaurant","cashier":"Cashier","kitchen":"Kitchen","provider":"Payment provider","unknown":"Internal process not shown","request":"Payment request","evaluate":"Evaluate application","approved":"Approved","rejected":"Rejected","document":"Prepare document","signature":"Obtain signature","continue":"Continue","gift":"Gift wrap","insurance":"Insurance","reply":"Reply received","timeout":"Timeout","wait":"Wait for message","service":"Call service","flowB":"Parallel work","reminder":"Send reminder"},"elements":{"startNone":["Start Event","Starts a process instance."],"intermediateNone":["Intermediate Event","Occurs during a running process."],"endNone":["End Event","Ends the current flow."],"task":["Task","Atomic unit of work."],"userTask":["User Task","Human work using software."],"manualTask":["Manual Task","Human work without software."],"serviceTask":["Service Task","Automated service/application work."],"businessRuleTask":["Business Rule Task","Evaluates business rules."],"scriptTask":["Script Task","Runs a process-engine script."],"sendTask":["Send Task","Sends a message as work."],"receiveTask":["Receive Task","Waits for a message as work."],"subProcess":["Collapsed Sub-Process","Hides internal process detail."],"callActivity":["Call Activity","Invokes reusable global activity."],"gatewayExclusive":["Exclusive Gateway","Routes exactly one alternative."],"gatewayParallel":["Parallel Gateway","Activates or synchronizes all paths."],"gatewayInclusive":["Inclusive Gateway","Activates one or more paths."],"gatewayEvent":["Event-Based Gateway","Routes by the first event that occurs."],"gatewayComplex":["Complex Gateway","Other complex routing semantics."],"sequenceFlow":["Sequence Flow","Orders flow inside a process."],"conditionalFlow":["Conditional Sequence Flow","Sequence Flow with a condition."],"defaultFlow":["Default Sequence Flow","Fallback path marked by a slash."],"messageFlow":["Message Flow","Communication between Participants."],"association":["Association","Links information without controlling flow."],"dataObject":["Data Object","Information used or produced."],"dataStore":["Data Store","Persistent process data."],"pool":["Pool / Participant","Participant in a collaboration."],"lane":["Lane","Internal category within a Pool."],"messageCatchIntermediate":["Catching Message Intermediate Event","Waits for an incoming message."],"messageThrowIntermediate":["Throwing Message Intermediate Event","Sends a message event."],"timerStart":["Timer Start Event","Starts by time trigger."],"timerIntermediate":["Timer Intermediate Event","Waits for time."],"boundaryTimerInterrupt":["Interrupting Boundary Timer Event","Timeout that stops the activity."],"boundaryTimerNonInterrupt":["Non-interrupting Boundary Timer Event","Creates another path without stopping work."],"terminateEnd":["Terminate End Event","Stops all tokens in scope."],"implicitParallelSplit":["Two outgoing Sequence Flows","Both unconditional outgoing flows from an Activity are activated."],"initiatingMessageFlow":["Initiating Message Flow + decorator","A Message Flow decorated with an unfilled envelope indicating the initiating message."],"nonInitiatingMessageFlow":["Non-initiating Message Flow + decorator","A Message Flow decorated with a filled/gray envelope indicating a non-initiating message."],"startMessage":["Message Start Event","Starts when the process catches a message."],"startConditional":["Conditional Start Event","Starts when a specified condition becomes true."],"startSignal":["Signal Start Event","Starts when a matching signal is caught."],"startMultiple":["Multiple Start Event","Starts when any one of multiple configured triggers occurs."],"startParallelMultiple":["Parallel Multiple Start Event","Starts when all configured triggers have occurred."],"escalationThrowIntermediate":["Throw Escalation Intermediate Event","Throws an escalation while the process continues according to its event semantics."],"compensationThrowIntermediate":["Throw Compensation Intermediate Event","Throws a compensation trigger."],"boundaryError":["Boundary Error Event","Catches an error on the boundary and interrupts the attached activity."],"boundaryCompensation":["Boundary Compensation Event","Catches a compensation trigger on an activity boundary."],"boundaryCancel":["Boundary Cancel Event","Catches cancellation on the boundary of a Transaction."],"nameReviewRequest":["Review request","Clear activity name: active verb plus business object."],"nameRequestReview":["Request review","Different business action: requests a review rather than performing it."],"nameReview":["Review","Too vague: the business object is missing."],"nameRequest":["Request","Too vague: it does not state the work."],"nameOrderReceived":["Order received","Event name describes something that happened."],"nameReceiveOrder":["Receive order","Task-style action, not an event-state name."],"nameMessageEvent":["Message event","Uses the element type instead of business meaning."],"nameStart":["Start","Does not explain what happened."],"nameEveryWeekday0900":["Every weekday at 09:00","A Timer Event name states its schedule."],"nameWaitTimer":["Wait timer","Vague and task-like."],"nameTimerEvent":["Timer event","Names the BPMN type, not the schedule."],"nameTomorrow":["Tomorrow","Ambiguous schedule."],"namePurchaseOrderApproved":["Purchase order [Approved]","Qualified business object with an explicit state."],"nameDataObject":["Data object","Names the BPMN element type, not the business information."],"nameApproved":["Approved","State without identifying the business object."],"nameDocument":["Document","Too generic for a business object."],"namePaymentApprovedQ":["Is payment approved?","An interrogative phrase suitable for a diverging Exclusive Gateway."],"nameCheckPayment":["Check payment","Describes work, which belongs in an Activity."],"namePaymentDecision":["Payment decision","A vague noun phrase, not an explicit routing question."],"nameGateway":["Gateway","Names the BPMN element type."],"nameApprovedOutcome":["Approved","Clear outcome for an outgoing conditional flow."],"nameIfApproved":["If approved","Condition phrasing rather than an outcome label."],"nameYes":["Yes","Can be understandable but is less explicit without the gateway question."],"nameNoLabel":["No label","Default Sequence Flows normally remain unnamed."],"nameDefault":["Default","Names the technical type unnecessarily."],"nameOtherwise":["Otherwise","A tempting label, but the slash already denotes the default flow."],"namePaymentProvider":["Payment Provider","Names the Participant represented by the Pool."],"namePaymentProcess":["Payment Process","Names a process rather than the Participant."],"nameExternalPool":["External Pool","Names the BPMN container type, not the Participant."],"nameProviderSystem":["Provider system","May be a lane/category, but is not the participant name in this example."],"nameAccountsPayable":["Accounts Payable","A meaningful category/role for a Lane."],"nameApproveInvoice":["Approve invoice","An Activity name, not a Lane category."],"nameLane":["Lane","Names the BPMN element type."],"nameDepartment":["Department","Too generic to identify the category."]},"a11y.menu":"Open menu","a11y.setup":"Open setup","a11y.close":"Close","meta.description":"Process Panic! — a mobile-first educational BPMN game.","debrief.finalContinue":"Open final debrief","game.restart":"Restart game","game.restartConfirm":"Restart Process Panic! from Mission 1 and erase all progress on this device?","mission.option":"Option","menu.project":"Project page","debrief.errors":"Errors in this lesson","debrief.noErrors":"No incorrect choices in this lesson.","debrief.youChose":"You chose","debrief.correctWas":"Correct element","debrief.rule":"Why","final.errors":"Error patterns across the course","final.noErrors":"No incorrect choices were recorded.","final.times":"times","reference.naming":"BPMN Naming Conventions Best Practices"},"pt":{"menu.course":"Mapa do curso","menu.glossary":"Guia de símbolos BPMN","menu.reference":"Referências","menu.about":"Sobre","menu.install":"Instalar aplicativo","menu.reset":"Reiniciar progresso","setup.title":"Configuração","setup.language":"Idioma","setup.theme":"Tema","setup.theme.system":"Sistema","setup.theme.light":"Claro","setup.theme.dark":"Escuro","setup.motion":"Animação","setup.motion.normal":"Normal","setup.motion.reduced":"Reduzida","setup.installHint":"A instalação aparece quando o navegador oferece suporte a aplicativos web.","setup.saved":"As alterações são aplicadas imediatamente.","home.kicker":"Jogo de aprendizagem BPMN para celular","home.title":"Conserte o processo. Depois execute.","home.lead":"Aprenda BPMN escolhendo a notação, executando o comportamento dos tokens, observando falhas e analisando o que aconteceu.","home.continue":"Continuar curso","home.start":"Iniciar curso","home.completed":"missões concluídas","home.stars":"estrelas","home.lessons":"aulas","home.course":"Curso","home.lesson":"Aula","home.done":"Aula concluída","mission.label":"Missão","mission.run":"Executar processo","mission.hint":"Dica","mission.retry":"Tentar outra opção","mission.next":"Próxima missão","mission.toDebrief":"Debrief da aula","mission.correct":"O processo se comporta como esperado.","mission.wrong":"A execução revela um problema de modelagem.","feedback.observe":"Observe o comportamento e compare-o com a regra BPMN.","debrief.completed":"Aula concluída","debrief.accuracy":"Acertos na primeira tentativa","debrief.hints":"Dicas usadas","debrief.stars":"Estrelas obtidas","debrief.keyIdeas":"O que esta aula deve deixar claro","debrief.continue":"Continuar para a próxima aula","debrief.replay":"Refazer aula","debrief.course":"Voltar ao mapa do curso","final.title":"Debrief final","final.subtitle":"Você concluiu o percurso BPMN da v0.2.","final.score":"Total de estrelas","final.accuracy":"Acertos na primeira tentativa","final.hints":"Dicas usadas","final.message":"O objetivo vai além de memorizar símbolos: você deve conseguir prever como tokens, mensagens, participantes, gateways e eventos alteram o comportamento do processo.","final.replay":"Revisar o curso","final.reset":"Começar de novo","glossary.title":"Guia de símbolos BPMN","glossary.lead":"Os símbolos são redesenhados no estilo visual usado pelo BPMN Quick Guide e pela BPMN 2.0. A cor indica apenas estado do jogo; não tem semântica normativa em BPMN.","glossary.events":"Eventos","glossary.activities":"Atividades","glossary.gateways":"Gateways","glossary.flows":"Fluxos e associações","glossary.data":"Dados","glossary.swimlanes":"Pools e raias","reference.title":"Referências e política de notação","reference.quick":"BPMN Quick Guide","reference.omg":"OMG BPMN 2.0.2","reference.policy":"Process Panic redesenha a notação como SVG nativo e não incorpora imagens do Quick Guide. O jogo privilegia gateways explícitos e layouts legíveis da esquerda para a direita.","reference.course":"Os materiais do curso fornecidos por Geraldo Xexéo definem a ordem didática usada pelo jogo.","about.title":"Sobre o Process Panic!","about.text":"Process Panic! é um jogo educacional para navegador do LUDES/PESC criado para tornar visível a semântica de execução da BPMN. O ciclo central é escolher → executar → observar → analisar.","about.version":"Versão v0.2","about.license":"Licença MIT — Copyright (c) 2026 Geraldo Xexéo.","install.unavailable":"Seu navegador não apresentou a opção de instalação. Quando disponível, use o menu do navegador e escolha Adicionar à tela inicial / Instalar aplicativo.","reset.confirm":"Reiniciar todo o progresso do Process Panic! neste dispositivo?","toast.installed":"Process Panic! foi instalado.","toast.reset":"Progresso reiniciado.","toast.lang":"Idioma alterado imediatamente.","lessons":[["Introdução","Eventos básicos, tarefas, escolhas, paralelismo e lógica de tokens.",["Uma instância precisa de início e fim explícitos.","Tarefas executam trabalho; gateways roteiam o fluxo.","Gateways exclusivos escolhem um caminho; paralelos criam ou sincronizam caminhos concorrentes."]],["Fluxos, dados e atividades","Fluxo default, objetos de dados, tipos de tarefa e subprocessos.",["Fluxo de Sequência ordena o trabalho dentro do processo.","Objetos de Dados representam informação; Data Stores representam persistência.","O tipo de tarefa comunica quem ou o que executa o trabalho."]],["Pools, raias e mensagens","Responsabilidade interna, participantes e comunicação.",["Uma Pool representa um Participante; uma Raia categoriza trabalho dentro dela.","Fluxo de Sequência pode cruzar raias, mas não limites de Pools.","Fluxo de Mensagem conecta Participantes diferentes."]],["Gateways","Semântica de XOR, AND, OR e gateways baseados em eventos.",["Gateways roteiam o fluxo; não executam a decisão de negócio.","Joins paralelos sincronizam todos os ramos necessários.","Gateways Baseados em Eventos roteiam conforme o primeiro evento que ocorre."]],["Eventos","Posição, mensagens, timers de borda e terminação.",["Círculos simples, duplos e grossos distinguem início, intermediário e fim.","Marcadores de mensagem distinguem captura de lançamento.","Eventos de borda interruptivos param a atividade; Terminate encerra todos os tokens no escopo."]],["Nomes de atividades e eventos","Escolha nomes que tornem trabalho, gatilhos, estados e objetos de negócio legíveis sem explicação extra.",["Atividades usam frases significativas com verbo e objeto.","Eventos descrevem o que ocorreu, o horário, a condição ou o estado final.","Objetos de dados usam substantivos de negócio significativos e estados."]],["Nomes de gateways e colaboração","Nomeie perguntas, resultados, participantes e categorias para tornar explícitos o roteamento e a responsabilidade.",["Gateways Exclusivos divergentes são melhor nomeados como perguntas.","Condições de saída são nomeadas como resultados; fluxos default normalmente ficam sem nome.","Pools recebem o nome dos participantes; lanes recebem o nome de categorias como papéis, sistemas ou departamentos."]]],"missions":[["Um processo começa","Um pedido de pizza chega, mas o modelo não tem o elemento que cria a instância do processo.","Um Evento Inicial não possui Fluxo de Sequência de entrada.","Um Evento Inicial Nenhum cria o primeiro token deste pedido."],["Trabalho não é evento","O atendente precisa registrar o pedido no sistema. Escolha o elemento BPMN que representa esse trabalho.","Procure uma unidade atômica de trabalho.","Uma Tarefa recebe um token, executa trabalho e repassa o token."],["Mostre o estado final","A pizza foi entregue e este caminho terminou. Escolha o elemento que marca seu fim.","Um Evento Final usa um círculo de borda grossa.","Um Evento Final Nenhum consome o token que chega e encerra este caminho."],["Apenas um caminho","Depois de verificar a disponibilidade, o resultado é quarto disponível ou sem quarto. Encaminhe exatamente uma alternativa.","A atividade determina o resultado; o gateway apenas roteia o fluxo.","Um Gateway Exclusivo encaminha um único fluxo de saída."],["Duas coisas ao mesmo tempo","A cozinha deve preparar o prato principal e o acompanhamento de forma independente, e ambos são necessários.","Use um gateway que ative todos os ramos de saída.","Um Gateway Paralelo cria tokens concorrentes para os dois ramos."],["Um caminho de fallback","Várias condições podem encaminhar uma solicitação. Se nenhuma for verdadeira, um caminho de fallback deve ser seguido.","Procure o Fluxo de Sequência marcado por uma barra junto à origem.","Um Fluxo de Sequência Default é usado quando as outras condições elegíveis são falsas."],["Informação, não trabalho","Uma tarefa lê e atualiza uma ficha de pedido. Escolha o elemento BPMN que representa a ficha.","A ficha é dado, não trabalho.","Um Objeto de Dados representa informação usada ou produzida pelas atividades."],["Quem executa?","O processo chama automaticamente um serviço web externo para calcular o imposto.","Escolha o tipo de tarefa para trabalho automatizado por aplicação ou serviço.","Uma Tarefa de Serviço representa trabalho automatizado realizado por uma aplicação ou serviço."],["Oculte o detalhe interno","Preparar remessa contém vários passos internos, mas este diagrama deve mantê-los ocultos.","Procure o marcador de atividade com um pequeno sinal de mais.","Um Subprocesso colapsado oculta o fluxo interno e continua fazendo parte do processo pai."],["Organize a responsabilidade","O restaurante é um participante, enquanto caixa e cozinha realizam trabalhos diferentes dentro dele.","Use uma partição dentro de uma Pool, não outro Participante.","Uma Raia organiza atividades dentro de uma Pool."],["Cruze papéis internos","Caixa e cozinha são raias diferentes da mesma pool. Qual conector pode cruzar o limite entre elas?","Limites de raias não separam Participantes.","O Fluxo de Sequência pode cruzar raias porque o trabalho continua no mesmo processo."],["Fale com outro participante","O restaurante envia uma solicitação de pagamento a um provedor externo em outra Pool.","A comunicação entre Participantes usa um conector tracejado com círculo aberto na origem.","Fluxo de Mensagem conecta Participantes ou Pools diferentes."],["Um provedor caixa-preta","O provedor de pagamento participa, mas seu processo interno é desconhecido e irrelevante.","Um Participante não precisa expor seu processo interno.","Uma Pool caixa-preta representa o Participante externo."],["Exclusivo, não paralelo","Depois de Avaliar solicitação, o resultado é Aprovado ou Rejeitado, nunca os dois.","A atividade determina o resultado; o gateway o encaminha.","Um Gateway Exclusivo seleciona exatamente um fluxo de saída."],["Espere pelos dois","Dois ramos paralelos preparam um documento e obtêm uma assinatura. Continue somente quando ambos terminarem.","Uma divisão paralela normalmente precisa de uma junção paralela quando todos os ramos são obrigatórios.","Um Gateway Paralelo espera todos os tokens de entrada necessários."],["Uma ou mais opções","Um cliente pode solicitar embalagem para presente, seguro ou ambos.","Não é comportamento de exatamente um nem de todos os caminhos.","Um Gateway Inclusivo ativa um ou mais fluxos de saída conforme as condições."],["O que acontecer primeiro","Depois de enviar uma solicitação, espere uma mensagem de resposta ou um timeout. O primeiro evento determina o caminho.","Os alvos depois deste gateway são eventos de captura ou atividades de recepção.","Um Gateway Baseado em Eventos encaminha pelo primeiro evento subsequente que ocorrer."],["Espere antes de continuar","Depois de enviar um lembrete, o processo deve esperar até o próximo dia útil antes de continuar. Qual elemento BPMN pertence ao ponto de espera?","Use um evento intermediário catch disparado pelo tempo, e não um evento de borda ligado a uma atividade.","Um Evento Intermediário de Timer faz o token esperar até que a condição temporal seja atingida; depois o processo continua."],["Capture a mensagem","Durante o processo, a execução deve esperar até chegar uma mensagem do cliente.","Marcadores de mensagem de captura não são preenchidos; os de lançamento são preenchidos.","Um Evento Intermediário de Mensagem de captura espera a mensagem de entrada."],["Timeout da atividade","Uma chamada de serviço pode demorar demais. Após 30 segundos, abandone a chamada e siga por um caminho de timeout.","O timeout precisa interromper a atividade à qual está anexado.","Um Evento de Borda de Timer interruptivo cancela a atividade e cria o caminho de timeout."],["Pare todos os caminhos ativos","Um cancelamento fatal chega enquanto ramos paralelos estão ativos. Todos os tokens deste escopo de processo devem parar.","Um Evento Final normal encerra somente o fluxo que chega a ele.","Um Evento Final de Terminação encerra imediatamente todos os tokens no escopo atual do processo."],["Paralelo sem gateway","Escolha o fragmento que mostra corretamente uma atividade ativando dois caminhos de saída incondicionais sem gateway explícito.","Em BPMN, vários Sequence Flows incondicionais saindo de uma Atividade são todos ativados.","Dois Sequence Flows incondicionais saindo de uma Atividade criam paralelismo implícito; um Gateway Paralelo explícito é mais claro, mas não obrigatório."],["Informação persistente","O processo lê e atualiza registros de clientes que devem continuar disponíveis depois que esta instância terminar. O que representa esse repositório persistente?","Um documento que circula pelo trabalho é diferente de armazenamento persistente.","Um Data Store representa um banco de dados ou repositório persistente semelhante."],["Trabalho manual","Uma pessoa inspeciona fisicamente um pacote sem usar uma aplicação. Qual tipo de Task é adequado?","O trabalho é feito por uma pessoa sem auxílio de software.","Uma Manual Task representa trabalho humano realizado sem auxílio de uma aplicação de software."],["A mensagem que inicia a colaboração","A primeira mensagem do cliente inicia a interação. Escolha a notação de Message Flow com o decorador iniciador.","O decorador é um envelope não preenchido colocado sobre o Message Flow.","O Initiating Message Flow with Decorator identifica a mensagem que inicia a troca na colaboração."],["Uma mensagem posterior na colaboração","Uma resposta posterior pertence a uma interação já estabelecida. Escolha o Message Flow não iniciador com decorador.","Compare o preenchimento do envelope decorador.","O Message Flow não iniciador decorado usa o envelope preenchido/cinza."],["Uma regra que os gateways padrão não expressam","Uma junção deve continuar depois que quaisquer três de cinco ramos de entrada terminarem. Qual gateway representa essa sincronização personalizada?","Exclusivo, Paralelo e Inclusivo não expressam diretamente essa regra de limiar.","Um Gateway Complexo é usado para sincronização ou roteamento complexo não representado pelos outros tipos."],["Divida em trabalhos paralelos obrigatórios","Depois que um pedido é aceito, é preciso reservar estoque e gerar a fatura. Nenhum gateway de fechamento é mostrado. Qual elemento deve criar os dois ramos?","Não deduza a resposta por um + correspondente mais adiante; ele não existe.","Um Gateway Paralelo ativa todos os ramos de saída."],["Inicie com uma mensagem recebida","Uma nova instância do processo deve ser criada quando chega uma mensagem de pedido.","O envelope é um gatilho catch dentro do círculo fino do Evento Inicial.","Um Evento Inicial de Mensagem captura a mensagem recebida e cria uma instância."],["Inicie por horário","Um processo de conciliação começa automaticamente todo dia útil às 09:00.","Procure o marcador de relógio dentro do Evento Inicial.","Um Evento Inicial de Timer cria a instância de acordo com um horário ou condição temporal."],["Inicie quando uma condição ficar verdadeira","Um processo de monitoramento começa quando o estoque cai abaixo do nível de reposição.","É uma condição tornando-se verdadeira, não um relógio ou mensagem.","Um Evento Inicial Condicional começa quando sua condição configurada é satisfeita."],["Inicie por um sinal difundido","Vários processos independentes podem começar quando a empresa difunde o sinal 'Desastre declarado'.","Sinais são difundidos e usam um marcador triangular.","Um Evento Inicial de Sinal captura um sinal difundido correspondente."],["Qualquer um de vários gatilhos pode iniciar","Um caso pode começar por mensagem, sinal ou outro gatilho configurado; qualquer um é suficiente.","O pentágono representa Multiple.","Um Evento Inicial Múltiplo começa quando qualquer um dos gatilhos configurados ocorre."],["Todos os gatilhos configurados são necessários","Um caso só deve começar depois que todos os gatilhos iniciadores configurados ocorrerem.","O sinal de mais dentro do Evento Inicial representa Parallel Multiple.","Um Evento Inicial Múltiplo Paralelo exige todos os gatilhos configurados."],["Escalone sem terminar o processo","Durante o processamento, gere uma escalation para um nível superior como evento intermediário throw.","O marcador de Escalation é o chevron para cima; em throw ele é preenchido.","Um Evento Intermediário Throw de Escalation emite uma escalada a partir do fluxo atual."],["Dispare compensação","O processo deve disparar compensação por trabalho já concluído.","Compensação usa o marcador de dois triângulos para a esquerda; em throw ele é preenchido.","Um Evento Intermediário Throw de Compensação dispara o tratamento de compensação."],["Capture um erro de uma atividade","Uma atividade falha com um Erro BPMN e a atividade normal deve parar enquanto começa um caminho de exceção.","Eventos de borda de erro são interruptivos e usam o marcador de raio.","Um Evento de Borda de Erro captura o erro e interrompe a atividade anexada."],["Capture compensação na borda","Uma atividade concluída possui um tratador de compensação que deve ser chamado durante rollback.","Procure o marcador não preenchido de dois triângulos para a esquerda na borda.","Um Evento de Borda de Compensação identifica o tratador de compensação anexado à atividade."],["Capture cancelamento de transação","Dentro de uma Transação, um cancelamento deve ser capturado na borda da transação.","Cancel usa o marcador em X e é específico da semântica de cancelamento de Transaction.","Um Evento de Borda de Cancelamento captura o cancelamento na borda de uma Transação."],["Nomeie o trabalho","Escolha o melhor nome BPMN para uma atividade que examina uma solicitação de negócio.","Use um verbo ativo significativo mais o objeto de negócio.","'Revisar solicitação' informa diretamente o trabalho sem nomear o tipo do elemento BPMN."],["Nomeie o que aconteceu","Escolha o melhor nome para um Evento de Mensagem que ocorre quando chega um pedido.","Eventos descrevem algo que aconteceu, não um trabalho a realizar.","'Pedido recebido' descreve a ocorrência de negócio com particípio passado."],["Nomeie o timer","Escolha o melhor nome para um Evento Timer que dispara às 09:00 de cada dia útil.","Nomes de eventos Timer devem informar o agendamento.","'Todo dia útil às 09:00' comunica o gatilho real."],["Nomeie o objeto de dados","Escolha o melhor nome para um Data Object que representa um pedido de compra aprovado.","Use o nome do objeto de negócio e, quando útil, seu estado entre colchetes.","'Pedido de compra [Aprovado]' identifica a informação e seu estado."],["Nomeie o ponto de decisão","Escolha o melhor nome para um Gateway Exclusivo divergente sobre aprovação de pagamento.","Um Gateway Exclusivo divergente é melhor nomeado com uma frase interrogativa.","'Pagamento aprovado?' torna explícita a pergunta de roteamento."],["Nomeie a condição de saída","A pergunta do gateway é 'Pagamento aprovado?'. Escolha o melhor rótulo para o Sequence Flow de sucesso.","Nomeie condições de saída como resultados.","'Aprovado' é um resultado conciso e coerente com a pergunta do gateway."],["Nomeie o fluxo default","Qual é o melhor nome para o Default Sequence Flow?","A barra já identifica o caminho default.","A boa prática é normalmente deixar o Default Sequence Flow sem nome."],["Nomeie a Pool","Uma Pool black box representa a empresa externa que processa pagamentos. Escolha o melhor nome.","Pools são nomeadas pelos Participantes, não pelos processos.","'Provedor de pagamento' nomeia o Participante representado pela Pool."],["Nomeie a Lane","Uma Lane agrupa as pessoas responsáveis pelas faturas de fornecedores. Escolha o melhor nome.","Lanes são nomeadas por categorias como papéis, sistemas ou departamentos.","'Contas a pagar' identifica a categoria organizacional responsável pelo trabalho."]],"diagram":{"record":"Registrar pedido","prepare":"Preparar pedido","deliver":"Entregar pedido","check":"Verificar disponibilidade","available":"Quarto disponível","noneAvailable":"Sem quarto","main":"Preparar prato principal","side":"Preparar acompanhamento","flowA":"Outra condição","fallback":"Fallback","form":"Ficha de pedido","tax":"Calcular imposto","shipment":"Preparar remessa","restaurant":"Restaurante","cashier":"Caixa","kitchen":"Cozinha","provider":"Provedor de pagamento","unknown":"Processo interno não exibido","request":"Solicitação de pagamento","evaluate":"Avaliar solicitação","approved":"Aprovado","rejected":"Rejeitado","document":"Preparar documento","signature":"Obter assinatura","continue":"Continuar","gift":"Embalagem para presente","insurance":"Seguro","reply":"Resposta recebida","timeout":"Timeout","wait":"Esperar mensagem","service":"Chamar serviço","flowB":"Trabalho paralelo","reminder":"Enviar lembrete"},"elements":{"startNone":["Evento Inicial","Inicia uma instância do processo."],"intermediateNone":["Evento Intermediário","Ocorre durante um processo em execução."],"endNone":["Evento Final","Encerra o fluxo atual."],"task":["Tarefa","Unidade atômica de trabalho."],"userTask":["Tarefa de Usuário","Trabalho humano usando software."],"manualTask":["Tarefa Manual","Trabalho humano sem software."],"serviceTask":["Tarefa de Serviço","Trabalho automatizado por aplicação ou serviço."],"businessRuleTask":["Tarefa de Regra de Negócio","Avalia regras de negócio."],"scriptTask":["Tarefa de Script","Executa um script no motor de processos."],"sendTask":["Tarefa de Envio","Envia uma mensagem como trabalho."],"receiveTask":["Tarefa de Recepção","Espera uma mensagem como trabalho."],"subProcess":["Subprocesso colapsado","Oculta detalhes do processo interno."],"callActivity":["Atividade de Chamada","Invoca uma atividade global reutilizável."],"gatewayExclusive":["Gateway Exclusivo","Encaminha exatamente uma alternativa."],"gatewayParallel":["Gateway Paralelo","Ativa ou sincroniza todos os caminhos."],"gatewayInclusive":["Gateway Inclusivo","Ativa um ou mais caminhos."],"gatewayEvent":["Gateway Baseado em Eventos","Encaminha pelo primeiro evento que ocorre."],"gatewayComplex":["Gateway Complexo","Outras semânticas complexas de roteamento."],"sequenceFlow":["Fluxo de Sequência","Ordena o fluxo dentro de um processo."],"conditionalFlow":["Fluxo de Sequência Condicional","Fluxo de Sequência com condição."],"defaultFlow":["Fluxo de Sequência Default","Caminho de fallback marcado por uma barra."],"messageFlow":["Fluxo de Mensagem","Comunicação entre Participantes."],"association":["Associação","Liga informação sem controlar o fluxo."],"dataObject":["Objeto de Dados","Informação usada ou produzida."],"dataStore":["Armazenamento de Dados","Dados persistentes do processo."],"pool":["Pool / Participante","Participante de uma colaboração."],"lane":["Raia","Categoria interna dentro de uma Pool."],"messageCatchIntermediate":["Evento Intermediário de Mensagem de captura","Espera uma mensagem de entrada."],"messageThrowIntermediate":["Evento Intermediário de Mensagem de lançamento","Envia uma mensagem como evento."],"timerStart":["Evento Inicial de Timer","Inicia por um gatilho de tempo."],"timerIntermediate":["Evento Intermediário de Timer","Espera um tempo."],"boundaryTimerInterrupt":["Evento de Borda de Timer interruptivo","Timeout que interrompe a atividade."],"boundaryTimerNonInterrupt":["Evento de Borda de Timer não interruptivo","Cria outro caminho sem interromper o trabalho."],"terminateEnd":["Evento Final de Terminação","Encerra todos os tokens do escopo."],"implicitParallelSplit":["Dois Fluxos de Sequência saindo da atividade","Os dois fluxos de saída incondicionais de uma Atividade são ativados."],"initiatingMessageFlow":["Message Flow iniciador + decorador","Message Flow decorado com envelope não preenchido indicando a mensagem iniciadora."],"nonInitiatingMessageFlow":["Message Flow não iniciador + decorador","Message Flow decorado com envelope preenchido/cinza indicando mensagem não iniciadora."],"startMessage":["Evento Inicial de Mensagem","Inicia quando o processo captura uma mensagem."],"startConditional":["Evento Inicial Condicional","Inicia quando uma condição especificada se torna verdadeira."],"startSignal":["Evento Inicial de Sinal","Inicia quando um sinal correspondente é capturado."],"startMultiple":["Evento Inicial Múltiplo","Inicia quando qualquer um de vários gatilhos configurados ocorre."],"startParallelMultiple":["Evento Inicial Múltiplo Paralelo","Inicia quando todos os gatilhos configurados ocorreram."],"escalationThrowIntermediate":["Evento Intermediário Throw de Escalation","Dispara uma escalada durante o processo."],"compensationThrowIntermediate":["Evento Intermediário Throw de Compensação","Dispara um gatilho de compensação."],"boundaryError":["Evento de Borda de Erro","Captura um erro na borda e interrompe a atividade anexada."],"boundaryCompensation":["Evento de Borda de Compensação","Captura um gatilho de compensação na borda de uma atividade."],"boundaryCancel":["Evento de Borda de Cancelamento","Captura o cancelamento na borda de uma Transação."],"nameReviewRequest":["Revisar solicitação","Bom nome de atividade: verbo ativo mais objeto de negócio."],"nameRequestReview":["Solicitar revisão","É outra ação: solicita uma revisão em vez de executá-la."],"nameReview":["Revisar","Vago: falta o objeto de negócio."],"nameRequest":["Solicitação","Vago: não informa o trabalho."],"nameOrderReceived":["Pedido recebido","Nome de evento descreve algo que aconteceu."],"nameReceiveOrder":["Receber pedido","Forma de tarefa, não nome de estado/evento."],"nameMessageEvent":["Evento de mensagem","Usa o tipo do elemento em vez do significado de negócio."],"nameStart":["Início","Não explica o que ocorreu."],"nameEveryWeekday0900":["Todo dia útil às 09:00","Nome de Timer informa seu agendamento."],"nameWaitTimer":["Esperar timer","Vago e com forma de tarefa."],"nameTimerEvent":["Evento timer","Nomeia o tipo BPMN, não o agendamento."],"nameTomorrow":["Amanhã","Agendamento ambíguo."],"namePurchaseOrderApproved":["Pedido de compra [Aprovado]","Objeto de negócio qualificado com estado explícito."],"nameDataObject":["Objeto de dados","Nomeia o tipo BPMN, não a informação de negócio."],"nameApproved":["Aprovado","Estado sem identificar o objeto de negócio."],"nameDocument":["Documento","Genérico demais para um objeto de negócio."],"namePaymentApprovedQ":["Pagamento aprovado?","Pergunta adequada para um Gateway Exclusivo divergente."],"nameCheckPayment":["Verificar pagamento","Descreve trabalho, que pertence a uma Atividade."],"namePaymentDecision":["Decisão de pagamento","Expressão vaga, não uma pergunta explícita de roteamento."],"nameGateway":["Gateway","Nomeia o tipo de elemento BPMN."],"nameApprovedOutcome":["Aprovado","Resultado claro para um fluxo condicional de saída."],"nameIfApproved":["Se aprovado","Formulação de condição em vez de resultado."],"nameYes":["Sim","Pode funcionar, mas é menos explícito sem a pergunta do gateway."],"nameNoLabel":["Sem nome","Fluxos de Sequência default normalmente ficam sem nome."],"nameDefault":["Default","Nomeia desnecessariamente o tipo técnico."],"nameOtherwise":["Caso contrário","Rótulo tentador, mas a barra já marca o fluxo default."],"namePaymentProvider":["Provedor de pagamento","Nomeia o Participante representado pela Pool."],"namePaymentProcess":["Processo de pagamento","Nomeia um processo, não o Participante."],"nameExternalPool":["Pool externa","Nomeia o contêiner BPMN, não o Participante."],"nameProviderSystem":["Sistema do provedor","Pode ser categoria de lane, mas não é o Participante neste exemplo."],"nameAccountsPayable":["Contas a pagar","Categoria/papel significativo para uma Lane."],"nameApproveInvoice":["Aprovar fatura","Nome de Atividade, não de categoria da Lane."],"nameLane":["Lane","Nomeia o tipo de elemento BPMN."],"nameDepartment":["Departamento","Genérico demais para identificar a categoria."]},"a11y.menu":"Abrir menu","a11y.setup":"Abrir configurações","a11y.close":"Fechar","meta.description":"Process Panic! — um jogo educacional de BPMN focado em celular.","debrief.finalContinue":"Abrir debrief geral","game.restart":"Reiniciar jogo","game.restartConfirm":"Reiniciar o Process Panic! na Missão 1 e apagar todo o progresso deste dispositivo?","mission.option":"Opção","menu.project":"Página do projeto","debrief.errors":"Erros nesta aula","debrief.noErrors":"Nenhuma escolha incorreta nesta aula.","debrief.youChose":"Você escolheu","debrief.correctWas":"Elemento correto","debrief.rule":"Por quê","final.errors":"Padrões de erro no curso","final.noErrors":"Nenhuma escolha incorreta foi registrada.","final.times":"vezes","reference.naming":"Boas práticas de nomes em BPMN"},"fr":{"menu.course":"Parcours du cours","menu.glossary":"Guide des symboles BPMN","menu.reference":"Références","menu.about":"À propos","menu.install":"Installer l’application","menu.reset":"Réinitialiser la progression","setup.title":"Réglages","setup.language":"Langue","setup.theme":"Thème","setup.theme.system":"Système","setup.theme.light":"Clair","setup.theme.dark":"Sombre","setup.motion":"Animation","setup.motion.normal":"Normale","setup.motion.reduced":"Réduite","setup.installHint":"L’installation apparaît lorsque le navigateur prend en charge les applications web.","setup.saved":"Les modifications s’appliquent immédiatement.","home.kicker":"Jeu mobile d’apprentissage BPMN","home.title":"Réparez le processus. Puis exécutez-le.","home.lead":"Apprenez BPMN en choisissant la notation, en exécutant le comportement des jetons, en observant les défaillances et en analysant ce qui s’est passé.","home.continue":"Continuer le cours","home.start":"Commencer le cours","home.completed":"missions terminées","home.stars":"étoiles","home.lessons":"leçons","home.course":"Cours","home.lesson":"Leçon","home.done":"Leçon terminée","mission.label":"Mission","mission.run":"Exécuter le processus","mission.hint":"Indice","mission.retry":"Essayer un autre choix","mission.next":"Mission suivante","mission.toDebrief":"Débriefing de la leçon","mission.correct":"Le processus se comporte comme prévu.","mission.wrong":"L’exécution révèle un problème de modélisation.","feedback.observe":"Observez le comportement et comparez-le à la règle BPMN.","debrief.completed":"Leçon terminée","debrief.accuracy":"Réussite au premier essai","debrief.hints":"Indices utilisés","debrief.stars":"Étoiles obtenues","debrief.keyIdeas":"Ce que cette leçon doit laisser clair","debrief.continue":"Passer à la leçon suivante","debrief.replay":"Rejouer la leçon","debrief.course":"Retour au parcours","final.title":"Débriefing final","final.subtitle":"Vous avez terminé le parcours BPMN de la v0.2.","final.score":"Total des étoiles","final.accuracy":"Réussite au premier essai","final.hints":"Indices utilisés","final.message":"L’objectif dépasse la mémorisation des symboles : vous devez pouvoir prévoir comment jetons, messages, participants, gateways et événements modifient le comportement du processus.","final.replay":"Revoir le cours","final.reset":"Recommencer","glossary.title":"Guide des symboles BPMN","glossary.lead":"Les symboles sont redessinés dans le style visuel du BPMN Quick Guide et de BPMN 2.0. La couleur indique seulement l’état du jeu ; elle n’a pas de sémantique normative BPMN.","glossary.events":"Événements","glossary.activities":"Activités","glossary.gateways":"Gateways","glossary.flows":"Flux et associations","glossary.data":"Données","glossary.swimlanes":"Pools et lanes","reference.title":"Références et politique de notation","reference.quick":"BPMN Quick Guide","reference.omg":"OMG BPMN 2.0.2","reference.policy":"Process Panic redessine la notation en SVG natif et n’intègre pas les images du Quick Guide. Le jeu privilégie les gateways explicites et les diagrammes lisibles de gauche à droite.","reference.course":"Les supports de cours fournis par Geraldo Xexéo définissent l’ordre pédagogique du jeu.","about.title":"À propos de Process Panic!","about.text":"Process Panic! est un jeu éducatif pour navigateur de LUDES/PESC conçu pour rendre visible la sémantique d’exécution de BPMN. La boucle centrale est choisir → exécuter → observer → analyser.","about.version":"Version v0.2","about.license":"Licence MIT — Copyright (c) 2026 Geraldo Xexéo.","install.unavailable":"Votre navigateur n’a pas proposé l’installation. Lorsqu’elle est disponible, utilisez son menu et choisissez Ajouter à l’écran d’accueil / Installer l’application.","reset.confirm":"Réinitialiser toute la progression de Process Panic! sur cet appareil ?","toast.installed":"Process Panic! est installé.","toast.reset":"Progression réinitialisée.","toast.lang":"Langue changée immédiatement.","lessons":[["Introduction","Événements de base, tâches, choix, parallélisme et logique des jetons.",["Une instance a besoin d’un début et d’une fin explicites.","Les tâches effectuent le travail ; les gateways routent le flux.","Les gateways exclusifs choisissent un chemin ; les parallèles créent ou synchronisent des chemins concurrents."]],["Flux, données et activités","Flux par défaut, objets de données, types de tâches et sous-processus.",["Le Sequence Flow ordonne le travail dans un processus.","Les Data Objects représentent l’information ; les Data Stores représentent la persistance.","Le type de tâche indique qui ou quoi exécute le travail."]],["Pools, lanes et messages","Responsabilité interne, participants et communication.",["Une Pool représente un Participant ; une Lane catégorise le travail interne.","Le Sequence Flow peut traverser les lanes, mais pas les limites de Pools.","Le Message Flow relie des Participants différents."]],["Gateways","Sémantique des XOR, AND, OR et gateways basés sur les événements.",["Les gateways routent le flux ; ils ne prennent pas la décision métier.","Les convergences parallèles synchronisent toutes les branches requises.","Les Gateways Basés sur les Événements routent selon le premier événement qui survient."]],["Événements","Position, messages, timers de bordure et terminaison.",["Les cercles simple, double et épais distinguent début, intermédiaire et fin.","Les marqueurs de message distinguent catch et throw.","Les événements de bordure interruptifs arrêtent l’activité ; Terminate arrête tous les jetons de la portée."]],["Nommer activités et événements","Choisissez des noms qui rendent le travail, les déclencheurs, les états et les objets métier lisibles sans explication supplémentaire.",["Les activités utilisent des phrases verbe–nom significatives.","Les événements décrivent ce qui s’est produit, l’horaire, la condition ou l’état final.","Les objets de données utilisent des noms métier significatifs et leurs états."]],["Nommer gateways et collaboration","Nommez questions, résultats, participants et catégories pour rendre explicites le routage et les responsabilités.",["Les gateways exclusifs divergents sont idéalement nommés par une question.","Les conditions de sortie sont nommées comme des résultats ; les flux par défaut restent normalement sans nom.","Les pools portent le nom des participants ; les lanes celui des catégories, rôles, systèmes ou départements."]]],"missions":[["Un processus commence","Une commande de pizza arrive, mais le modèle n’a aucun élément qui crée l’instance du processus.","Un événement de début n’a pas de Sequence Flow entrant.","Un None Start Event crée le premier jeton de cette commande."],["Le travail n’est pas un événement","L’employé doit enregistrer la commande dans le système. Choisissez l’élément BPMN qui représente ce travail.","Cherchez une unité de travail atomique.","Une tâche reçoit un jeton, réalise le travail et transmet le jeton."],["Montrez l’état final","La pizza a été livrée et ce chemin est terminé. Choisissez l’élément qui marque sa fin.","Un événement de fin utilise un cercle à bord épais.","Un None End Event consomme le jeton arrivé et ferme ce chemin."],["Un seul chemin","Après vérification de la disponibilité, le résultat est chambre disponible ou aucune chambre. Routez exactement une alternative.","L’activité détermine le résultat ; le gateway ne fait que router le flux.","Un Gateway Exclusif route un seul flux sortant."],["Deux choses à la fois","La cuisine doit préparer le plat principal et l’accompagnement indépendamment, et les deux sont nécessaires.","Utilisez un gateway qui active toutes les branches sortantes.","Un Gateway Parallèle crée des jetons concurrents pour les deux branches."],["Un chemin de repli","Plusieurs conditions peuvent router une demande. Si aucune n’est vraie, un chemin de repli doit être suivi.","Cherchez le Sequence Flow marqué d’une barre près de sa source.","Un Default Sequence Flow est utilisé lorsque les autres conditions admissibles sont fausses."],["Information, pas travail","Une tâche lit et met à jour un formulaire de commande. Choisissez l’élément BPMN qui représente le formulaire.","Le formulaire est une donnée, pas un travail.","Un Data Object représente une information utilisée ou produite par les activités."],["Qui l’exécute ?","Le processus appelle automatiquement un service web externe de calcul de taxe.","Choisissez le type de tâche pour un travail automatisé par une application ou un service.","Une Service Task représente un travail automatisé effectué par une application ou un service."],["Masquez le détail interne","Préparer l’expédition contient plusieurs étapes internes, mais ce diagramme doit les masquer.","Cherchez le marqueur d’activité avec un petit signe plus.","Un sous-processus replié masque le flux interne tout en restant dans le processus parent."],["Organisez la responsabilité","Le restaurant est un participant, tandis que caisse et cuisine réalisent différents travaux à l’intérieur.","Utilisez une partition dans une Pool, pas un autre Participant.","Une Lane organise les activités dans une Pool."],["Traversez les rôles internes","Caisse et cuisine sont des lanes différentes de la même pool. Quel connecteur peut traverser leur frontière ?","Les limites de lanes ne séparent pas les Participants.","Le Sequence Flow peut traverser les lanes car le travail reste dans le même processus."],["Parlez à un autre participant","Le restaurant envoie une demande de paiement à un prestataire externe dans une autre Pool.","La communication entre Participants utilise un connecteur en pointillés avec un cercle ouvert à la source.","Le Message Flow relie des Participants ou Pools différents."],["Un prestataire boîte noire","Le prestataire de paiement participe, mais son processus interne est inconnu et sans intérêt ici.","Un Participant n’a pas besoin d’exposer son processus interne.","Une Pool boîte noire représente le Participant externe."],["Exclusif, pas parallèle","Après Évaluer la demande, le résultat est Approuvé ou Rejeté, jamais les deux.","L’activité détermine le résultat ; le gateway le route.","Un Gateway Exclusif sélectionne exactement une sortie."],["Attendez les deux","Deux branches parallèles préparent un document et obtiennent une signature. Continuez seulement après les deux.","Une divergence parallèle nécessite généralement une convergence parallèle si toutes les branches sont requises.","Un Gateway Parallèle attend tous les jetons entrants nécessaires."],["Une ou plusieurs options","Un client peut demander un emballage cadeau, une assurance, ou les deux.","Ce n’est ni exactement un chemin, ni tous les chemins.","Un Gateway Inclusif active un ou plusieurs flux sortants selon les conditions."],["Le premier événement","Après l’envoi d’une demande, attendez soit une réponse, soit un timeout. Le premier événement détermine le chemin.","Les cibles après ce gateway sont des événements catch ou des activités de réception.","Un Gateway Basé sur les Événements route vers le premier événement suivant qui se produit."],["Attendre avant de continuer","Après l’envoi d’un rappel, le processus doit attendre jusqu’au prochain jour ouvrable avant de continuer. Quel élément BPMN appartient au point d’attente ?","Utilisez un événement intermédiaire catch déclenché par le temps, et non un événement de bord attaché à une activité.","Un événement intermédiaire Timer met le jeton en attente jusqu’à ce que la condition temporelle soit satisfaite ; le processus continue ensuite."],["Capturez le message","Pendant le processus, l’exécution doit attendre l’arrivée d’un message du client.","Les marqueurs de message catch sont vides ; les marqueurs throw sont remplis.","Un événement intermédiaire de message catch attend le message entrant."],["Timeout de l’activité","Un appel de service peut durer trop longtemps. Après 30 secondes, abandonnez cet appel et suivez un chemin de timeout.","Le timeout doit interrompre l’activité à laquelle il est attaché.","Un Boundary Timer Event interruptif annule l’activité attachée et crée le chemin de timeout."],["Arrêtez tous les chemins actifs","Une annulation fatale arrive pendant que des branches parallèles sont actives. Tous les jetons de cette portée doivent s’arrêter.","Un End Event normal termine seulement le flux qui l’atteint.","Un Terminate End Event termine immédiatement tous les jetons de la portée courante."],["Parallèle sans gateway","Choisissez le fragment qui montre correctement une activité activant deux chemins sortants inconditionnels sans gateway explicite.","En BPMN, plusieurs Sequence Flows inconditionnels sortant d’une Activité sont tous activés.","Deux Sequence Flows inconditionnels sortant d’une Activité créent un parallélisme implicite ; un Gateway Parallèle explicite est plus clair mais non obligatoire."],["Information persistante","Le processus lit et met à jour des dossiers clients qui doivent rester disponibles après la fin de cette instance. Quel élément représente ce dépôt persistant ?","Un document qui circule dans le travail est différent d’un stockage persistant.","Un Data Store représente une base de données ou un dépôt persistant similaire."],["Travail manuel","Une personne inspecte physiquement un colis sans utiliser d’application. Quel type de Task convient ?","Le travail est réalisé par une personne sans assistance logicielle.","Une Manual Task représente un travail humain réalisé sans l’aide d’une application logicielle."],["Le message qui initie la collaboration","Le premier message du client initie l’interaction. Choisissez le Message Flow avec le décorateur initiateur.","Le décorateur est une enveloppe non remplie placée sur le Message Flow.","L’Initiating Message Flow with Decorator identifie le message qui initie l’échange de collaboration."],["Un message ultérieur de la collaboration","Une réponse ultérieure appartient à une interaction déjà établie. Choisissez le Message Flow non initiateur avec décorateur.","Comparez le remplissage de l’enveloppe décoratrice.","Le Message Flow non initiateur décoré utilise l’enveloppe remplie/grise."],["Une règle que les gateways standards n’expriment pas","Une jonction doit continuer lorsque trois des cinq branches entrantes sont terminées. Quel gateway représente cette synchronisation personnalisée ?","Exclusive, Parallel et Inclusive n’expriment pas directement ce seuil.","Un Complex Gateway sert aux comportements de synchronisation ou de routage non couverts par les autres types."],["Diviser en travaux parallèles requis","Après acceptation d’une commande, il faut réserver le stock et générer la facture. Aucun gateway de fermeture n’est montré. Quel élément crée les deux bran
