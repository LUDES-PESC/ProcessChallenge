ss behavior.","final.replay":"Review the course","final.reset":"Start over","glossary.title":"BPMN symbol guide","glossary.lead":"Symbols are redrawn in the visual style used by the BPMN Quick Guide and BPMN 2.0. Color only indicates game state; it is not normative BPMN semantics.","glossary.events":"Events","glossary.activities":"Activities","glossary.gateways":"Gateways","glossary.flows":"Flows and associations","glossary.data":"Data","glossary.swimlanes":"Pools and lanes","reference.title":"References and notation policy","reference.quick":"BPMN Quick Guide","reference.omg":"OMG BPMN 2.0.2","reference.policy":"Process Panic redraws notation as native SVG and does not embed Quick Guide images. The game favors explicit gateways and readable left-to-right layouts.","reference.course":"Course materials supplied by Geraldo Xexéo define the teaching order used by the game.","about.title":"About Process Panic!","about.text":"Process Panic! is a LUDES/PESC educational browser game designed to make BPMN execution semantics visible. The core loop is choose → execute → observe → debrief.","about.version":"Version v0.2","about.license":"MIT License — Copyright (c) 2026 Geraldo Xexéo.","install.unavailable":"Your browser did not expose an installation prompt. Use its menu and choose Add to Home Screen / Install App when available.","reset.confirm":"Reset all Process Panic! progress on this device?","toast.installed":"Process Panic! is installed.","toast.reset":"Progress reset.","toast.lang":"Language changed immediately.","lessons":[["Introduction: flow and tokens","Start/end events, tasks, exclusive choices, parallel paths, and token semantics.",["A process instance needs an explicit start and end.","Tasks perform work; gateways route flow.","Exclusive gateways route one path; parallel gateways create or synchronize concurrent paths."]],["Flows, data, and activities","Default flows, data, task types, and sub-process structure.",["Sequence Flow orders work inside a process.", ovider participates, but its internal process is unknown and irrelevant.","A Participant does not need to expose its internal process.","A black-box Pool represents the external Participant."],["Exclusive, not parallel","After Evaluate application, the result is Approved or Rejected, never both.","The activity determines the outcome; the gateway routes it.","An Exclusive Gateway selects exactly one outgoing path."],["Wait for both","Two parallel branches prepare a document and obtain a signature. Continue only after both finish.","A parallel split usually needs a parallel join when all branches are required.","A Parallel Gateway waits for all required incoming tokens."],["One or more options","A customer may request gift wrap, insurance, or both.","This is neither exactly-one nor all-paths behavior.","An Inclusive Gateway activates one or more outgoing paths according to conditions."],["Whichever happens first","After sending a request, wait for either a reply message or a timeout. The first event determines the route.","The targets after this gateway are catching events or receive activities.","An Event-Based Gateway routes to the first subsequent event that occurs."],["Read the rings","An event occurs after the process starts and before it ends. Choose the generic event position.","Start = one thin ring; intermediate = two thin rings; end = one thick ring.","An Intermediate Event is shown with a thin double circle."],["Catch the message","During the process, execution must wait until a customer message arrives.","Catching message markers are unfilled; throwing markers are filled.","A catching Message Intermediate Event waits for the incoming message."],["Timeout the activity","A service call may take too long. After 30 seconds, abandon that call and follow a timeout path.","The timeout must stop the attached activity.","An interrupting Boundary Timer Event cancels the attached activity and creates the timeout path."],["Stop every active path","A fatal cancellation ivates or synchronizes all paths."],"gatewayInclusive":["Inclusive Gateway","Activates one or more paths."],"gatewayEvent":["Event-Based Gateway","Routes by the first event that occurs."],"gatewayComplex":["Complex Gateway","Other complex routing semantics."],"sequenceFlow":["Sequence Flow","Orders flow inside a process."],"conditionalFlow":["Conditional Sequence Flow","Sequence Flow with a condition."],"defaultFlow":["Default Sequence Flow","Fallback path marked by a slash."],"messageFlow":["Message Flow","Communication between Participants."],"association":["Association","Links information without controlling flow."],"dataObject":["Data Object","Information used or produced."],"dataStore":["Data Store","Persistent process data."],"pool":["Pool / Participant","Participant in a collaboration."],"lane":["Lane","Internal category within a Pool."],"messageCatchIntermediate":["Catching Message Intermediate Event","Waits for an incoming message."],"messageThrowIntermediate":["Throwing Message Intermediate Event","Sends a message event."],"timerStart":["Timer Start Event","Starts by time trigger."],"timerIntermediate":["Timer Intermediate Event","Waits for time."],"boundaryTimerInterrupt":["Interrupting Boundary Timer Event","Timeout that stops the activity."],"boundaryTimerNonInterrupt":["Non-interrupting Boundary Timer Event","Creates another path without stopping work."],"terminateEnd":["Terminate End Event","Stops all tokens in scope."]},"a11y.menu":"Open menu","a11y.setup":"Open setup","a11y.close":"Close","meta.description":"Process Panic! — a mobile-first educational BPMN game.","debrief.finalContinue":"Open final debrief","game.restart":"Restart game","game.restartConfirm":"Restart Process Panic! from Mission 1 and erase all progress on this device?","mission.option":"Option"},"pt":{"menu.course":"Mapa do curso","menu.glossary":"Guia de símbolos BPMN","menu.reference":"Referências","menu.about":"Sobre","menu.install":"Instalar aplicativo","menu.reset":"Reiniciar p Revisar o curso","final.reset":"Começar de novo","glossary.title":"Guia de símbolos BPMN","glossary.lead":"Os símbolos são redesenhados no estilo visual usado pelo BPMN Quick Guide e pela BPMN 2.0. A cor indica apenas estado do jogo; não tem semântica normativa em BPMN.","glossary.events":"Eventos","glossary.activities":"Atividades","glossary.gateways":"Gateways","glossary.flows":"Fluxos e associações","glossary.data":"Dados","glossary.swimlanes":"Pools e raias","reference.title":"Referências e política de notação","reference.quick":"BPMN Quick Guide","reference.omg":"OMG BPMN 2.0.2","reference.policy":"Process Panic redesenha a notação como SVG nativo e não incorpora imagens do Quick Guide. O jogo privilegia gateways explícitos e layouts legíveis da esquerda para a direita.","reference.course":"Os materiais do curso fornecidos por Geraldo Xexéo definem a ordem didática usada pelo jogo.","about.title":"Sobre o Process Panic!","about.text":"Process Panic! é um jogo educacional para navegador do LUDES/PESC criado para tornar visível a semântica de execução da BPMN. O ciclo central é escolher → executar → observar → analisar.","about.version":"Versão v0.2","about.license":"Licença MIT — Copyright (c) 2026 Geraldo Xexéo.","install.unavailable":"Seu navegador não apresentou a opção de instalação. Quando disponível, use o menu do navegador e escolha Adicionar à tela inicial / Instalar aplicativo.","reset.confirm":"Reiniciar todo o progresso do Process Panic! neste dispositivo?","toast.installed":"Process Panic! foi instalado.","toast.reset":"Progresso reiniciado.","toast.lang":"Idioma alterado imediatamente.","lessons":[["Introdução","Eventos básicos, tarefas, escolhas, paralelismo e lógica de tokens.",["Uma instância precisa de início e fim explícitos.","Tarefas executam trabalho; gateways roteiam o fluxo.","Gateways exclusivos escolhem um caminho; paralelos criam ou sincronizam caminhos concorrentes."]],["Fluxos, dados e atividades","Fluxo default, objetos de dados, tipos de tarefa e subprocessos.",["Fluxo de Sequência ordena o trabalho dentro do processo.","Objetos de Dados representam informação; Data Stores representam persistência.","O tipo de tarefa comunica quem ou o que executa o trabalho."]],["Pools, raias e mensagens","Responsabilidade interna, participantes e comunicação.",["Uma Pool representa um Participante; uma Raia categoriza trabalho dentro dela.","Fluxo de Sequência pode cruzar raias, mas não limites de Pools.","Fluxo de Mensagem conecta Participantes diferentes."]],["Gateways","Semântica de XOR, AND, OR e gateways baseados em eventos.",["Gateways roteiam o fluxo; não executam a decisão de negócio.","Joins paralelos sincronizam todos os ramos necessários.","Gateways Baseados em Eventos roteiam conforme o primeiro evento que ocorre."]],["Eventos","Posição, mensagens, timers de borda e terminação.",["Círculos simples, duplos e grossos distinguem início, intermediário e fim.","Marcadores de mensagem distinguem captura de lançamento.","Eventos de borda interruptivos param a atividade; Terminate encerra todos os tokens no escopo."]]],"missions":[["Um processo começa","Um pedido de pizza chega, mas o modelo não tem o elemento que cria a instância do processo.","Um Evento Inicial não possui Fluxo de Sequência de entrada.","Um Evento Inicial Nenhum cria o primeiro token deste pedido."],["Trabalho não é evento","O atendente precisa registrar o pedido no sistema. Escolha o elemento BPMN que representa esse trabalho.","Procure uma unidade atômica de trabalho.","Uma Tarefa recebe um token, executa trabalho e repassa o token."],["Mostre o estado final","A pizza foi entregue e este caminho terminou. Escolha o elemento que marca seu fim.","Um Evento Final usa um círculo de borda grossa.","Um Evento Final Nenhum consome o token que chega e encerra este caminho."],["Apenas um caminho","Depois de verificar a disponibilidade, o resultado é quarto disponível ou sem quarto. Encaminhe exatamente uma alternativa.","A atividade determina o resultado; o gateway apenas roteia o fluxo.","Um Gateway Exclusivo encaminha um único fluxo de saída."],["Duas coisas ao mesmo tempo","A cozinha deve preparar o prato principal e o acompanhamento de forma independente, e ambos são necessários.","Use um gateway que ative todos os ramos de saída.","Um Gateway Paralelo cria tokens concorrentes para os dois ramos."],["Um caminho de fallback","Várias condições podem encaminhar uma solicitação. Se nenhuma for verdadeira, um caminho de fallback deve ser seguido.","Procure o Fluxo de Sequência marcado por uma barra junto à origem.","Um Fluxo de Sequência Default é usado quando as outras condições elegíveis são falsas."],["Informação, não trabalho","Uma tarefa lê e atualiza uma ficha de pedido. Escolha o elemento BPMN que representa a ficha.","A ficha é dado, não trabalho.","Um Objeto de Dados representa informação usada ou produzida pelas atividades."],["Quem executa?","O processo chama automaticamente um serviço web externo para calcular o imposto.","Escolha o tipo de tarefa para trabalho automatizado por aplicação ou serviço.","Uma Tarefa de Serviço representa trabalho automatizado realizado por uma aplicação ou serviço."],["Oculte o detalhe interno","Preparar remessa contém vários passos internos, mas este diagrama deve mantê-los ocultos.","Procure o marcador de atividade com um pequeno sinal de mais.","Um Subprocesso colapsado oculta o fluxo interno e continua fazendo parte do processo pai."],["Organize a responsabilidade","O restaurante é um participante, enquanto caixa e cozinha realizam trabalhos diferentes dentro dele.","Use uma partição dentro de uma Pool, não outro Participante.","Uma Raia organiza atividades dentro de uma Pool."],["Cruze papéis internos","Caixa e cozinha são raias diferentes da mesma pool. Qual conector pode cruzar o limite entre elas?","Limites de raias não separam Participantes.","O Fluxo de Sequência pode cruzar raias porque o trabalho continua no mesmo processo."],["Fale com outro participante","O restaurante envia uma solicitação de pagamento a um provedor externo em outra Pool.","A comunicação entre Participantes usa um conector tracejado com círculo aberto na origem.","Fluxo de Mensagem conecta Participantes ou Pools diferentes."],["Um provedor caixa-preta","O provedor de pagamento participa, mas seu processo interno é desconhecido e irrelevante.","Um Participante não precisa expor seu processo interno.","Uma Pool caixa-preta representa o Participante externo."],["Exclusivo, não paralelo","Depois de Avaliar solicitação, o resultado é Aprovado ou Rejeitado, nunca os dois.","A atividade determina o resultado; o gateway o encaminha.","Um Gateway Exclusivo seleciona exatamente um fluxo de saída."],["Espere pelos dois","Dois ramos paralelos preparam um documento e obtêm uma assinatura. Continue somente quando ambos terminarem.","Uma divisão paralela normalmente precisa de uma junção paralela quando todos os ramos são obrigatórios.","Um Gateway Paralelo espera todos os tokens de entrada necessários."],["Uma ou mais opções","Um cliente pode solicitar embalagem para presente, seguro ou ambos.","Não é comportamento de exatamente um nem de todos os caminhos.","Um Gateway Inclusivo ativa um ou mais fluxos de saída conforme as condições."],["O que acontecer primeiro","Depois de enviar uma solicitação, espere uma mensagem de resposta ou um timeout. O primeiro evento determina o caminho.","Os alvos depois deste gateway são eventos de captura ou atividades de recepção.","Um Gateway Baseado em Eventos encaminha pelo primeiro evento subsequente que ocorrer."],["Leia os círculos","Um evento ocorre depois que o processo começa e antes de terminar. Escolha a posição genérica correta.","Início = um círculo fino; intermediário = dois círculos finos; fim = um círculo grosso.","Um Evento Intermediário é desenhado com dois círculos finos."],["Capture a mensagem","Durante o processo, a execução deve esperar até chegar uma mensagem do cliente.","Marcadores de mensagem de captura não são preenchidos; os de lançamento são preenchidos.","Um Evento Intermediário de Mensagem de captura espera a mensagem de entrada."],["Timeout da atividade","Uma chamada de serviço pode demorar demais. Após 30 segundos, abandone a chamada e siga por um caminho de timeout.","O timeout precisa interromper a atividade à qual está anexado.","Um Evento de Borda de Timer interruptivo cancela a atividade e cria o caminho de timeout."],["Pare todos os caminhos ativos","Um cancelamento fatal chega enquanto ramos paralelos estão ativos. Todos os tokens deste escopo de processo devem parar.","Um Evento Final normal encerra somente o fluxo que chega a ele.","Um Evento Final de Terminação encerra imediatamente todos os tokens no escopo atual do processo."]],"diagram":{"record":"Registrar pedido","prepare":"Preparar pedido","deliver":"Entregar pedido","check":"Verificar disponibilidade","available":"Quarto disponível","noneAvailable":"Sem quarto","main":"Preparar prato principal","side":"Preparar acompanhamento","flowA":"Outra condição","fallback":"Fallback","form":"Ficha de pedido","tax":"Calcular imposto","shipment":"Preparar remessa","restaurant":"Restaurante","cashier":"Caixa","kitchen":"Cozinha","provider":"Provedor de pagamento","unknown":"Processo interno não exibido","request":"Solicitação de pagamento","evaluate":"Avaliar solicitação","approved":"Aprovado","rejected":"Rejeitado","document":"Preparar documento","signature":"Obter assinatura","continue":"Continuar","gift":"Embalagem para presente","insurance":"Seguro","reply":"Resposta recebida","timeout":"Timeout","wait":"Esperar mensagem","service":"Chamar serviço","flowB":"Trabalho paralelo"},"elements":{"startNone":["Evento Inicial Nenhum","Inicia uma instância do processo."],"intermediateNone":["Evento Intermediário","Ocorre durante um processo em execução."],"endNone":["Evento Final Nenhum","Encerra o fluxo atual."],"task":["Tarefa","Unidade atômica de trabalho."],"userTask":["Tarefa de Usuário","Trabalho humano usando software."],"manualTask":["Tarefa Manual","Trabalho humano sem software."],"serviceTask":["Tarefa de Serviço","Trabalho automatizado por aplicação ou serviço."],"businessRuleTask":["Tarefa de Regra de Negócio","Avalia regras de negócio."],"scriptTask":["Tarefa de Script","Executa um script no motor de processos."],"sendTask":["Tarefa de Envio","Envia uma mensagem como trabalho."],"receiveTask":["Tarefa de Recepção","Espera uma mensagem como trabalho."],"subProcess":["Subprocesso colapsado","Oculta detalhes do processo interno."],"callActivity":["Atividade de Chamada","Invoca uma atividade global reutilizável."],"gatewayExclusive":["Gateway Exclusivo","Encaminha exatamente uma alternativa."],"gatewayParallel":["Gateway Paralelo","Ativa ou sincroniza todos os caminhos."],"gatewayInclusive":["Gateway Inclusivo","Ativa um ou mais caminhos."],"gatewayEvent":["Gateway Baseado em Eventos","Encaminha pelo primeiro evento que ocorre."],"gatewayComplex":["Gateway Complexo","Outras semânticas complexas de roteamento."],"sequenceFlow":["Fluxo de Sequência","Ordena o fluxo dentro de um processo."],"conditionalFlow":["Fluxo de Sequência Condicional","Fluxo de Sequência com condição."],"defaultFlow":["Fluxo de Sequência Default","Caminho de fallback marcado por uma barra."],"messageFlow":["Fluxo de Mensagem","Comunicação entre Participantes."],"association":["Associação","Liga informação sem controlar o fluxo."],"dataObject":["Objeto de Dados","Informação usada ou produzida."],"dataStore":["Armazenamento de Dados","Dados persistentes do processo."],"pool":["Pool / Participante","Participante de uma colaboração."],"lane":["Raia","Categoria interna dentro de uma Pool."],"messageCatchIntermediate":["Evento Intermediário de Mensagem de captura","Espera uma mensagem de entrada."],"messageThrowIntermediate":["Evento Intermediário de Mensagem de lançamento","Envia uma mensagem como evento."],"timerStart":["Evento Inicial de Timer","Inicia por um gatilho de tempo."],"timerIntermediate":["Evento Intermediário de Timer","Espera um tempo."],"boundaryTimerInterrupt":["Evento de Borda de Timer interruptivo","Timeout que interrompe a atividade."],"boundaryTimerNonInterrupt":["Evento de Borda de Timer não interruptivo","Cria outro caminho sem interromper o trabalho."],"terminateEnd":["Evento Final de Terminação","Encerra todos os tokens do escopo."]},"a11y.menu":"Abrir menu","a11y.setup":"Abrir configurações","a11y.close":"Fechar","meta.description":"Process Panic! — um jogo educacional de BPMN focado em celular.","debrief.finalContinue":"Abrir debrief geral","game.restart":"Reiniciar jogo","game.restartConfirm":"Reiniciar o Process Panic! na Missão 1 e apagar todo o progresso deste dispositivo?","mission.option":"Opção"},"fr":{"menu.course":"Parcours du cours","menu.glossary":"Guide des symboles BPMN","menu.reference":"Références","menu.about":"À propos","menu.install":"Installer l’application","menu.reset":"Réinitialiser la progression","setup.title":"Réglages","setup.language":"Langue","setup.theme":"Thème","setup.theme.system":"Système","setup.theme.light":"Clair","setup.theme.dark":"Sombre","setup.motion":"Animation","setup.motion.normal":"Normale","setup.motion.reduced":"Réduite","setup.installHint":"L’installation apparaît lorsque le navigateur prend en charge les applications web.","setup.saved":"Les modifications s’appliquent immédiatement.","home.kicker":"Jeu mobile d’apprentissage BPMN","home.title":"Réparez le processus. Puis exécutez-le.","home.lead":"Apprenez BPMN en choisissant la notation, en exécutant le comportement des jetons, en observant les défaillances et en analysant ce qui s’est passé.","home.continue":"Continuer le cours","home.start":"Commencer le cours","home.completed":"missions terminées","home.stars":"étoiles","home.lessons":"leçons","home.course":"Cours","home.lesson":"Leçon","home.done":"Leçon terminée","mission.label":"Mission","mission.run":"Exécuter le processus","mission.hint":"Indice","mission.retry":"Essayer un autre choix","mission.next":"Mission suivante","mission.toDebrief":"Débriefing de la leçon","mission.correct":"Le processus se comporte comme prévu.","mission.wrong":"L’exécution révèle un problème de modélisation.","feedback.observe":"Observez le comportement et comparez-le à la règle BPMN.","debrief.completed":"Leçon terminée","debrief.accuracy":"Réussite au premier essai","debrief.hints":"Indices utilisés","debrief.stars":"Étoiles obtenues","debrief.keyIdeas":"Ce que cette leçon doit laisser clair","debrief.continue":"Passer à la leçon suivante","debrief.replay":"Rejouer la leçon","debrief.course":"Retour au parcours","final.title":"Débriefing final","final.subtitle":"Vous avez terminé le parcours BPMN de la v0.2.","final.score":"Total des étoiles","final.accuracy":"Réussite au premier essai","final.hints":"Indices utilisés","final.message":"L’objectif dépasse la mémorisation des symboles : vous devez pouvoir prévoir comment jetons, messages, participants, gateways et événements modifient le comportement du processus.","final.replay":"Revoir le cours","final.reset":"Recommencer","glossary.title":"Guide des symboles BPMN","glossary.lead":"Les symboles sont redessinés dans le style visuel du BPMN Quick Guide et de BPMN 2.0. La couleur indique seulement l’état du jeu ; elle n’a pas de sémantique normative BPMN.","glossary.events":"Événements","glossary.activities":"Activités","glossary.gateways":"Gateways","glossary.flows":"Flux et associations","glossary.data":"Données","glossary.swimlanes":"Pools et lanes","reference.title":"Références et politique de notation","reference.quick":"BPMN Quick Guide","reference.omg":"OMG BPMN 2.0.2","reference.policy":"Process Panic redessine la notation en SVG natif et n’intègre pas les images du Quick Guide. Le jeu privilégie les gateways explicites et les diagrammes lisibles de gauche à droite.","reference.course":"Les supports de cours fournis par Geraldo Xexéo définissent l’ordre pédagogique du jeu.","about.title":"À propos de Process Panic!","about.text":"Process Panic! est un jeu éducatif pour navigateur de LUDES/PESC conçu pour rendre visible la sémantique d’exécution de BPMN. La boucle centrale est choisir → exécuter → observer → analyser.","about.version":"Version v0.2","about.license":"Licence MIT — Copyright (c) 2026 Geraldo Xexéo.","install.unavailable":"Votre navigateur n’a pas proposé l’installation. Lorsqu’elle est disponible, utilisez son menu et choisissez Ajouter à l’écran d’accueil / Installer l’application.","reset.confirm":"Réinitialiser toute la progression de Process Panic! sur cet appareil ?","toast.installed":"Process Panic! est installé.","toast.reset":"Progression réinitialisée.","toast.lang":"Langue changée immédiatement.","lessons":[["Introduction","Événements de base, tâches, choix, parallélisme et logique des jetons.",["Une instance a besoin d’un début et d’une fin explicites.","Les tâches effectuent le travail ; les gateways routent le flux.","Les gateways exclusifs choisissent un chemin ; les parallèles créent ou synchronisent des chemins concurrents."]],["Flux, données et activités","Flux par défaut, objets de données, types de tâches et sous-processus.",["Le Sequence Flow ordonne le travail dans un processus.","Les Data Objects représentent l’information ; les Data Stores représentent la persistance.","Le type de tâche indique qui ou quoi exécute le travail."]],["Pools, lanes et messages","Responsabilité interne, participants et communication.",["Une Pool représente un Participant ; une Lane catégorise le travail interne.","Le Sequence Flow peut traverser les lanes, mais pas les limites de Pools.","Le Message Flow relie des Participants différents."]],["Gateways","Sémantique des XOR, AND, OR et gateways basés sur les événements.",["Les gateways routent le flux ; ils ne prennent pas la décision métier.","Les convergences parallèles synchronisent toutes les branches requises.","Les Gateways Basés sur les Événements routent selon le premier événement qui survient."]],["Événements","Position, messages, timers de bordure et terminaison.",["Les cercles simple, double et épais distinguent début, intermédiaire et fin.","Les marqueurs de message distinguent catch et throw.","Les événements de bordure interruptifs arrêtent l’activité ; Terminate arrête tous les jetons de la portée."]]],"missions":[["Un processus commence","Une commande de pizza arrive, mais le modèle n’a aucun élément qui crée l’instance du processus.","Un événement de début n’a pas de Sequence Flow entrant.","Un None Start Event crée le premier jeton de cette commande."],["Le travail n’est pas un événement","L’employé doit enregistrer la commande dans le système. Choisissez l’élément BPMN qui représente ce travail.","Cherchez une unité de travail atomique.","Une tâche reçoit un jeton, réalise le travail et transmet le jeton."],["Montrez l’état final","La pizza a été livrée et ce chemin est terminé. Choisissez l’élément qui marque sa fin.","Un événement de fin utilise un cercle à bord épais.","Un None End Event consomme le jeton arrivé et ferme ce chemin."],["Un seul chemin","Après vérification de la disponibilité, le résultat est chambre disponible ou aucune chambre. Routez exactement une alternative.","L’activité détermine le résultat ; le gateway ne fait que router le flux.","Un Gateway Exclusif route un seul flux sortant."],["Deux choses à la fois","La cuisine doit préparer le plat principal et l’accompagnement indépendamment, et les deux sont nécessaires.","Utilisez un gateway qui active toutes les branches sortantes.","Un Gateway Parallèle crée des jetons concurrents pour les deux branches."],["Un chemin de repli","Plusieurs conditions peuvent router une demande. Si aucune n’est vraie, un chemin de repli doit être suivi.","Cherchez le Sequence Flow marqué d’une barre près de sa source.","Un Default Sequence Flow est utilisé lorsque les autres conditions admissibles sont fausses."],["Information, pas travail","Une tâche lit et met à jour un formulaire de commande. Choisissez l’élément BPMN qui représente le formulaire.","Le formulaire est une donnée, pas un travail.","Un Data Object représente une information utilisée ou produite par les activités."],["Qui l’exécute ?","Le processus appelle automatiquement un service web externe de calcul de taxe.","Choisissez le type de tâche pour un travail automatisé par une application ou un service.","Une Service Task représente un travail automatisé effectué par une application ou un service."],["Masquez le détail interne","Préparer l’expédition contient plusieurs étapes internes, mais ce diagramme doit les masquer.","Cherchez le marqueur d’activité avec un petit signe plus.","Un sous-processus replié masque le flux interne tout en restant dans le processus parent."],["Organisez la responsabilité","Le restaurant est un participant, tandis que caisse et cuisine réalisent différents travaux à l’intérieur.","Utilisez une partition dans une Pool, pas un autre Participant.","Une Lane organise les activités dans une Pool."],["Traversez les rôles internes","Caisse et cuisine sont des lanes différentes de la même pool. Quel connecteur peut traverser leur frontière ?","Les limites de lanes ne séparent pas les Participants.","Le Sequence Flow peut traverser les lanes car le travail reste dans le même processus."],["Parlez à un autre participant","Le restaurant envoie une demande de paiement à un prestataire externe dans une autre Pool.","La communication entre Participants utilise un connecteur en pointillés avec un cercle ouvert à la source.","Le Message Flow relie des Participants ou Pools différents."],["Un prestataire boîte noire","Le prestataire de paiement participe, mais son processus interne est inconnu et sans intérêt ici.","Un Participant n’a pas besoin d’exposer son processus interne.","Une Pool boîte noire représente le Participant externe."],["Exclusif, pas parallèle","Après Évaluer la demande, le résultat est Approuvé ou Rejeté, jamais les deux.","L’activité détermine le résultat ; le gateway le route.","Un Gateway Exclusif sélectionne exactement une sortie."],["Attendez les deux","Deux branches parallèles préparent un document et obtiennent une signature. Continuez seulement après les deux.","Une divergence parallèle nécessite généralement une convergence parallèle si toutes les branches sont requises.","Un Gateway Parallèle attend tous les jetons entrants nécessaires."],["Une ou plusieurs options","Un client peut demander un emballage cadeau, une assurance, ou les deux.","Ce n’est ni exactement un chemin, ni tous les chemins.","Un Gateway Inclusif active un ou plusieurs flux sortants selon les conditions."],["Le premier événement","Après l’envoi d’une demande, attendez soit une réponse, soit un timeout. Le premier événement détermine le chemin.","Les cibles après ce gateway sont des événements catch ou des activités de réception.","Un Gateway Basé sur les Événements route vers le premier événement suivant qui se produit."],["Lisez les cercles","Un événement survient après le début du processus et avant sa fin. Choisissez la position générique correcte.","Début = un cercle fin ; intermédiaire = deux cercles fins ; fin = un cercle épais.","Un événement intermédiaire est représenté par un double cercle fin."],["Capturez le message","Pendant le processus, l’exécution doit attendre l’arrivée d’un message du client.","Les marqueurs de message catch sont vides ; les marqueurs throw sont remplis.","Un événement intermédiaire de message catch attend le message entrant."],["Timeout de l’activité","Un appel de service peut durer trop longtemps. Après 30 secondes, abandonnez cet appel et suivez un chemin de timeout.","Le timeout doit interrompre l’activité à laquelle il est attaché.","Un Boundary Timer Event interruptif annule l’activité attachée et crée le chemin de timeout."],["Arrêtez tous les chemins actifs","Une annulation fatale arrive pendant que des branches parallèles sont actives. Tous les jetons de cette portée doivent s’arrêter.","Un End Event normal termine seulement le flux qui l’atteint.","Un Terminate End Event termine immédiatement tous les jetons de la portée courante."]],"diagram":{"record":"Enregistrer la commande","prepare":"Préparer la commande","deliver":"Livrer la commande","check":"Vérifier la disponibilité","available":"Chambre disponible","noneAvailable":"Aucune chambre","main":"Préparer le plat principal","side":"Préparer l’accompagnement","flowA":"Autre condition","fallback":"Repli","form":"Formulaire de commande","tax":"Calculer la taxe","shipment":"Préparer l’expédition","restaurant":"Restaurant","cashier":"Caisse","kitchen":"Cuisine","provider":"Prestataire de paiement","unknown":"Processus interne non affiché","request":"Demande de paiement","evaluate":"Évaluer la demande","approved":"Approuvé","rejected":"Rejeté","document":"Préparer le document","signature":"Obtenir la signature","continue":"Continuer","gift":"Emballage cadeau","insurance":"Assurance","reply":"Réponse reçue","timeout":"Timeout","wait":"Attendre le message","service":"Appeler le service","flowB":"Travail parallèle"},"elements":{"startNone":["None Start Event","Démarre une instance du processus."],"intermediateNone":["Événement intermédiaire","Se produit pendant un processus en cours."],"endNone":["None End Event","Termine le flux courant."],"task":["Tâche","Unité de travail atomique."],"userTask":["User Task","Travail humain avec un logiciel."],"manualTask":["Manual Task","Travail humain sans logiciel."],"serviceTask":["Service Task","Travail automatisé par application ou service."],"businessRuleTask":["Business Rule Task","Évalue des règles métier."],"scriptTask":["Script Task","Exécute un script du moteur de processus."],"sendTask":["Send Task","Envoie un message comme travail."],"receiveTask":["Receive Task","Attend un message comme travail."],"subProcess":["Sous-processus replié","Masque le détail du processus interne."],"callActivity":["Call Activity","Appelle une activité globale réutilisable."],"gatewayExclusive":["Gateway Exclusif","Route exactement une alternative."],"gatewayParallel":["Gateway Parallèle","Active ou synchronise tous les chemins."],"gatewayInclusive":["Gateway Inclusif","Active un ou plusieurs chemins."],"gatewayEvent":["Gateway Basé sur les Événements","Route selon le premier événement."],"gatewayComplex":["Gateway Complexe","Autres sémantiques complexes de routage."],"sequenceFlow":["Sequence Flow","Ordonne le flux dans un processus."],"conditionalFlow":["Conditional Sequence Flow","Sequence Flow avec condition."],"defaultFlow":["Default Sequence Flow","Chemin de repli marqué d’une barre."],"messageFlow":["Message Flow","Communication entre Participants."],"association":["Association","Lie une information sans contrôler le flux."],"dataObject":["Data Object","Information utilisée ou produite."],"dataStore":["Data Store","Données persistantes du processus."],"pool":["Pool / Participant","Participant à une collaboration."],"lane":["Lane","Catégorie interne d’une Pool."],"messageCatchIntermediate":["Événement intermédiaire Message catch","Attend un message entrant."],"messageThrowIntermediate":["Événement intermédiaire Message throw","Envoie un message comme événement."],"timerStart":["Timer Start Event","Démarre par un déclencheur temporel."],"timerIntermediate":["Timer Intermediate Event","Attend un délai."],"boundaryTimerInterrupt":["Boundary Timer Event interruptif","Timeout qui arrête l’activité."],"boundaryTimerNonInterrupt":["Boundary Timer Event non interruptif","Crée un autre chemin sans arrêter le travail."],"terminateEnd":["Terminate End Event","Arrête tous les jetons de la portée."]},"a11y.menu":"Ouvrir le menu","a11y.setup":"Ouvrir les réglages","a11y.close":"Fermer","meta.description":"Process Panic! — un jeu pédagogique BPMN conçu pour mobile.","debrief.finalContinue":"Ouvrir le débriefing final","game.restart":"Recommencer le jeu","game.restartConfirm":"Recommencer Process Panic! à la mission 1 et effacer toute la progression sur cet appareil ?","mission.option":"Option"},"es":{"menu.course":"Mapa del curso","menu.glossary":"Guía de símbolos BPMN","menu.reference":"Referencias","menu.about":"Acerca de","menu.install":"Instalar aplicación","menu.reset":"Reiniciar progreso","setup.title":"Configuración","setup.language":"Idioma","setup.theme":"Tema","setup.theme.system":"Sistema","setup.theme.light":"Claro","setup.theme.dark":"Oscuro","setup.motion":"Animación","setup.motion.normal":"Normal","setup.motion.reduced":"Reducida","setup.installHint":"La instalación aparece cuando el navegador admite aplicaciones web.","setup.saved":"Los cambios se aplican inmediatamente.","home.kicker":"Juego móvil para aprender BPMN","home.title":"Repara el proceso. Luego ejecútalo.","home.lead":"Aprende BPMN eligiendo la notación, ejecutando el comportamiento de los tokens, observando fallos y analizando lo ocurrido.","home.continue":"Continuar curso","home.start":"Iniciar curso","home.completed":"misiones completadas","home.stars":"estrellas","home.lessons":"lecciones","home.course":"Curso","home.lesson":"Lección","home.done":"Lección completada","mission.label":"Misión","mission.run":"Ejecutar proceso","mission.hint":"Pista","mission.retry":"Probar otra opción","mission.next":"Siguiente misión","mission.toDebrief":"Debrief de la lección","mission.correct":"El proceso se comporta como se esperaba.","mission.wrong":"La ejecución revela un problema de modelado.","feedback.observe":"Observa el comportamiento y compáralo con la regla BPMN.","debrief.completed":"Lección completada","debrief.accuracy":"Aciertos al primer intento","debrief.hints":"Pistas usadas","debrief.stars":"Estrellas obtenidas","debrief.keyIdeas":"Lo que esta lección debe dejar claro","debrief.continue":"Continuar a la siguiente lección","debrief.replay":"Repetir lección","debrief.course":"Volver al mapa del curso","final.title":"Debrief final","final.subtitle":"Completaste el recorrido BPMN de la v0.2.","final.score":"Total de estrellas","final.accuracy":"Aciertos al primer intento","final.hints":"Pistas usadas","final.message":"El objetivo va más allá de memorizar símbolos: debes poder predecir cómo tokens, mensajes, participantes, gateways y eventos cambian el comportamiento del proceso.","final.replay":"Revisar el curso","final.reset":"Empezar de nuevo","glossary.title":"Guía de símbolos BPMN","glossary.lead":"Los símbolos se redibujan con el estilo visual del BPMN Quick Guide y BPMN 2.0. El color solo indica el estado del juego; no tiene semántica normativa en BPMN.","glossary.events":"Eventos","glossary.activities":"Actividades","glossary.gateways":"Gateways","glossary.flows":"Flujos y asociaciones","glossary.data":"Datos","glossary.swimlanes":"Pools y lanes","reference.title":"Referencias y política de notación","reference.quick":"BPMN Quick Guide","reference.omg":"OMG BPMN 2.0.2","reference.policy":"Process Panic redibuja la notación como SVG nativo y no incorpora imágenes del Quick Guide. El juego favorece gateways explícitos y diseños legibles de izquierda a derecha.","reference.course":"Los materiales del curso proporcionados por Geraldo Xexéo definen el orden didáctico del juego.","about.title":"Acerca de Process Panic!","about.text":"Process Panic! es un juego educativo para navegador de LUDES/PESC diseñado para hacer visible la semántica de ejecución de BPMN. El ciclo central es elegir → ejecutar → observar → analizar.","about.version":"Versión v0.2","about.license":"Licencia MIT — Copyright (c) 2026 Geraldo Xexéo.","install.unavailable":"Tu navegador no mostró una opción de instalación. Cuando esté disponible, usa el menú del navegador y elige Añadir a pantalla de inicio / Instalar aplicación.","reset.confirm":"¿Reiniciar todo el progreso de Process Panic! en este dispositivo?","toast.installed":"Process Panic! está instalado.","toast.reset":"Progreso reiniciado.","toast.lang":"Idioma cambiado inmediatamente.","lessons":[["Introducción","Eventos básicos, tareas, decisiones, paralelismo y lógica de tokens.",["Una instancia necesita inicio y fin explícitos.","Las tareas realizan trabajo; los gateways enrutan el flujo.","Los gateways exclusivos eligen una ruta; los paralelos crean o sincronizan rutas concurrentes."]],["Flujos, datos y actividades","Flujo por defecto, objetos de datos, tipos de tarea y subprocesos.",["El Flujo de Secuencia ordena el trabajo dentro del proceso.","Los Objetos de Datos representan información; los Data Stores representan persistencia.","El tipo de tarea comunica quién o qué realiza el trabajo."]],["Pools, lanes y mensajes","Responsabilidad interna, participantes y comunicación.",["Una Pool representa un Participante; una Lane categoriza trabajo dentro de ella.","El Flujo de Secuencia puede cruzar lanes, pero no límites de Pools.","El Flujo de Mensaje conecta Participantes diferentes."]],["Gateways","Semántica de XOR, AND, OR y gateways basados en eventos.",["Los gateways enrutan el flujo; no realizan la decisión de negocio.","Las uniones paralelas sincronizan todas las ramas requeridas.","Los Gateways Basados en Eventos enrutan según el primer evento que ocurre."]],["Eventos","Posición, mensajes, temporizadores de borde y terminación.",["Los círculos simple, doble y grueso distinguen inicio, intermedio y fin.","Los marcadores de mensaje distinguen captura y lanzamiento.","Los eventos de borde interruptivos detienen la actividad; Terminate termina todos los tokens del alcance."]]],"missions":[["Un proceso comienza","Llega un pedido de pizza, pero el modelo no tiene el elemento que crea la instancia del proceso.","Un Evento de Inicio no tiene Flujo de Secuencia entrante.","Un Evento de Inicio None crea el primer token de este pedido."],["El trabajo no es un evento","El empleado debe registrar el pedido en el sistema. Elige el elemento BPMN que representa este trabajo.","Busca una unidad atómica de trabajo.","Una Tarea recibe un token, realiza trabajo y pasa el token."],["Muestra el estado final","La pizza fue entregada y este camino ha terminado. Elige el elemento que marca su fin.","Un Evento de Fin usa un círculo de borde grueso.","Un Evento de Fin None consume el token que llega y cierra este camino."],["Solo una ruta","Tras comprobar disponibilidad, el resultado es habitación disponible o sin habitación. Enruta exactamente una alternativa.","La actividad determina el resultado; el gateway solo enruta el flujo.","Un Gateway Exclusivo enruta un único flujo de salida."],["Dos cosas a la vez","La cocina debe preparar el plato principal y la guarnición de forma independiente, y ambos son necesarios.","Usa un gateway que active todas las ramas de salida.","Un Gateway Paralelo crea tokens concurrentes para ambas ramas."],["Una ruta de respaldo","Varias condiciones pueden enrutar una solicitud. Si ninguna es verdadera, debe seguirse una ruta de respaldo.","Busca el Flujo de Secuencia marcado con una barra cerca de su origen.","Un Flujo de Secuencia por Defecto se usa cuando las demás condiciones elegibles son falsas."],["Información, no trabajo","Una tarea lee y actualiza un formulario de pedido. Elige el elemento BPMN que representa el formulario.","El formulario es dato, no trabajo.","Un Objeto de Datos representa información usada o producida por actividades."],["¿Quién lo ejecuta?","El proceso llama automáticamente a un servicio web externo de cálculo de impuestos.","Elige el tipo de tarea para trabajo automatizado por una aplicación o servicio.","Una Tarea de Servicio representa trabajo automatizado realizado por una aplicación o servicio."],["Oculta el detalle interno","Preparar envío contiene varios pasos internos, pero este diagrama debe mantenerlos ocultos.","Busca el marcador de actividad con un pequeño signo más.","Un Subproceso colapsado oculta el flujo interno y sigue formando parte del proceso padre."],["Organiza la responsabilidad","El restaurante es un participante, mientras caja y cocina realizan trabajos distintos dentro de él.","Usa una partición dentro de una Pool, no otro Participante.","Una Lane organiza actividades dentro de una Pool."],["Cruza roles internos","Caja y cocina son lanes distintas de la misma pool. ¿Qué conector puede cruzar el límite entre ellas?","Los límites de lanes no separan Participantes.","El Flujo de Secuencia puede cruzar lanes porque el trabajo sigue dentro del mismo proceso."],["Habla con otro participante","El restaurante envía una solicitud de pago a un proveedor externo en otra Pool.","La comunicación entre Participantes usa un conector discontinuo con círculo abierto en el origen.","El Flujo de Mensaje conecta Participantes o Pools diferentes."],["Un proveedor de caja negra","El proveedor de pagos participa, pero su proceso interno es desconocido e irrelevante.","Un Participante no necesita mostrar su proceso interno.","Una Pool de caja negra representa al Participante externo."],["Exclusivo, no paralelo","Después de Evaluar solicitud, el resultado es Aprobado o Rechazado, nunca ambos.","La actividad determina el resultado; el gateway lo enruta.","Un Gateway Exclusivo selecciona exactamente una salida."],["Espera a ambos","Dos ramas paralelas preparan un documento y obtienen una firma. Continúa solo cuando ambas terminen.","Una división paralela suele necesitar una unión paralela cuando todas las ramas son obligatorias.","Un Gateway Paralelo espera todos los tokens entrantes requeridos."],["Una o más opciones","Un cliente puede solicitar envoltorio de regalo, seguro o ambos.","No es un comportamiento de exactamente uno ni de todos los caminos.","Un Gateway Inclusivo activa uno o más flujos de salida según las condiciones."],["Lo que ocurra primero","Después de enviar una solicitud, espera un mensaje de respuesta o un timeout. El primer evento determina la ruta.","Los objetivos tras este gateway son eventos de captura o actividades de recepción.","Un Gateway Basado en Eventos enruta por el primer evento posterior que ocurra."],["Lee los círculos","Un evento ocurre después de iniciar el proceso y antes de terminar. Elige la posición genérica correcta.","Inicio = un círculo fino; intermedio = dos círculos finos; fin = un círculo grueso.","Un Evento Intermedio se muestra con un círculo doble fino."],["Captura el mensaje","Durante el proceso, la ejecución debe esperar hasta que llegue un mensaje del cliente.","Los marcadores de mensaje de captura no están rellenos; los de lanzamiento sí.","Un Evento Intermedio de Mensaje de captura espera el mensaje entrante."],["Timeout de la actividad","Una llamada de servicio puede tardar demasiado. Tras 30 segundos, abandona esa llamada y sigue una ruta de timeout.","El timeout debe detener la actividad adjunta.","Un Evento Temporizador de Borde interruptivo cancela la actividad adjunta y crea la ruta de timeout."],["Detén todos los caminos activos","Llega una cancelación fatal mientras hay ramas paralelas activas. Todos los tokens de este alcance deben detenerse.","Un Evento de Fin normal termina solo el flujo que llega a él.","Un Evento de Fin de Terminación termina inmediatamente todos los tokens del alcance actual del proceso."]],"diagram":{"record":"Registrar pedido","prepare":"Preparar pedido","deliver":"Entregar pedido","check":"Comprobar disponibilidad","available":"Habitación disponible","noneAvailable":"Sin habitación","main":"Preparar plato principal","side":"Preparar guarnición","flowA":"Otra condición","fallback":"Respaldo","form":"Formulario de pedido","tax":"Calcular impuesto","shipment":"Preparar envío","restaurant":"Restaurante","cashier":"Caja","kitchen":"Cocina","provider":"Proveedor de pagos","unknown":"Proceso interno no mostrado","request":"Solicitud de pago","evaluate":"Evaluar solicitud","approved":"Aprobado","rejected":"Rechazado","document":"Preparar documento","signature":"Obtener firma","continue":"Continuar","gift":"Envoltorio de regalo","insurance":"Seguro","reply":"Respuesta recibida","timeout":"Timeout","wait":"Esperar mensaje","service":"Llamar servicio","flowB":"Trabajo paralelo"},"elements":{"startNone":["Evento de Inicio None","Inicia una instancia del proceso."],"intermediateNone":["Evento Intermedio","Ocurre durante un proceso en ejecución."],"endNone":["Evento de Fin None","Termina el flujo actual."],"task":["Tarea","Unidad atómica de trabajo."],"userTask":["Tarea de Usuario","Trabajo humano usando software."],"manualTask":["Tarea Manual","Trabajo humano sin software."],"serviceTask":["Tarea de Servicio","Trabajo automatizado por aplicación o servicio."],"businessRuleTask":["Tarea de Regla de Negocio","Evalúa reglas de negocio."],"scriptTask":["Tarea de Script","Ejecuta un script del motor de procesos."],"sendTask":["Tarea de Envío","Envía un mensaje como trabajo."],"receiveTask":["Tarea de Recepción","Espera un mensaje como trabajo."],"subProcess":["Subproceso colapsado","Oculta el detalle del proceso interno."],"callActivity":["Actividad de Llamada","Invoca una actividad global reutilizable."],"gatewayExclusive":["Gateway Exclusivo","Enruta exactamente una alternativa."],"gatewayParallel":["Gateway Paralelo","Activa o sincroniza todos los caminos."],"gatewayInclusive":["Gateway Inclusivo","Activa uno o más caminos."],"gatewayEvent":["Gateway Basado en Eventos","Enruta por el primer evento que ocurre."],"gatewayComplex":["Gateway Complejo","Otras semánticas complejas de enrutamiento."],"sequenceFlow":["Flujo de Secuencia","Ordena el flujo dentro de un proceso."],"conditionalFlow":["Flujo de Secuencia Condicional","Flujo de Secuencia con una condición."],"defaultFlow":["Flujo de Secuencia por Defecto","Ruta de respaldo marcada por una barra."],"messageFlow":["Flujo de Mensaje","Comunicación entre Participantes."],"association":["Asociación","Vincula información sin controlar el flujo."],"dataObject":["Objeto de Datos","Información usada o producida."],"dataStore":["Almacén de Datos","Datos persistentes del proceso."],"pool":["Pool / Participante","Participante en una colaboración."],"lane":["Lane","Categoría interna dentro de una Pool."],"messageCatchIntermediate":["Evento Intermedio de Mensaje de captura","Espera un mensaje entrante."],"messageThrowIntermediate":["Evento Intermedio de Mensaje de lanzamiento","Envía un mensaje como evento."],"timerStart":["Evento de Inicio Temporizador","Inicia por un disparador temporal."],"timerIntermediate":["Evento Intermedio Temporizador","Espera un tiempo."],"boundaryTimerInterrupt":["Evento Temporizador de Borde interruptivo","Timeout que detiene la actividad."],"boundaryTimerNonInterrupt":["Evento Temporizador de Borde no interruptivo","Crea otra ruta sin detener el trabajo."],"terminateEnd":["Evento de Fin de Terminación","Detiene todos los tokens del alcance."]},"a11y.menu":"Abrir menú","a11y.setup":"Abrir configuración","a11y.close":"Cerrar","meta.description":"Process Panic! — un juego educativo BPMN diseñado para móvil.","debrief.finalContinue":"Abrir debrief final","game.restart":"Reiniciar juego","game.restartConfirm":"¿Reiniciar Process Panic! desde la Misión 1 y borrar todo el progreso de este dispositivo?","mission.option":"Opción"},"it":{"menu.course":"Mappa del corso","menu.glossary":"Guida ai simboli BPMN","menu.reference":"Riferimenti","menu.about":"Informazioni","menu.install":"Installa app","menu.reset":"Azzera progressi","setup.title":"Impostazioni","setup.language":"Lingua","setup.theme":"Tema","setup.theme.system":"Sistema","setup.theme.light":"Chiaro","setup.theme.dark":"Scuro","setup.motion":"Animazione","setup.motion.normal":"Normale","setup.motion.reduced":"Ridotta","setup.installHint":"L’installazione appare quando il browser supporta le web app.","setup.saved":"Le modifiche si applicano immediatamente.","home.kicker":"Gioco mobile per imparare BPMN","home.title":"Ripara il processo. Poi eseguilo.","home.lead":"Impara BPMN scegliendo la notazione, eseguendo il comportamento dei token, osservando gli errori e analizzando ciò che è successo.","home.continue":"Continua il corso","home.start":"Inizia il corso","home.completed":"missioni completat privilegia gateway espliciti e layout leggibili da sinistra a destra.","reference.course":"I materiali del corso forniti da Geraldo Xexéo definiscono l’ordine didattico usato dal gioco.","about.title":"Informazioni su Process Panic!","about.text":"Process Panic! è un gioco educativo per browser di LUDES/PESC progettato per rendere visibile la semantica di esecuzione BPMN. Il ciclo centrale è scegli → esegui → osserva → analizza.","about.version":"Versione v0.2","about.license":"Licenza MIT — Copyright (c) 2026 Geraldo Xexéo.","install.unavailable":"Il browser non ha mostrato una richiesta di installazione. Quando disponibile, usa il suo menu e scegli Aggiungi a schermata Home / Installa app.","reset.confirm":"Azzerare tutti i progressi di Process Panic! su questo dispositivo?","toast.installed":"Process Panic! è installato.","toast.reset":"Progressi azzerati.","toast.lang":"Lingua cambiata immediatamente.","lessons":[["Introduzione","Eventi di base, task, scelte, parallelismo e logica dei token.",["Un’istanza richiede inizio e fine espliciti.","I task eseguono lavoro; i gateway instradano il flusso.","I gateway esclusivi scelgono un percorso; quelli paralleli creano o sincronizzano percorsi concorrenti."]],["Flussi, dati e attività","Flusso predefinito, oggetti dati, tipi di task e sottoprocessi.",["Il Sequence Flow ordina il lavoro nel processo.","I Data Object rappresentano informazioni; i Data Store rappresentano persistenza.","Il tipo di task comunica chi o cosa esegue il lavoro."]],["Pool, lane e messaggi","Responsabilità interna, partecipanti e comunicazione.",["Una Pool rappresenta un Partecipante; una Lane categorizza il lavoro interno.","Il Sequence Flow può attraversare lane, ma non i confini delle Pool.","Il Message Flow collega Partecipanti differenti."]],["Gateway","Semantica di XOR, AND, OR e gateway basati su eventi.",["I gateway instradano il flusso; non prendono la decisione di business.","I join paralleli sincronizzano tutti i rami richiesti.","I Gateway Basati su Eventi instradano in base al primo evento che si verifica."]],["Eventi","Posizione, messaggi, timer di confine e terminazione.",["Cerchi singoli, doppi e spessi distinguono inizio, intermedio e fine.","I marker di messaggio distinguono catch e throw.","Gli eventi di confine interrupting fermano l’attività; Terminate arresta tutti i token nello scope."]]],"missions":[["Un processo inizia","Arriva un ordine di pizza, ma il modello non ha l’elemento che crea l’istanza del processo.","Uno Start Event non ha Sequence Flow in ingresso.","Un None Start Event crea il primo token per questo ordine."],["Il lavoro non è un evento","L’addetto deve registrare l’ordine nel sistema. Scegli l’elemento BPMN che rappresenta questo lavoro.","Cerca un’unità atomica di lavoro.","Un Task riceve un token, esegue il lavoro e passa il token."],["Mostra lo stato finale","La pizza è stata consegnata e questo percorso è completo. Scegli l’elemento che ne marca la fine.","Un End Event usa un cerchio dal bordo spesso.","Un None End Event consuma il token in arrivo e chiude questo percorso."],["Una sola via","Dopo aver verificato la disponibilità, il risultato è camera disponibile oppure nessuna camera. Instrada una sola alternativa.","L’attività determina il risultato; il gateway si limita a instradare il flusso.","Un Gateway Esclusivo instrada un solo flusso in uscita."],["Due cose insieme","La cucina deve preparare piatto principale e contorno in modo indipendente, e servono entrambi.","Usa un gateway che attivi tutti i rami in uscita.","Un Gateway Parallelo crea token concorrenti per entrambi i rami."],["Un percorso di fallback","Più condizioni possono instradare una richiesta. Se nessuna è vera, deve essere seguito un percorso di fallback.","Cerca il Sequence Flow contrassegnato da una barra vicino alla sorgente.","Un Default Sequence Flow viene usato quando le altre condizioni ammissibili sono false."],["Informazione, non lavoro","Un task legge e aggiorna un modulo d’ordine. Scegli l’elemento BPMN che rappresenta il modulo.","Il modulo è un dato, non un lavoro.","Un Data Object rappresenta informazioni usate o prodotte dalle attività."],["Chi lo esegue?","Il processo chiama automaticamente un servizio web esterno per calcolare le imposte.","Scegli il tipo di task per lavoro automatizzato da un’applicazione o servizio.","Un Service Task rappresenta lavoro automatizzato eseguito da un’applicazione o servizio."],["Nascondi il dettaglio interno","Preparare spedizione contiene più passaggi interni, ma questo diagramma deve tenerli nascosti.","Cerca il marker di attività con un piccolo segno più.","Un Sottoprocesso compresso nasconde il flusso interno restando parte del processo padre."],["Organizza la responsabilità","Il ristorante è un partecipante, mentre cassa e cucina svolgono lavori diversi al suo interno.","Usa una partizione dentro una Pool, non un altro Partecipante.","Una Lane organizza le attività dentro una Pool."],["Attraversa ruoli interni","Cassa e cucina sono lane diverse della stessa pool. Quale connettore può attraversarne il confine?","I confini delle lane non separano i Partecipanti.","Il Sequence Flow può attraversare lane perché il lavoro resta nello stesso processo."],["Parla con un altro partecipante","Il ristorante invia una richiesta di pagamento a un provider esterno in un’altra Pool.","La comunicazione tra Partecipanti usa un connettore tratteggiato con cerchio aperto alla sorgente.","Il Message Flow collega Partecipanti o Pool differenti."],["Un provider black box","Il provider di pagamento partecipa, ma il suo processo interno è sconosciuto e irrilevante.","Un Partecipante non deve necessariamente mostrare il proprio processo interno.","Una Pool black box rappresenta il Partecipante esterno."],["Esclusivo, non parallelo","Dopo Valutare richiesta, il risultato è Approvato o Rifiutato, mai entrambi.","L’attività determina l’esito; il gateway lo instrada.","Un Gateway Esclusivo seleziona esattamente un flusso in uscita."],["Aspetta entrambi","Due rami paralleli preparano un documento e ottengono una firma. Continua solo dopo che entrambi sono finiti.","Una divisione parallela normalmente richiede una riunione parallela quando tutti i rami sono obbligatori.","Un Gateway Parallelo attende tutti i token in ingresso richiesti."],["Una o più opzioni","Un cliente può richiedere confezione regalo, assicurazione o entrambe.","Non è un comportamento esattamente-uno né tutti-i-percorsi.","Un Gateway Inclusivo attiva uno o più flussi in uscita secondo le condizioni."],["Qualunque accada prima","Dopo aver inviato una richiesta, attendi una risposta o un timeout. Il primo evento determina il percorso.","I target dopo questo gateway sono eventi catch o attività di ricezione.","Un Gateway Basato su Eventi instrada verso il primo evento successivo che si verifica."],["Leggi i cerchi","Un evento avviene dopo l’avvio del processo e prima della fine. Scegli la posizione generica corretta.","Inizio = un cerchio sottile; intermedio = due cerchi sottili; fine = un cerchio spesso.","Un Evento Intermedio è mostrato con un doppio cerchio sottile."],["Cattura il messaggio","Durante il processo, l’esecuzione deve attendere l’arrivo di un messaggio del cliente.","I marker di messaggio catch non sono riempiti; quelli throw sono riempiti.","Un Evento Intermedio di Messaggio catch attende il messaggio in ingresso."],["Timeout dell’attività","Una chiamata di servizio può durare troppo. Dopo 30 secondi, abbandona la chiamata e segui un percorso di timeout.","Il timeout deve interrompere l’attività a cui è collegato.","Un Boundary Timer Event interrupting annulla l’attività collegata e crea il percorso di timeout."],["Ferma tutti i percorsi attivi","Arriva una cancellazione fatale mentre sono attivi rami paralleli. Tutti i token di questo scope devono fermarsi.","Un End Event normale termina solo il flusso che lo raggiunge.","Un Terminate End Event termina immediatamente tutti i token nello scope corrente del processo."]],"diagram":{"record":"Registrare ordine","prepare":"Preparare ordine","deliver":"Consegnare ordine","check":"Verificare disponibilità","available":"Camera disponibile","noneAvailable":"Nessuna camera","main":"Preparare piatto principale","side":"Preparare contorno","flowA":"Altra condizione","fallback":"Fallback","form":"Modulo d’ordine","tax":"Calcolare imposta","shipment":"Preparare spedizione","restaurant":"Ristorante","cashier":"Cassa","kitchen":"Cucina","provider":"Provider di pagamento","unknown":"Processo interno non mostrato","request":"Richiesta di pagamento","evaluate":"Valutare richiesta","approved":"Approvato","rejected":"Rifiutato","document":"Preparare documento","signature":"Ottenere firma","continue":"Continuare","gift":"Confezione regalo","insurance":"Assicurazione","reply":"Risposta ricevuta","timeout":"Timeout","wait":"Attendere messaggio","service":"Chiamare servizio","flowB":"Lavoro parallelo"},"elements":{"startNone":["None Start Event","Avvia un’istanza del processo."],"intermediateNone":["Evento Intermedio","Avviene durante un processo in esecuzione."],"endNone":["None End Event","Termina il flusso corrente."],"task":["Task","Unità atomica di lavoro."],"userTask":["User Task","Lavoro umano con software."],"manualTask":["Manual Task","Lavoro umano senza software."],"serviceTask":["Service Task","Lavoro automatizzato di applicazione o servizio."],"businessRuleTask":["Business Rule Task","Valuta regole di business."],"scriptTask":["Script Task","Esegue uno script del motore di processo."],"sendTask":["Send Task","Invia un messaggio come lavoro."],"receiveTask":["Receive Task","Attende un messaggio come lavoro."],"subProcess":["Sottoprocesso compresso","Nasconde il dettaglio del processo interno."],"callActivity":["Call Activity","Invoca un’attività globale riutilizzabile."],"gatewayExclusive":["Gateway Esclusivo","Instrada esattamente un’alternativa."],"gatewayParallel":["Gateway Parallelo","Attiva o sincronizza tutti i percorsi."],"gatewayInclusive":["Gateway Inclusivo","Attiva uno o più percorsi."],"gatewayEvent":["Gateway Basato su Eventi","Instrada in base al primo evento."],"gatewayComplex":["Gateway Complesso","Altre semantiche complesse di instradamento."],"sequenceFlow":["Sequence Flow","Ordina il flusso dentro un processo."],"conditionalFlow":["Conditional Sequence Flow","Sequence Flow con una condizione."],"defaultFlow":["Default Sequence Flow","Percorso di fallback segnato da una barra."],"messageFlow":["Message Flow","Comunicazione tra Partecipanti."],"association":["Associazione","Collega informazioni senza controllare il flusso."],"dataObject":["Data Object","Informazione usata o prodotta."],"dataStore":["Data Store","Dati persistenti del processo."],"pool":["Pool / Partecipante","Partecipante in una collaborazione."],"lane":["Lane","Categoria interna dentro una Pool."],"messageCatchIntermediate":["Evento Intermedio Messaggio catch","Attende un messaggio in ingresso."],"messageThrowIntermediate":["Evento Intermedio Messaggio throw","Invia un messaggio come evento."],"timerStart":["Timer Start Event","Avvia tramite un trigger temporale."],"timerIntermediate":["Timer Intermediate Event","Attende un intervallo di tempo."],"boundaryTimerInterrupt":["Boundary Timer Event interrupting","Timeout che interrompe l’attività."],"boundaryTimerNonInterrupt":["Boundary Timer Event non-interrupting","Crea un altro percorso senza interrompere il lavoro."],"terminateEnd":["Terminate End Event","Arresta tutti i token nello scope."]},"a11y.menu":"Apri menu","a11y.setup":"Apri impostazioni","a11y.close":"Chiudi","meta.description":"Process Panic! — un gioco educativo BPMN pensato per mobile.","debrief.finalContinue":"Apri il debriefing finale","game.restart":"Ricomincia il gioco","game.restartConfirm":"Ricominciare Process Panic! dalla Missione 1 e cancellare tutti i progressi su questo dispositivo?","mission.option":"Opzione"}};

function wrap(body,view='0 0 720 250'){return `<svg viewBox="${view}" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="seqA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15191f"/></marker><marker id="msgA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#15191f" stroke-width="1.4"/></marker></defs>${body}</svg>`}
function text(x,y,s,size=14,anchor='middle',weight=600){return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" font-weight="${weight}" fill="#15191f" font-family="Arial,sans-serif">${esc(s)}</text>`}
function seq(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#15191f" stroke-width="2" marker-end="url(#seqA)"/>`}
function msg(x1,y1,x2,y2){return `<g><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#15191f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#msgA)"/><circle cx="${x1}" cy="${y1}" r="5" fill="#fff" stroke="#15191f" stroke-width="1.5"/></g>`}
function assoc(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#15191f" stroke-width="1.5" stroke-dasharray="2 5"/>`}
function start(x,y,mark=''){return `<g transform="translate(${x} ${y})"><circle r="18" fill="#fff" stroke="#15191f" stroke-width="2"/>${mark}</g>`}
function inter(x,y,mark='',dash=false){return `<g transform="translate(${x} ${y})"><circle r="19" fill="#fff" stroke="#15191f" stroke-width="2" ${dash?'stroke-dasharray="4 3"':''}/><circle r="15" fill="none" stroke="#15191f" stroke-width="1.5" ${dash?'stroke-dasharray="4 3"':''}/>${mark}</g>`}
function end(x,y,mark=''){return `<g transform="translate(${x} ${y})"><circle r="18" fill="#fff" stroke="#15191f" stroke-width="5"/>${mark}</g>`}
function terminate(x,y){return `<g transform="translate(${x} ${y})"><circle r="18" fill="#fff" stroke="#15191f" stroke-width="5"/><circle r="10" fill="#15191f"/></g>`}
function gearPath(cx,cy,ro,ri,teeth=8){
  const pts=[];
  for(let i=0;i<teeth*4;i++){
    const a=-Math.PI/2+i*Math.PI/(teeth*2);
    const phase=i%4;
    const r=(phase===0||phase===1)?ro:ri;
    pts.push((cx+Math.cos(a)*r).toFixed(2)+','+(cy+Math.sin(a)*r).toFixed(2));
  }
  return 'M'+pts.join('L')+'Z';
}
function serviceMarker(x,y){
  return `<g fill="#fff" stroke="#15191f" stroke-width="1.25" stroke-linejoin="round">
    <path d="${gearPath(x+13,y+12,8,5.7,8)}"/><circle cx="${x+13}" cy="${y+12}" r="2.5"/>
    <path d="${gearPath(x+22,y+21,7,4.8,8)}"/><circle cx="${x+22}" cy="${y+21}" r="2.2"/>
  </g>`;
}

function scriptMarker(x,y){
  return `<g fill="#fff" stroke="#15191f" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">

}
async function runMission(){if(!S.selected)return;const i=S.mission,m=MISSIONS[i],ok=S.selected===m.answer,x=I18N[S.lang].missions[i];S.tries++;$('#run').disabled=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);await runAnimation(m,ok);const f=$('#fb');if(ok){revealSelectedChoice();const old=S.progress[i]||{},first=S.tries===1,score=S.hint?2:(first?3:1);S.progress[i]={complete:true,stars:Math.max(old.stars||0,score),firstTry:old.complete?old.firstTry:first,hint:old.hint||S.hint};persist();f.className='feedback show ok';f.innerHTML=`<b>${esc(t('mission.correct'))} ${stars(Math.max(old.stars||0,score))}</b><br>${esc(x[3])}`;const last=idsForLesson(m.lesson).at(-1)===i;$('#run').disabled=false;$('#run').textContent=last?t('mission.toDebrief'):t('mission.next');$('#run').onclick=()=>last?openDebrief(m.lesson):openMission(i+1)}else{f.className='feedback show bad';f.innerHTML=`<b>${esc(t('mission.wrong'))}</b><br>${esc(t('feedback.observe'))}<br><b>${esc(e(S.selected)[0])}</b><br><small>${esc(e(S.selected)[1])}</small>`;$('#run').disabled=false;$('#run').textContent=t('mission.retry');$('#run').onclick=()=>{const prev=[...S.optionOrder];S.selected=null;S.optionOrder=shuffledOptions(m.options,prev);persist();mission()}}}
function statsLesson(l){const ids=idsForLesson(l),r=ids.map(i=>S.progress[i]).filter(Boolean);return{stars:r.reduce((a,x)=>a+(x.stars||0),0),first:r.filter(x=>x.firstTry).length,hints:r.filter(x=>x.hint).length,total:ids.length}}
function openDebrief(l){S.debriefLesson=l;show('debrief');debrief(l)}
function debrief(l){const q=statsLesson(l),items=lt(l,2).map(v=>`<li>${esc(v)}</li>`).join('');$('#debrief').innerHTML=`<div class="debrief">${idTag('D'+String(l+1).padStart(2,'0'))}<div class="debriefBadge">✓</div><div class="kicker">${esc(t('debrief.completed'))}</div><h1>${esc(lt(l,0))}</h1><div class="debriefStats"><div class="debriefStat"><b>${q.stars}/${q.total*3}</b><span>${esc(t('debrief.stars'))}</span></div><div class="debriefStat"><b>${Math.round(q.first/q.total*100)}%</b><span>${esc(t('debrief.accuracy'))}</span></div><div class="debriefStat"><b>${q.hints}</b><span>${esc(t('debrief.hints'))}</span></div></div><h2>${esc(t('debrief.keyIdeas'))}</h2><ul class="takeaways">${items}</ul><div class="debriefActions"><button class="primary" id="nextL">${esc(l===4?t('debrief.finalContinue'):t('debrief.continue'))}</button><button class="secondary" id="again">${esc(t('debrief.replay'))}</button><button class="secondary" id="course">${esc(t('debrief.course'))}</button></div></div>`;$('#nextL').onclick=()=>l===4?openFinalDebrief():openLesson(l+1);$('#again').onclick=()=>openMission(idsForLesson(l)[0]);$('#course').onclick=showHome}
function openFinalDebrief(){S.debriefLesson='final';show('debrief');finalDebrief()}
function finalDebrief(){const all=MISSIONS.map((_,i)=>S.progress[i]).filter(Boolean),first=all.filter(x=>x.firstTry).length,hints=all.filter(x=>x.hint).length;const review=[0,1,2,3,4].map(l=>`<div class="card" style="margin-top:8px"><b>${esc(lt(l,0))}</b><ul class="takeaways">${lt(l,2).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>`).join('');$('#debrief').innerHTML=`<div class="debrief">${idTag('FINAL')}<div class="debriefBadge">🏁</div><h1>${esc(t('final.title'))}</h1><p class="lead">${esc(t('final.subtitle'))}</p><div class="debriefStats"><div class="debriefStat"><b>${starCount()}/${MISSIONS.length*3}</b><span>${esc(t('final.score'))}</span></div><div class="debriefStat"><b>${Math.round(first/MISSIONS.length*100)}%</b><span>${esc(t('final.accuracy'))}</span></div><div class="debriefStat"><b>${hints}</b><span>${esc(t('final.hints'))}</span></div></div><p>${esc(t('final.message'))}</p><h2>${esc(t('debrief.keyIdeas'))}</h2>${review}<div class="debriefActions" style="margin-top:10px"><button class="primary" id="course">${esc(t('final.replay'))}</button><button class="secondary" id="reset2">${esc(t('final.reset'))}</button></div></div>`;$('#course').onclick=showHome;$('#reset2').onclick=reset}
function showHome(){show('home');home()}
const G=[['glossary.events',['startNone','intermediateNone','endNone','messageCatchIntermediate','messageThrowIntermediate','timerStart','timerIntermediate','boundaryTimerInterrupt','boundaryTimerNonInterrupt','terminateEnd']],['glossary.activities',['task','userTask','manualTask','serviceTask','businessRuleTask','scriptTask','sendTask','receiveTask','subProcess','callActivity']],['glossary.gateways',['gatewayExclusive','gatewayParallel','gatewayInclusive','gatewayEvent','gatewayComplex']],['glossary.flows',['sequenceFlow','conditionalFlow','defaultFlow','messageFlow','association']],['glossary.data',['dataObject','dataStore']],['glossary.swimlanes',['pool','lane']]];
function glossary(){let s='';for(const [k,ids] of G){s+=`<div class="groupTitle">${esc(t(k))}</div><div class="glossGrid">${ids.map(id=>`<div class="glossItem">${icon(id)}<div><b>${esc(e(id)[0])}</b><span>${esc(e(id)[1])}</span></div></div>`).join('')}</div>`}$('#glossary').innerHTML=`<div class="pagePanel">${idTag('GLOSSARY')}<h1>${esc(t('glossary.title'))}</h1><p>${esc(t('glossary.lead'))}</p>${s}</div>`}
function reference(){ $('#reference').innerHTML=`<div class="pagePanel">${idTag('REFERENCES')}<h1>${esc(t('reference.title'))}</h1><p>${esc(t('reference.policy'))}</p><a class="refLink" href="https://www.bpmnquickguide.com/view-bpmn-quick-guide/" target="_blank" rel="noopener">${esc(t('reference.quick'))}<small>www.bpmnquickguide.com</small></a><a class="refLink" href="https://www.omg.org/spec/BPMN/2.0.2" target="_blank" rel="noopener">${esc(t('reference.omg'))}<small>Business Process Model and Notation 2.0.2</small></a><p>${esc(t('reference.course'))}</p></div>`}
function about(){ $('#about').innerHTML=`<div class="pagePanel">${idTag('ABOUT')}<h1>${esc(t('about.title'))}</h1><p>${esc(t('about.text'))}</p><p><b>${esc(t('about.version'))}</b></p><p>${esc(t('about.license'))}</p></div>`}
function renderCurrent(){if(S.screen==='home')home();if(S.screen==='mission')mission();if(S.screen==='debrief'){if(S.debriefLesson==='final')finalDebrief();else debrief(S.debriefLesson??MISSIONS[S.mission].lesson)}if(S.screen==='glossary')glossary();if(S.screen==='reference')reference();if(S.screen==='about')about()}
function menu(){const x=[['course','☰','menu.course'],['glossary','◇','menu.glossary'],['reference','↗','menu.reference'],['about','i','menu.about'],['install','＋','menu.install'],['reset','↺','menu.reset']];$('#menuGrid').innerHTML=idTag('MENU')+x.map(([id,ic,k])=>`<button class="menuItem" data-menu="${id}"><b>${ic} ${esc(t(k))}</b></button>`).join('');$$('[data-menu]').forEach(b=>b.onclick=()=>menuDo(b.dataset.menu))}
function menuDo(id){close('menu');if(id==='course')showHome();if(id==='glossary'){show('glossary');glossary()}if(id==='reference'){show('reference');reference()}if(id==='about'){show('about');about()}if(id==='install')install();if(id==='reset')reset()}
function setup(){ $('#setupTitle').textContent=t('setup.title');$('#setupGrid').innerHTML=`${idTag('SETUP')}<div class="field"><label>${esc(t('setup.language'))}</label><select id="lang"><option value="en">English</option><option value="pt">Português</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option></select></div><div class="field"><label>${esc(t('setup.theme'))}</label><select id="theme"><option value="system">${esc(t('setup.theme.system'))}</option><option value="light">${esc(t('setup.theme.light'))}</option><option value="dark">${esc(t('setup.theme.dark'))}</option></select></div><div class="field"><label>${esc(t('setup.motion'))}</label><select id="motion"><option value="normal">${esc(t('setup.motion.normal'))}</option><option value="reduced">${esc(t('setup.motion.reduced'))}</option></select></div><div class="setupHint">${esc(t('setup.saved'))}<br>${esc(t('setup.installHint'))}</div>`;$('#lang').value=S.lang;$('#theme').value=S.theme;$('#motion').value=S.motion;$('#lang').onchange=x=>{S.lang=x.target.value;persist();applyPrefs();renderCurrent();menu();setup();notify(t('toast.lang'))};$('#theme').onchange=x=>{S.theme=x.target.value;persist();applyPrefs()};$('#motion').onchange=x=>{S.motion=x.target.value;persist();applyPrefs()}}
function open(id){$('#'+id+'Overlay').classList.add('show');if(id==='menu')menu();if(id==='setup')setup()}
function close(id){$('#'+id+'Overlay').classList.remove('show')}
$('#menuBtn').onclick=()=>open('menu');$('#setupBtn').onclick=()=>open('setup');$('#restartBtn').onclick=restartGame;$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$$('.overlay').forEach(o=>o.onclick=x=>{if(x.target===o)o.classList.remove('show')});
function restartGame(){
  if(!confirm(t('game.restartConfirm')))return;
  S.progress={};
  S.mission=0;
  S.selected=null;
  S.tries=0;
  S.hint=false;
  S.optionOrder=[];
  S.debriefLesson=null;
  persist();
  openMission(0);
  notify(t('toast.reset'));
}
function reset(){restartGame()}
let installPrompt=null;window.addEventListener('beforeinstallprompt',x=>{x.preventDefault();installPrompt=x});window.addEventListener('appinstalled',()=>notify(t('toast.installed')));async function install(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else notify(t('install.unavailable'))}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=0.2-r8',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
applyPrefs();menu();showHome();

</script>
