ches ?","Ne déduisez pas la réponse d’un + correspondant plus loin : il n’y en a pas.","Un Parallel Gateway active toutes les branches sortantes."],["Démarrer par un message entrant","Une nouvelle instance doit être créée à l’arrivée d’un message de commande.","L’enveloppe est un déclencheur catch dans le cercle fin du Start Event.","Un Message Start Event capture le message entrant et crée une instance."],["Démarrer selon un horaire","Un processus de rapprochement démarre automatiquement chaque jour ouvrable à 09:00.","Cherchez le marqueur d’horloge dans le Start Event.","Un Timer Start Event crée l’instance selon un horaire ou une condition temporelle."],["Démarrer lorsqu’une condition devient vraie","Un processus de surveillance démarre lorsque le stock passe sous le seuil de réapprovisionnement.","Il s’agit d’une condition vraie, pas d’une horloge ni d’un message.","Un Conditional Start Event démarre lorsque sa condition configurée est satisfaite."],["Démarrer sur un signal diffusé","Plusieurs processus indépendants peuvent démarrer lorsque l’entreprise diffuse le signal 'Catastrophe déclarée'.","Les signaux sont diffusés et utilisent un triangle.","Un Signal Start Event capture un signal diffusé correspondant."],["Un seul des déclencheurs suffit","Un cas peut démarrer par message, signal ou autre déclencheur configuré ; un seul suffit.","Le pentagone représente Multiple.","Un Multiple Start Event démarre lorsqu’un des déclencheurs configurés se produit."],["Tous les déclencheurs sont requis","Un cas ne doit démarrer qu’après occurrence de tous les déclencheurs configurés.","Le plus dans le Start Event représente Parallel Multiple.","Un Parallel Multiple Start Event exige tous les déclencheurs configurés."],["Escalader sans terminer le processus","Pendant le traitement, émettez une escalade vers un niveau supérieur comme événement intermédiaire throw.","Le marqueur Escalation est le chevron vers le haut ; en throw il est rempli.","Un Throw Escalation Intermediate Event émet une escalade depuis le flux courant."],["Déclencher une compensation","Le processus doit émettre un déclencheur de compensation pour un travail déjà terminé.","Compensation utilise deux triangles vers la gauche ; en throw ils sont remplis.","Un Throw Compensation Intermediate Event déclenche le traitement de compensation."],["Capturer une erreur d’activité","Une activité échoue avec une Erreur BPMN ; l’activité normale doit s’arrêter et un chemin d’exception commencer.","Les Boundary Error Events sont interruptifs et utilisent le symbole éclair.","Un Boundary Error Event capture l’erreur et interrompt l’activité attachée."],["Capturer la compensation sur la bordure","Une activité terminée possède un gestionnaire de compensation à invoquer lors du rollback.","Cherchez les deux triangles vers la gauche non remplis sur la bordure.","Un Boundary Compensation Event identifie le gestionnaire de compensation attaché."],["Capturer l’annulation d’une transaction","Dans une Transaction, une annulation doit être capturée sur sa bordure.","Cancel utilise le marqueur X et appartient à la sémantique de Transaction.","Un Boundary Cancel Event capture l’annulation sur la bordure d’une Transaction."],["Nommer le travail","Choisissez le meilleur nom BPMN pour une activité qui examine une demande métier.","Utilisez un verbe actif significatif plus l’objet métier.","'Examiner la demande' décrit directement le travail sans nommer le type BPMN."],["Nommer ce qui s’est produit","Choisissez le meilleur nom pour un Message Event lorsque la commande arrive.","Les événements décrivent un fait, pas un travail à effectuer.","'Commande reçue' décrit l’occurrence métier avec un participe passé."],["Nommer le timer","Choisissez le meilleur nom pour un Timer Event qui se déclenche à 09:00 chaque jour ouvrable.","Le nom d’un Timer Event doit indiquer son horaire.","'Chaque jour ouvrable à 09:00' communique le déclencheur réel."],["Nommer l’objet de données","Choisissez le meilleur nom pour un Data Object représentant un bon de commande approuvé.","Utilisez le nom de l’objet métier et, si utile, son état entre crochets.","'Bon de commande [Approuvé]' identifie l’information et son état."],["Nommer le point de décision","Choisissez le meilleur nom pour un Exclusive Gateway divergent sur l’approbation du paiement.","Un Exclusive Gateway divergent se nomme de préférence par une phrase interrogative.","'Paiement approuvé ?' rend explicite la question de routage."],["Nommer la condition sortante","La question du gateway est 'Paiement approuvé ?'. Choisissez le meilleur libellé du Sequence Flow de succès.","Nommez les conditions sortantes comme des résultats.","'Approuvé' est un résultat concis cohérent avec la question."],["Nommer le flux par défaut","Quel est le meilleur nom pour le Default Sequence Flow ?","La barre indique déjà le chemin par défaut.","La bonne pratique est normalement de laisser le Default Sequence Flow sans nom."],["Nommer la Pool","Une Pool black box représente l’entreprise externe qui traite les paiements. Choisissez le meilleur nom.","Les Pools sont nommées par les Participants, pas par les processus.","'Fournisseur de paiement' nomme le Participant représenté par la Pool."],["Nommer la Lane","Une Lane regroupe les personnes responsables des factures fournisseurs. Choisissez le meilleur nom.","Les Lanes sont nommées par catégories : rôles, systèmes ou départements.","'Comptes fournisseurs' identifie la catégorie organisationnelle responsable."]],"diagram":{"record":"Enregistrer la commande","prepare":"Préparer la commande","deliver":"Livrer la commande","check":"Vérifier la disponibilité","available":"Chambre disponible","noneAvailable":"Aucune chambre","main":"Préparer le plat principal","side":"Préparer l’accompagnement","flowA":"Autre condition","fallback":"Repli","form":"Formulaire de commande","tax":"Calculer la taxe","shipment":"Préparer l’expédition","restaurant":"Restaurant","cashier":"Caisse","kitchen":"Cuisine","provider":"Prestataire de paiement","unknown":"Processus interne non affiché","request":"Demande de paiement","evaluate":"Évaluer la demande","approved":"Approuvé","rejected":"Rejeté","document":"Préparer le document","signature":"Obtenir la signature","continue":"Continuer","gift":"Emballage cadeau","insurance":"Assurance","reply":"Réponse reçue","timeout":"Timeout","wait":"Attendre le message","service":"Appeler le service","flowB":"Travail parallèle","reminder":"Envoyer un rappel"},"elements":{"startNone":["Événement de début","Démarre une instance du processus."],"intermediateNone":["Événement intermédiaire","Se produit pendant un processus en cours."],"endNone":["Événement de fin","Termine le flux courant."],"task":["Tâche","Unité de travail atomique."],"userTask":["User Task","Travail humain avec un logiciel."],"manualTask":["Manual Task","Travail humain sans logiciel."],"serviceTask":["Service Task","Travail automatisé par application ou service."],"businessRuleTask":["Business Rule Task","Évalue des règles métier."],"scriptTask":["Script Task","Exécute un script du moteur de processus."],"sendTask":["Send Task","Envoie un message comme travail."],"receiveTask":["Receive Task","Attend un message comme travail."],"subProcess":["Sous-processus replié","Masque le détail du processus interne."],"callActivity":["Call Activity","Appelle une activité globale réutilisable."],"gatewayExclusive":["Gateway Exclusif","Route exactement une alternative."],"gatewayParallel":["Gateway Parallèle","Active ou synchronise tous les chemins."],"gatewayInclusive":["Gateway Inclusif","Active un ou plusieurs chemins."],"gatewayEvent":["Gateway Basé sur les Événements","Route selon le premier événement."],"gatewayComplex":["Gateway Complexe","Autres sémantiques complexes de routage."],"sequenceFlow":["Sequence Flow","Ordonne le flux dans un processus."],"conditionalFlow":["Conditional Sequence Flow","Sequence Flow avec condition."],"defaultFlow":["Default Sequence Flow","Chemin de repli marqué d’une barre."],"messageFlow":["Message Flow","Communication entre Participants."],"association":["Association","Lie une information sans contrôler le flux."],"dataObject":["Data Object","Information utilisée ou produite."],"dataStore":["Data Store","Données persistantes du processus."],"pool":["Pool / Participant","Participant à une collaboration."],"lane":["Lane","Catégorie interne d’une Pool."],"messageCatchIntermediate":["Événement intermédiaire Message catch","Attend un message entrant."],"messageThrowIntermediate":["Événement intermédiaire Message throw","Envoie un message comme événement."],"timerStart":["Timer Start Event","Démarre par un déclencheur temporel."],"timerIntermediate":["Timer Intermediate Event","Attend un délai."],"boundaryTimerInterrupt":["Boundary Timer Event interruptif","Timeout qui arrête l’activité."],"boundaryTimerNonInterrupt":["Boundary Timer Event non interruptif","Crée un autre chemin sans arrêter le travail."],"terminateEnd":["Terminate End Event","Arrête tous les jetons de la portée."],"implicitParallelSplit":["Deux Sequence Flows sortant de l’activité","Les deux flux sortants inconditionnels d’une Activité sont activés."],"initiatingMessageFlow":["Message Flow initiateur + décorateur","Message Flow décoré d’une enveloppe non remplie indiquant le message initiateur."],"nonInitiatingMessageFlow":["Message Flow non initiateur + décorateur","Message Flow décoré d’une enveloppe remplie/grise indiquant un message non initiateur."],"startMessage":["Événement de début Message","Démarre lorsque le processus capture un message."],"startConditional":["Événement de début Conditionnel","Démarre lorsqu’une condition spécifiée devient vraie."],"startSignal":["Événement de début Signal","Démarre lorsqu’un signal correspondant est capturé."],"startMultiple":["Événement de début Multiple","Démarre lorsqu’un des déclencheurs configurés se produit."],"startParallelMultiple":["Événement de début Multiple parallèle","Démarre lorsque tous les déclencheurs configurés se sont produits."],"escalationThrowIntermediate":["Événement intermédiaire Throw Escalation","Émet une escalade pendant le processus."],"compensationThrowIntermediate":["Événement intermédiaire Throw Compensation","Émet un déclencheur de compensation."],"boundaryError":["Événement de bord Erreur","Capture une erreur sur la bordure et interrompt l’activité attachée."],"boundaryCompensation":["Événement de bord Compensation","Capture un déclencheur de compensation sur la bordure d’une activité."],"boundaryCancel":["Événement de bord Annulation","Capture l’annulation sur la bordure d’une Transaction."],"nameReviewRequest":["Examiner la demande","Bon nom d’activité : verbe actif plus objet métier."],"nameRequestReview":["Demander un examen","Action différente : demande un examen au lieu de l’effectuer."],"nameReview":["Examiner","Trop vague : l’objet métier manque."],"nameRequest":["Demande","Trop vague : le travail n’est pas indiqué."],"nameOrderReceived":["Commande reçue","Le nom d’événement décrit quelque chose qui s’est produit."],"nameReceiveOrder":["Recevoir commande","Forme d’une tâche, pas d’un état d’événement."],"nameMessageEvent":["Événement message","Utilise le type d’élément plutôt que le sens métier."],"nameStart":["Début","N’explique pas ce qui s’est produit."],"nameEveryWeekday0900":["Chaque jour ouvrable à 09:00","Le nom d’un Timer indique son horaire."],"nameWaitTimer":["Attendre timer","Vague et formulé comme une tâche."],"nameTimerEvent":["Événement timer","Nomme le type BPMN, pas l’horaire."],"nameTomorrow":["Demain","Horaire ambigu."],"namePurchaseOrderApproved":["Bon de commande [Approuvé]","Objet métier qualifié avec un état explicite."],"nameDataObject":["Objet de données","Nomme le type BPMN, pas l’information métier."],"nameApproved":["Approuvé","État sans identifier l’objet métier."],"nameDocument":["Document","Trop générique."],"namePaymentApprovedQ":["Paiement approuvé ?","Question adaptée à un Gateway Exclusif divergent."],"nameCheckPayment":["Vérifier paiement","Décrit un travail, donc une Activité."],"namePaymentDecision":["Décision de paiement","Expression vague, pas une question de routage."],"nameGateway":["Gateway","Nomme le type BPMN."],"nameApprovedOutcome":["Approuvé","Résultat clair pour un flux conditionnel sortant."],"nameIfApproved":["Si approuvé","Formulation de condition plutôt que résultat."],"nameYes":["Oui","Possible, mais moins explicite sans la question du gateway."],"nameNoLabel":["Sans nom","Les Sequence Flows par défaut restent normalement sans nom."],"nameDefault":["Défaut","Nomme inutilement le type technique."],"nameOtherwise":["Sinon","Le marqueur slash indique déjà le flux par défaut."],"namePaymentProvider":["Fournisseur de paiement","Nomme le Participant représenté par la Pool."],"namePaymentProcess":["Processus de paiement","Nomme un processus plutôt que le Participant."],"nameExternalPool":["Pool externe","Nomme le conteneur BPMN, pas le Participant."],"nameProviderSystem":["Système du fournisseur","Peut être une catégorie de lane, pas le Participant ici."],"nameAccountsPayable":["Comptes fournisseurs","Catégorie/rôle significatif pour une Lane."],"nameApproveInvoice":["Approuver facture","Nom d’Activité, pas de catégorie de Lane."],"nameLane":["Lane","Nomme le type BPMN."],"nameDepartment":["Département","Trop générique pour identifier la catégorie."]},"a11y.menu":"Ouvrir le menu","a11y.setup":"Ouvrir les réglages","a11y.close":"Fermer","meta.description":"Process Panic! — un jeu pédagogique BPMN conçu pour mobile.","debrief.finalContinue":"Ouvrir le débriefing final","game.restart":"Recommencer le jeu","game.restartConfirm":"Recommencer Process Panic! à la mission 1 et effacer toute la progression sur cet appareil ?","mission.option":"Option","menu.project":"Page du projet","debrief.errors":"Erreurs dans cette leçon","debrief.noErrors":"Aucun choix incorrect dans cette leçon.","debrief.youChose":"Vous avez choisi","debrief.correctWas":"Élément correct","debrief.rule":"Pourquoi","final.errors":"Tendances d’erreur dans le cours","final.noErrors":"Aucun choix incorrect n’a été enregistré.","final.times":"fois","reference.naming":"Bonnes pratiques de nommage BPMN"},"es":{"menu.course":"Mapa del curso","menu.glossary":"Guía de símbolos BPMN","menu.reference":"Referencias","menu.about":"Acerca de","menu.install":"Instalar aplicación","menu.reset":"Reiniciar progreso","setup.title":"Configuración","setup.language":"Idioma","setup.theme":"Tema","setup.theme.system":"Sistema","setup.theme.light":"Claro","setup.theme.dark":"Oscuro","setup.motion":"Animación","setup.motion.normal":"Normal","setup.motion.reduced":"Reducida","setup.installHint":"La instalación aparece cuando el navegador admite aplicaciones web.","setup.saved":"Los cambios se aplican inmediatamente.","home.kicker":"Juego móvil para aprender BPMN","home.title":"Repara el proceso. Luego ejecútalo.","home.lead":"Aprende BPMN eligiendo la notación, ejecutando el comportamiento de los tokens, observando fallos y analizando lo ocurrido.","home.continue":"Continuar curso","home.start":"Iniciar curso","home.completed":"misiones completadas","home.stars":"estrellas","home.lessons":"lecciones","home.course":"Curso","home.lesson":"Lección","home.done":"Lección completada","mission.label":"Misión","mission.run":"Ejecutar proceso","mission.hint":"Pista","mission.retry":"Probar otra opción","mission.next":"Siguiente misión","mission.toDebrief":"Debrief de la lección","mission.correct":"El proceso se comporta como se esperaba.","mission.wrong":"La ejecución revela un problema de modelado.","feedback.observe":"Observa el comportamiento y compáralo con la regla BPMN.","debrief.completed":"Lección completada","debrief.accuracy":"Aciertos al primer intento","debrief.hints":"Pistas usadas","debrief.stars":"Estrellas obtenidas","debrief.keyIdeas":"Lo que esta lección debe dejar claro","debrief.continue":"Continuar a la siguiente lección","debrief.replay":"Repetir lección","debrief.course":"Volver al mapa del curso","final.title":"Debrief final","final.subtitle":"Completaste el recorrido BPMN de la v0.2.","final.score":"Total de estrellas","final.accuracy":"Aciertos al primer intento","final.hints":"Pistas usadas","final.message":"El objetivo va más allá de memorizar símbolos: debes poder predecir cómo tokens, mensajes, participantes, gateways y eventos cambian el comportamiento del proceso.","final.replay":"Revisar el curso","final.reset":"Empezar de nuevo","glossary.title":"Guía de símbolos BPMN","glossary.lead":"Los símbolos se redibujan con el estilo visual del BPMN Quick Guide y BPMN 2.0. El color solo indica el estado del juego; no tiene semántica normativa en BPMN.","glossary.events":"Eventos","glossary.activities":"Actividades","glossary.gateways":"Gateways","glossary.flows":"Flujos y asociaciones","glossary.data":"Datos","glossary.swimlanes":"Pools y lanes","reference.title":"Referencias y política de notación","reference.quick":"BPMN Quick Guide","reference.omg":"OMG BPMN 2.0.2","reference.policy":"Process Panic redibuja la notación como SVG nativo y no incorpora imágenes del Quick Guide. El juego favorece gateways explícitos y diseños legibles de izquierda a derecha.","reference.course":"Los materiales del curso proporcionados por Geraldo Xexéo definen el orden didáctico del juego.","about.title":"Acerca de Process Panic!","about.text":"Process Panic! es un juego educativo para navegador de LUDES/PESC diseñado para hacer visible la semántica de ejecución de BPMN. El ciclo central es elegir → ejecutar → observar → analizar.","about.version":"Versión v0.2","about.license":"Licencia MIT — Copyright (c) 2026 Geraldo Xexéo.","install.unavailable":"Tu navegador no mostró una opción de instalación. Cuando esté disponible, usa el menú del navegador y elige Añadir a pantalla de inicio / Instalar aplicación.","reset.confirm":"¿Reiniciar todo el progreso de Process Panic! en este dispositivo?","toast.installed":"Process Panic! está instalado.","toast.reset":"Progreso reiniciado.","toast.lang":"Idioma cambiado inmediatamente.","lessons":[["Introducción","Eventos básicos, tareas, decisiones, paralelismo y lógica de tokens.",["Una instancia necesita inicio y fin explícitos.","Las tareas realizan trabajo; los gateways enrutan el flujo.","Los gateways exclusivos eligen una ruta; los paralelos crean o sincronizan rutas concurrentes."]],["Flujos, datos y actividades","Flujo por defecto, objetos de datos, tipos de tarea y subprocesos.",["El Flujo de Secuencia ordena el trabajo dentro del proceso.","Los Objetos de Datos representan información; los Data Stores representan persistencia.","El tipo de tarea comunica quién o qué realiza el trabajo."]],["Pools, lanes y mensajes","Responsabilidad interna, participantes y comunicación.",["Una Pool representa un Participante; una Lane categoriza trabajo dentro de ella.","El Flujo de Secuencia puede cruzar lanes, pero no límites de Pools.","El Flujo de Mensaje conecta Participantes diferentes."]],["Gateways","Semántica de XOR, AND, OR y gateways basados en eventos.",["Los gateways enrutan el flujo; no realizan la decisión de negocio.","Las uniones paralelas sincronizan todas las ramas requeridas.","Los Gateways Basados en Eventos enrutan según el primer evento que ocurre."]],["Eventos","Posición, mensajes, temporizadores de borde y terminación.",["Los círculos simple, doble y grueso distinguen inicio, intermedio y fin.","Los marcadores de mensaje distinguen captura y lanzamiento.","Los eventos de borde interruptivos detienen la actividad; Terminate termina todos los tokens del alcance."]],["Nombres de actividades y eventos","Elige nombres que hagan legibles el trabajo, los disparadores, los estados y los objetos de negocio sin explicación adicional.",["Las actividades usan frases significativas de verbo y objeto.","Los eventos describen lo ocurrido, el horario, la condición o el estado final.","Los objetos de datos usan sustantivos de negocio significativos y estados."]],["Nombres de gateways y colaboración","Nombra preguntas, resultados, participantes y categorías para hacer explícitos el enrutamiento y la responsabilidad.",["Los Gateways Exclusivos divergentes se nombran mejor como preguntas.","Las condiciones de salida se nombran como resultados; los flujos default normalmente quedan sin nombre.","Las pools llevan el nombre de los participantes; las lanes el de categorías como roles, sistemas o departamentos."]]],"missions":[["Un proceso comienza","Llega un pedido de pizza, pero el modelo no tiene el elemento que crea la instancia del proceso.","Un Evento de Inicio no tiene Flujo de Secuencia entrante.","Un Evento de Inicio None crea el primer token de este pedido."],["El trabajo no es un evento","El empleado debe registrar el pedido en el sistema. Elige el elemento BPMN que representa este trabajo.","Busca una unidad atómica de trabajo.","Una Tarea recibe un token, realiza trabajo y pasa el token."],["Muestra el estado final","La pizza fue entregada y este camino ha terminado. Elige el elemento que marca su fin.","Un Evento de Fin usa un círculo de borde grueso.","Un Evento de Fin None consume el token que llega y cierra este camino."],["Solo una ruta","Tras comprobar disponibilidad, el resultado es habitación disponible o sin habitación. Enruta exactamente una alternativa.","La actividad determina el resultado; el gateway solo enruta el flujo.","Un Gateway Exclusivo enruta un único flujo de salida."],["Dos cosas a la vez","La cocina debe preparar el plato principal y la guarnición de forma independiente, y ambos son necesarios.","Usa un gateway que active todas las ramas de salida.","Un Gateway Paralelo crea tokens concurrentes para ambas ramas."],["Una ruta de respaldo","Varias condiciones pueden enrutar una solicitud. Si ninguna es verdadera, debe seguirse una ruta de respaldo.","Busca el Flujo de Secuencia marcado con una barra cerca de su origen.","Un Flujo de Secuencia por Defecto se usa cuando las demás condiciones elegibles son falsas."],["Información, no trabajo","Una tarea lee y actualiza un formulario de pedido. Elige el elemento BPMN que representa el formulario.","El formulario es dato, no trabajo.","Un Objeto de Datos representa información usada o producida por actividades."],["¿Quién lo ejecuta?","El proceso llama automáticamente a un servicio web externo de cálculo de impuestos.","Elige el tipo de tarea para trabajo automatizado por una aplicación o servicio.","Una Tarea de Servicio representa trabajo automatizado realizado por una aplicación o servicio."],["Oculta el detalle interno","Preparar envío contiene varios pasos internos, pero este diagrama debe mantenerlos ocultos.","Busca el marcador de actividad con un pequeño signo más.","Un Subproceso colapsado oculta el flujo interno y sigue formando parte del proceso padre."],["Organiza la responsabilidad","El restaurante es un participante, mientras caja y cocina realizan trabajos distintos dentro de él.","Usa una partición dentro de una Pool, no otro Participante.","Una Lane organiza actividades dentro de una Pool."],["Cruza roles internos","Caja y cocina son lanes distintas de la misma pool. ¿Qué conector puede cruzar el límite entre ellas?","Los límites de lanes no separan Participantes.","El Flujo de Secuencia puede cruzar lanes porque el trabajo sigue dentro del mismo proceso."],["Habla con otro participante","El restaurante envía una solicitud de pago a un proveedor externo en otra Pool.","La comunicación entre Participantes usa un conector discontinuo con círculo abierto en el origen.","El Flujo de Mensaje conecta Participantes o Pools diferentes."],["Un proveedor de caja negra","El proveedor de pagos participa, pero su proceso interno es desconocido e irrelevante.","Un Participante no necesita mostrar su proceso interno.","Una Pool de caja negra representa al Participante externo."],["Exclusivo, no paralelo","Después de Evaluar solicitud, el resultado es Aprobado o Rechazado, nunca ambos.","La actividad determina el resultado; el gateway lo enruta.","Un Gateway Exclusivo selecciona exactamente una salida."],["Espera a ambos","Dos ramas paralelas preparan un documento y obtienen una firma. Continúa solo cuando ambas terminen.","Una división paralela suele necesitar una unión paralela cuando todas las ramas son obligatorias.","Un Gateway Paralelo espera todos los tokens entrantes requeridos."],["Una o más opciones","Un cliente puede solicitar envoltorio de regalo, seguro o ambos.","No es un comportamiento de exactamente uno ni de todos los caminos.","Un Gateway Inclusivo activa uno o más flujos de salida según las condiciones."],["Lo que ocurra primero","Después de enviar una solicitud, espera un mensaje de respuesta o un timeout. El primer evento determina la ruta.","Los objetivos tras este gateway son eventos de captura o actividades de recepción.","Un Gateway Basado en Eventos enruta por el primer evento posterior que ocurra."],["Esperar antes de continuar","Después de enviar un recordatorio, el proceso debe esperar hasta el siguiente día hábil antes de continuar. ¿Qué elemento BPMN corresponde al punto de espera?","Usa un evento intermedio catch activado por tiempo, no un evento de borde unido a una actividad.","Un Evento Intermedio de Temporizador hace que el token espere hasta que se cumpla la condición temporal; después el proceso continúa."],["Captura el mensaje","Durante el proceso, la ejecución debe esperar hasta que llegue un mensaje del cliente.","Los marcadores de mensaje de captura no están rellenos; los de lanzamiento sí.","Un Evento Intermedio de Mensaje de captura espera el mensaje entrante."],["Timeout de la actividad","Una llamada de servicio puede tardar demasiado. Tras 30 segundos, abandona esa llamada y sigue una ruta de timeout.","El timeout debe detener la actividad adjunta.","Un Evento Temporizador de Borde interruptivo cancela la actividad adjunta y crea la ruta de timeout."],["Detén todos los caminos activos","Llega una cancelación fatal mientras hay ramas paralelas activas. Todos los tokens de este alcance deben detenerse.","Un Evento de Fin normal termina solo el flujo que llega a él.","Un Evento de Fin de Terminación termina inmediatamente todos los tokens del alcance actual del proceso."],["Paralelo sin gateway","Elige el fragmento que muestra correctamente una actividad activando dos caminos de salida incondicionales sin un gateway explícito.","En BPMN, varios Sequence Flows incondicionales que salen de una Actividad se activan todos.","Dos Sequence Flows incondicionales que salen de una Actividad crean paralelismo implícito; un Gateway Paralelo explícito es más claro, pero no obligatorio."],["Información persistente","El proceso lee y actualiza registros de clientes que deben seguir disponibles después de terminar esta instancia. ¿Qué representa ese repositorio persistente?","Un documento que circula por el trabajo es distinto del almacenamiento persistente.","Un Data Store representa una base de datos o repositorio persistente similar."],["Trabajo manual","Una persona inspecciona físicamente un paquete sin usar una aplicación. ¿Qué tipo de Task corresponde?","El trabajo lo realiza una persona sin ayuda de software.","Una Manual Task representa trabajo humano realizado sin ayuda de una aplicación de software."],["El mensaje que inicia la colaboración","El primer mensaje del cliente inicia la interacción. Elige el Message Flow con decorador iniciador.","El decorador es un sobre sin relleno colocado sobre el Message Flow.","El Initiating Message Flow with Decorator identifica el mensaje que inicia el intercambio de colaboración."],["Un mensaje posterior de la colaboración","Una respuesta posterior pertenece a una interacción ya establecida. Elige el Message Flow no iniciador con decorador.","Compara el relleno del sobre decorador.","El Message Flow no iniciador decorado usa el sobre relleno/gris."],["Una regla que los gateways estándar no expresan","Una unión debe continuar cuando terminen cualesquiera tres de cinco ramas entrantes. ¿Qué gateway representa esta sincronización personalizada?","Exclusive, Parallel e Inclusive no expresan directamente esta regla de umbral.","Un Complex Gateway se usa para sincronización o enrutamiento complejo no cubierto por los otros tipos."],["Dividir en trabajo paralelo obligatorio","Después de aceptar un pedido, hay que reservar inventario y generar una factura. No se muestra un gateway final. ¿Qué elemento debe crear ambas ramas?","No deduzcas la respuesta por un + correspondiente más adelante; no existe.","Un Parallel Gateway activa todas las ramas de salida."],["Iniciar con un mensaje entrante","Debe crearse una nueva instancia cuando llega un mensaje de pedido.","El sobre es un disparador catch dentro del círculo fino del Start Event.","Un Message Start Event captura el mensaje entrante y crea una instancia."],["Iniciar según un horario","Un proceso de conciliación comienza automáticamente cada día laborable a las 09:00.","Busca el marcador de reloj dentro del Start Event.","Un Timer Start Event crea la instancia según un horario o condición temporal."],["Iniciar cuando una condición sea verdadera","Un proceso de monitorización comienza cuando el inventario cae por debajo del nivel de reposición.","Es una condición que se hace verdadera, no un reloj ni un mensaje.","Un Conditional Start Event comienza cuando se satisface su condición configurada."],["Iniciar por una señal difundida","Varios procesos independientes pueden comenzar cuando la empresa difunde la señal 'Desastre declarado'.","Las señales se difunden y usan un triángulo.","Un Signal Start Event captura una señal difundida coincidente."],["Cualquiera de varios disparadores puede iniciar","Un caso puede comenzar por mensaje, señal u otro disparador configurado; cualquiera basta.","El pentágono representa Multiple.","Un Multiple Start Event comienza cuando ocurre cualquiera de los disparadores configurados."],["Todos los disparadores son necesarios","Un caso solo debe comenzar después de que hayan ocurrido todos los disparadores configurados.","El signo más dentro del Start Event representa Parallel Multiple.","Un Parallel Multiple Start Event requiere todos los disparadores configurados."],["Escalar sin terminar el proceso","Durante el procesamiento, lanza una escalation a un nivel superior como evento intermedio throw.","El marcador Escalation es el chevrón hacia arriba; en throw está relleno.","Un Throw Escalation Intermediate Event emite una escalada desde el flujo actual."],["Disparar compensación","El proceso debe lanzar un disparador de compensación por trabajo ya completado.","Compensation usa dos triángulos hacia la izquierda; en throw están rellenos.","Un Throw Compensation Intermediate Event dispara el manejo de compensación."],["Capturar un error de una actividad","Una actividad falla con un Error BPMN; la actividad normal debe detenerse y comenzar una ruta de excepción.","Los Boundary Error Events son interruptivos y usan el símbolo de rayo.","Un Boundary Error Event captura el error e interrumpe la actividad adjunta."],["Capturar compensación en el borde","Una actividad completada tiene un manejador de compensación que debe invocarse durante el rollback.","Busca los dos triángulos hacia la izquierda sin relleno en el borde.","Un Boundary Compensation Event identifica el manejador de compensación adjunto."],["Capturar cancelación de transacción","Dentro de una Transaction, una cancelación debe capturarse en su borde.","Cancel usa el marcador X y pertenece a la semántica de Transaction.","Un Boundary Cancel Event captura la cancelación en el borde de una Transaction."],["Nombrar el trabajo","Elige el mejor nombre BPMN para una actividad que examina una solicitud de negocio.","Usa un verbo activo significativo más el objeto de negocio.","'Revisar solicitud' indica directamente el trabajo sin nombrar el tipo BPMN."],["Nombrar lo ocurrido","Elige el mejor nombre para un Message Event cuando llega un pedido.","Los eventos describen algo que ocurrió, no trabajo por realizar.","'Pedido recibido' describe la ocurrencia de negocio con participio pasado."],["Nombrar el timer","Elige el mejor nombre para un Timer Event que se activa a las 09:00 cada día laborable.","Los nombres de Timer Event deben indicar el horario.","'Cada día laborable a las 09:00' comunica el disparador real."],["Nombrar el objeto de datos","Elige el mejor nombre para un Data Object que representa una orden de compra aprobada.","Usa el nombre del objeto de negocio y, cuando sea útil, su estado entre corchetes.","'Orden de compra [Aprobada]' identifica la información y su estado."],["Nombrar el punto de decisión","Elige el mejor nombre para un Exclusive Gateway divergente sobre la aprobación del pago.","Un Exclusive Gateway divergente se nombra mejor con una frase interrogativa.","'¿Pago aprobado?' hace explícita la pregunta de enrutamiento."],["Nombrar la condición de salida","La pregunta del gateway es '¿Pago aprobado?'. Elige la mejor etiqueta del Sequence Flow exitoso.","Nombra las condiciones de salida como resultados.","'Aprobado' es un resultado conciso coherente con la pregunta."],["Nombrar el flujo default","¿Cuál es el mejor nombre para el Default Sequence Flow?","La barra ya identifica la ruta default.","La buena práctica es normalmente dejar el Default Sequence Flow sin nombre."],["Nombrar la Pool","Una Pool black box representa a la empresa externa que procesa pagos. Elige el mejor nombre.","Las Pools se nombran por los Participantes, no por los procesos.","'Proveedor de pagos' nombra al Participante representado por la Pool."],["Nombrar la Lane","Una Lane agrupa a las personas responsables de facturas de proveedores. Elige el mejor nombre.","Las Lanes se nombran por categorías como roles, sistemas o departamentos.","'Cuentas por pagar' identifica la categoría organizativa responsable."]],"diagram":{"record":"Registrar pedido","prepare":"Preparar pedido","deliver":"Entregar pedido","check":"Comprobar disponibilidad","available":"Habitación disponible","noneAvailable":"Sin habitación","main":"Preparar plato principal","side":"Preparar guarnición","flowA":"Otra condición","fallback":"Respaldo","form":"Formulario de pedido","tax":"Calcular impuesto","shipment":"Preparar envío","restaurant":"Restaurante","cashier":"Caja","kitchen":"Cocina","provider":"Proveedor de pagos","unknown":"Proceso interno no mostrado","request":"Solicitud de pago","evaluate":"Evaluar solicitud","approved":"Aprobado","rejected":"Rechazado","document":"Preparar documento","signature":"Obtener firma","continue":"Continuar","gift":"Envoltorio de regalo","insurance":"Seguro","reply":"Respuesta recibida","timeout":"Timeout","wait":"Esperar mensaje","service":"Llamar servicio","flowB":"Trabajo paralelo","reminder":"Enviar recordatorio"},"elements":{"startNone":["Evento Inicial","Inicia una instancia del proceso."],"intermediateNone":["Evento Intermedio","Ocurre durante un proceso en ejecución."],"endNone":["Evento Final","Termina el flujo actual."],"task":["Tarea","Unidad atómica de trabajo."],"userTask":["Tarea de Usuario","Trabajo humano usando software."],"manualTask":["Tarea Manual","Trabajo humano sin software."],"serviceTask":["Tarea de Servicio","Trabajo automatizado por aplicación o servicio."],"businessRuleTask":["Tarea de Regla de Negocio","Evalúa reglas de negocio."],"scriptTask":["Tarea de Script","Ejecuta un script del motor de procesos."],"sendTask":["Tarea de Envío","Envía un mensaje como trabajo."],"receiveTask":["Tarea de Recepción","Espera un mensaje como trabajo."],"subProcess":["Subproceso colapsado","Oculta el detalle del proceso interno."],"callActivity":["Actividad de Llamada","Invoca una actividad global reutilizable."],"gatewayExclusive":["Gateway Exclusivo","Enruta exactamente una alternativa."],"gatewayParallel":["Gateway Paralelo","Activa o sincroniza todos los caminos."],"gatewayInclusive":["Gateway Inclusivo","Activa uno o más caminos."],"gatewayEvent":["Gateway Basado en Eventos","Enruta por el primer evento que ocurre."],"gatewayComplex":["Gateway Complejo","Otras semánticas complejas de enrutamiento."],"sequenceFlow":["Flujo de Secuencia","Ordena el flujo dentro de un proceso."],"conditionalFlow":["Flujo de Secuencia Condicional","Flujo de Secuencia con una condición."],"defaultFlow":["Flujo de Secuencia por Defecto","Ruta de respaldo marcada por una barra."],"messageFlow":["Flujo de Mensaje","Comunicación entre Participantes."],"association":["Asociación","Vincula información sin controlar el flujo."],"dataObject":["Objeto de Datos","Información usada o producida."],"dataStore":["Almacén de Datos","Datos persistentes del proceso."],"pool":["Pool / Participante","Participante en una colaboración."],"lane":["Lane","Categoría interna dentro de una Pool."],"messageCatchIntermediate":["Evento Intermedio de Mensaje de captura","Espera un mensaje entrante."],"messageThrowIntermediate":["Evento Intermedio de Mensaje de lanzamiento","Envía un mensaje como evento."],"timerStart":["Evento de Inicio Temporizador","Inicia por un disparador temporal."],"timerIntermediate":["Evento Intermedio Temporizador","Espera un tiempo."],"boundaryTimerInterrupt":["Evento Temporizador de Borde interruptivo","Timeout que detiene la actividad."],"boundaryTimerNonInterrupt":["Evento Temporizador de Borde no interruptivo","Crea otra ruta sin detener el trabajo."],"terminateEnd":["Evento de Fin de Terminación","Detiene todos los tokens del alcance."],"implicitParallelSplit":["Dos Sequence Flows saliendo de la actividad","Se activan los dos flujos de salida incondicionales de una Actividad."],"initiatingMessageFlow":["Message Flow iniciador + decorador","Message Flow decorado con un sobre sin relleno que indica el mensaje iniciador."],"nonInitiatingMessageFlow":["Message Flow no iniciador + decorador","Message Flow decorado con un sobre relleno/gris que indica un mensaje no iniciador."],"startMessage":["Evento Inicial de Mensaje","Inicia cuando el proceso captura un mensaje."],"startConditional":["Evento Inicial Condicional","Inicia cuando una condición especificada se vuelve verdadera."],"startSignal":["Evento Inicial de Señal","Inicia cuando se captura una señal coincidente."],"startMultiple":["Evento Inicial Múltiple","Inicia cuando ocurre cualquiera de varios disparadores configurados."],"startParallelMultiple":["Evento Inicial Múltiple Paralelo","Inicia cuando han ocurrido todos los disparadores configurados."],"escalationThrowIntermediate":["Evento Intermedio Throw de Escalation","Lanza una escalada durante el proceso."],"compensationThrowIntermediate":["Evento Intermedio Throw de Compensación","Lanza un disparador de compensación."],"boundaryError":["Evento de Borde de Error","Captura un error en el borde e interrumpe la actividad adjunta."],"boundaryCompensation":["Evento de Borde de Compensación","Captura un disparador de compensación en el borde de una actividad."],"boundaryCancel":["Evento de Borde de Cancelación","Captura la cancelación en el borde de una Transacción."],"nameReviewRequest":["Revisar solicitud","Buen nombre de actividad: verbo activo más objeto de negocio."],"nameRequestReview":["Solicitar revisión","Acción distinta: solicita una revisión en lugar de realizarla."],"nameReview":["Revisar","Demasiado vago: falta el objeto de negocio."],"nameRequest":["Solicitud","Demasiado vago: no indica el trabajo."],"nameOrderReceived":["Pedido recibido","El nombre del evento describe algo que ocurrió."],"nameReceiveOrder":["Recibir pedido","Forma de tarea, no de estado/evento."],"nameMessageEvent":["Evento de mensaje","Usa el tipo de elemento en lugar del significado de negocio."],"nameStart":["Inicio","No explica qué ocurrió."],"nameEveryWeekday0900":["Cada día laborable a las 09:00","El nombre de un Timer indica su horario."],"nameWaitTimer":["Esperar timer","Vago y con forma de tarea."],"nameTimerEvent":["Evento timer","Nombra el tipo BPMN, no el horario."],"nameTomorrow":["Mañana","Horario ambiguo."],"namePurchaseOrderApproved":["Orden de compra [Aprobada]","Objeto de negocio cualificado con estado explícito."],"nameDataObject":["Objeto de datos","Nombra el tipo BPMN, no la información de negocio."],"nameApproved":["Aprobada","Estado sin identificar el objeto de negocio."],"nameDocument":["Documento","Demasiado genérico."],"namePaymentApprovedQ":["¿Pago aprobado?","Pregunta apropiada para un Gateway Exclusivo divergente."],"nameCheckPayment":["Verificar pago","Describe trabajo, que pertenece a una Actividad."],"namePaymentDecision":["Decisión de pago","Expresión vaga, no una pregunta explícita de enrutamiento."],"nameGateway":["Gateway","Nombra el tipo BPMN."],"nameApprovedOutcome":["Aprobado","Resultado claro para un flujo condicional de salida."],"nameIfApproved":["Si aprobado","Formula una condición en vez de un resultado."],"nameYes":["Sí","Puede servir, pero es menos explícito sin la pregunta del gateway."],"nameNoLabel":["Sin nombre","Los Sequence Flows default normalmente quedan sin nombre."],"nameDefault":["Default","Nombra innecesariamente el tipo técnico."],"nameOtherwise":["En otro caso","La barra ya identifica el flujo default."],"namePaymentProvider":["Proveedor de pagos","Nombra al Participante representado por la Pool."],"namePaymentProcess":["Proceso de pago","Nombra un proceso, no al Participante."],"nameExternalPool":["Pool externa","Nombra el contenedor BPMN, no al Participante."],"nameProviderSystem":["Sistema del proveedor","Puede ser una categoría de lane, no el Participante aquí."],"nameAccountsPayable":["Cuentas por pagar","Categoría/rol significativo para una Lane."],"nameApproveInvoice":["Aprobar factura","Nombre de Actividad, no de categoría de Lane."],"nameLane":["Lane","Nombra el tipo BPMN."],"nameDepartment":["Departamento","Demasiado genérico."]},"a11y.menu":"Abrir menú","a11y.setup":"Abrir configuración","a11y.close":"Cerrar","meta.description":"Process Panic! — un juego educativo BPMN diseñado para móvil.","debrief.finalContinue":"Abrir debrief final","game.restart":"Reiniciar juego","game.restartConfirm":"¿Reiniciar Process Panic! desde la Misión 1 y borrar todo el progreso de este dispositivo?","mission.option":"Opción","menu.project":"Página del proyecto","debrief.errors":"Errores en esta lección","debrief.noErrors":"No hubo elecciones incorrectas en esta lección.","debrief.youChose":"Elegiste","debrief.correctWas":"Elemento correcto","debrief.rule":"Por qué","final.errors":"Patrones de error del curso","final.noErrors":"No se registraron elecciones incorrectas.","final.times":"veces","reference.naming":"Buenas prácticas de nombres BPMN"},"it":{"menu.course":"Mappa del corso","menu.glossary":"Guida ai simboli BPMN","menu.reference":"Riferimenti","menu.about":"Informazioni","menu.install":"Installa app","menu.reset":"Azzera progressi","setup.title":"Impostazioni","setup.language":"Lingua","setup.theme":"Tema","setup.theme.system":"Sistema","setup.theme.light":"Chiaro","setup.theme.dark":"Scuro","setup.motion":"Animazione","setup.motion.normal":"Normale","setup.motion.reduced":"Ridotta","setup.installHint":"L’installazione appare quando il browser supporta le web app.","setup.saved":"Le modifiche si applicano immediatamente.","home.kicker":"Gioco mobile per imparare BPMN","home.title":"Ripara il processo. Poi eseguilo.","home.lead":"Impara BPMN scegliendo la notazione, eseguendo il comportamento dei token, osservando gli errori e analizzando ciò che è successo.","home.continue":"Continua il corso","home.start":"Inizia il corso","home.completed":"missioni completate","home.stars":"stelle","home.lessons":"lezioni","home.course":"Corso","home.lesson":"Lezione","home.done":"Lezione completata","mission.label":"Missione","mission.run":"Esegui processo","mission.hint":"Suggerimento","mission.retry":"Prova un’altra scelta","mission.next":"Missione successiva","mission.toDebrief":"Debrief della lezione","mission.correct":"Il processo si comporta come previsto.","mission.wrong":"L’esecuzione rivela un problema di modellazione.","feedback.observe":"Osserva il comportamento e confrontalo con la regola BPMN.","debrief.completed":"Lezione completata","debrief.accuracy":"Successi al primo tentativo","debrief.hints":"Suggerimenti usati","debrief.stars":"Stelle ottenute","debrief.keyIdeas":"Cosa deve lasciare chiaro questa lezione","debrief.continue":"Continua alla prossima lezione","debrief.replay":"Ripeti lezione","debrief.course":"Torna alla mappa del corso","final.title":"Debrief finale","final.subtitle":"Hai completato il percorso BPMN della v0.2.","final.score":"Stelle totali","final.accuracy":"Successi al primo tentativo","final.hints":"Suggerimenti usati","final.message":"L’obiettivo va oltre la memoria dei simboli: dovresti saper prevedere come token, messaggi, partecipanti, gateway ed eventi cambiano il comportamento del processo.","final.replay":"Rivedi il corso","final.reset":"Ricomincia","glossary.title":"Guida ai simboli BPMN","glossary.lead":"I simboli sono ridisegnati nello stile visivo del BPMN Quick Guide e BPMN 2.0. Il colore indica solo lo stato del gioco; non ha semantica normativa BPMN.","glossary.events":"Eventi","glossary.activities":"Attività","glossary.gateways":"Gateway","glossary.flows":"Flussi e associazioni","glossary.data":"Dati","glossary.swimlanes":"Pool e lane","reference.title":"Riferimenti e politica di notazione","reference.quick":"BPMN Quick Guide","reference.omg":"OMG BPMN 2.0.2","reference.policy":"Process Panic ridisegna la notazione come SVG nativo e non incorpora immagini del Quick Guide. Il gioco privilegia gateway espliciti e layout leggibili da sinistra a destra.","reference.course":"I materiali del corso forniti da Geraldo Xexéo definiscono l’ordine didattico usato dal gioco.","about.title":"Informazioni su Process Panic!","about.text":"Process Panic! è un gioco educativo per browser di LUDES/PESC progettato per rendere visibile la semantica di esecuzione BPMN. Il ciclo centrale è scegli → esegui → osserva → analizza.","about.version":"Versione v0.2","about.license":"Licenza MIT — Copyright (c) 2026 Geraldo Xexéo.","install.unavailable":"Il browser non ha mostrato una richiesta di installazione. Quando disponibile, usa il suo menu e scegli Aggiungi a schermata Home / Installa app.","reset.confirm":"Azzerare tutti i progressi di Process Panic! su questo dispositivo?","toast.installed":"Process Panic! è installato.","toast.reset":"Progressi azzerati.","toast.lang":"Lingua cambiata immediatamente.","lessons":[["Introduzione","Eventi di base, task, scelte, parallelismo e logica dei token.",["Un’istanza richiede inizio e fine espliciti.","I task eseguono lavoro; i gateway instradano il flusso.","I gateway esclusivi scelgono un percorso; quelli paralleli creano o sincronizzano percorsi concorrenti."]],["Flussi, dati e attività","Flusso predefinito, oggetti dati, tipi di task e sottoprocessi.",["Il Sequence Flow ordina il lavoro nel processo.","I Data Object rappresentano informazioni; i Data Store rappresentano persistenza.","Il tipo di task comunica chi o cosa esegue il lavoro."]],["Pool, lane e messaggi","Responsabilità interna, partecipanti e comunicazione.",["Una Pool rappresenta un Partecipante; una Lane categorizza il lavoro interno.","Il Sequence Flow può attraversare lane, ma non i confini delle Pool.","Il Message Flow collega Partecipanti differenti."]],["Gateway","Semantica di XOR, AND, OR e gateway basati su eventi.",["I gateway instradano il flusso; non prendono la decisione di business.","I join paralleli sincronizzano tutti i rami richiesti.","I Gateway Basati su Eventi instradano in base al primo evento che si verifica."]],["Eventi","Posizione, messaggi, timer di confine e terminazione.",["Cerchi singoli, doppi e spessi distinguono inizio, intermedio e fine.","I marker di messaggio distinguono catch e throw.","Gli eventi di confine interrupting fermano l’attività; Terminate arresta tutti i token nello scope."]],["Nomi di attività ed eventi","Scegli nomi che rendano leggibili lavoro, trigger, stati e oggetti di business senza spiegazioni aggiuntive.",["Le attività usano frasi significative verbo–nome.","Gli eventi descrivono ciò che è accaduto, la pianificazione, la condizione o lo stato finale.","I Data Object usano nomi di business significativi e stati."]],["Nomi di gateway e collaborazione","Nomina domande, risultati, partecipanti e categorie per rendere espliciti instradamento e responsabilità.",["I Gateway Esclusivi divergenti si nominano preferibilmente come domande.","Le condizioni in uscita sono nominate come risultati; i flussi default normalmente restano senza nome.","Le Pool prendono il nome dei partecipanti; le Lane quello delle categorie, ruoli, sistemi o reparti."]]],"missions":[["Un processo inizia","Arriva un ordine di pizza, ma il modello non ha l’elemento che crea l’istanza del processo.","Uno Start Event non ha Sequence Flow in ingresso.","Un None Start Event crea il primo token per questo ordine."],["Il lavoro non è un evento","L’addetto deve registrare l’ordine nel sistema. Scegli l’elemento BPMN che rappresenta questo lavoro.","Cerca un’unità atomica di lavoro.","Un Task riceve un token, esegue il lavoro e passa il token."],["Mostra lo stato finale","La pizza è stata consegnata e questo percorso è completo. Scegli l’elemento che ne marca la fine.","Un End Event usa un cerchio dal bordo spesso.","Un None End Event consuma il token in arrivo e chiude questo percorso."],["Una sola via","Dopo aver verificato la disponibilità, il risultato è camera disponibile oppure nessuna camera. Instrada una sola alternativa.","L’attività determina il risultato; il gateway si limita a instradare il flusso.","Un Gateway Esclusivo instrada un solo flusso in uscita."],["Due cose insieme","La cucina deve preparare piatto principale e contorno in modo indipendente, e servono entrambi.","Usa un gateway che attivi tutti i rami in uscita.","Un Gateway Parallelo crea token concorrenti per entrambi i rami."],["Un percorso di fallback","Più condizioni possono instradare una richiesta. Se nessuna è vera, deve essere seguito un percorso di fallback.","Cerca il Sequence Flow contrassegnato da una barra vicino alla sorgente.","Un Default Sequence Flow viene usato quando le altre condizioni ammissibili sono false."],["Informazione, non lavoro","Un task legge e aggiorna un modulo d’ordine. Scegli l’elemento BPMN che rappresenta il modulo.","Il modulo è un dato, non un lavoro.","Un Data Object rappresenta informazioni usate o prodotte dalle attività."],["Chi lo esegue?","Il processo chiama automaticamente un servizio web esterno per calcolare le imposte.","Scegli il tipo di task per lavoro automatizzato da un’applicazione o servizio.","Un Service Task rappresenta lavoro automatizzato eseguito da un’applicazione o servizio."],["Nascondi il dettaglio interno","Preparare spedizione contiene più passaggi interni, ma questo diagramma deve tenerli nascosti.","Cerca il marker di attività con un piccolo segno più.","Un Sottoprocesso compresso nasconde il flusso interno restando parte del processo padre."],["Organizza la responsabilità","Il ristorante è un partecipante, mentre cassa e cucina svolgono lavori diversi al suo interno.","Usa una partizione dentro una Pool, non un altro Partecipante.","Una Lane organizza le attività dentro una Pool."],["Attraversa ruoli interni","Cassa e cucina sono lane diverse della stessa pool. Quale connettore può attraversarne il confine?","I confini delle lane non separano i Partecipanti.","Il Sequence Flow può attraversare lane perché il lavoro resta nello stesso processo."],["Parla con un altro partecipante","Il ristorante invia una richiesta di pagamento a un provider esterno in un’altra Pool.","La comunicazione tra Partecipanti usa un connettore tratteggiato con cerchio aperto alla sorgente.","Il Message Flow collega Partecipanti o Pool differenti."],["Un provider black box","Il provider di pagamento partecipa, ma il suo processo interno è sconosciuto e irrilevante.","Un Partecipante non deve necessariamente mostrare il proprio processo interno.","Una Pool black box rappresenta il Partecipante esterno."],["Esclusivo, non parallelo","Dopo Valutare richiesta, il risultato è Approvato o Rifiutato, mai entrambi.","L’attività determina l’esito; il gateway lo instrada.","Un Gateway Esclusivo seleziona esattamente un flusso in uscita."],["Aspetta entrambi","Due rami paralleli preparano un documento e ottengono una firma. Continua solo dopo che entrambi sono finiti.","Una divisione parallela normalmente richiede una riunione parallela quando tutti i rami sono obbligatori.","Un Gateway Parallelo attende tutti i token in ingresso richiesti."],["Una o più opzioni","Un cliente può richiedere confezione regalo, assicurazione o entrambe.","Non è un comportamento esattamente-uno né tutti-i-percorsi.","Un Gateway Inclusivo attiva uno o più flussi in uscita secondo le condizioni."],["Qualunque accada prima","Dopo aver inviato una richiesta, attendi una risposta o un timeout. Il primo evento determina il percorso.","I target dopo questo gateway sono eventi catch o attività di ricezione.","Un Gateway Basato su Eventi instrada verso il primo evento successivo che si verifica."],["Attendere prima di continuare","Dopo aver inviato un promemoria, il processo deve attendere fino al giorno lavorativo successivo prima di continuare. Quale elemento BPMN appartiene al punto di attesa?","Usa un evento intermedio catch attivato dal tempo, non un evento di confine collegato a un’attività.","Un Evento Intermedio Timer fa attendere il token fino al verificarsi della condizione temporale; poi il processo continua."],["Cattura il messaggio","Durante il processo, l’esecuzione deve attendere l’arrivo di un messaggio del cliente.","I marker di messaggio catch non sono riempiti; quelli throw sono riempiti.","Un Evento Intermedio di Messaggio catch attende il messaggio in ingresso."],["Timeout dell’attività","Una chiamata di servizio può durare troppo. Dopo 30 secondi, abbandona la chiamata e segui un percorso di timeout.","Il timeout deve interrompere l’attività a cui è collegato.","Un Boundary Timer Event interrupting annulla l’attività collegata e crea il percorso di timeout."],["Ferma tutti i percorsi attivi","Arriva una cancellazione fatale mentre sono attivi rami paralleli. Tutti i token di questo scope devono fermarsi.","Un End Event normale termina solo il flusso che lo raggiunge.","Un Terminate End Event termina immediatamente tutti i token nello scope corrente del processo."],["Parallelo senza gateway","Scegli il frammento che mostra correttamente un’attività che attiva due percorsi in uscita incondizionati senza un gateway esplicito.","In BPMN, più Sequence Flow incondizionati in uscita da un’Attività vengono tutti attivati.","Due Sequence Flow incondizionati in uscita da un’Attività creano parallelismo implicito; un Gateway Parallelo esplicito è più chiaro ma non obbligatorio."],["Informazione persistente","Il processo legge e aggiorna record dei clienti che devono restare disponibili dopo la fine dell’istanza. Cosa rappresenta questo repository persistente?","Un documento che fluisce nel lavoro è diverso dallo storage persistente.","Un Data Store rappresenta un database o un repository persistente simile."],["Lavoro manuale","Una persona ispeziona fisicamente un pacco senza usare un’applicazione. Quale tipo di Task è appropriato?","Il lavoro è svolto da una persona senza assistenza software.","Una Manual Task rappresenta lavoro umano svolto senza l’aiuto di un’applicazione software."],["Il messaggio che avvia la collaborazione","Il primo messaggio del cliente avvia l’interazione. Scegli il Message Flow con decoratore iniziante.","Il decoratore è una busta non riempita posta sul Message Flow.","L’Initiating Message Flow with Decorator identifica il messaggio che avvia lo scambio di collaborazione."],["Un messaggio successivo nella collaborazione","Una risposta successiva appartiene a un’interazione già stabilita. Scegli il Message Flow non iniziante con decoratore.","Confronta il riempimento della busta decoratrice.","Il Message Flow non iniziante decorato usa la busta riempita/grigia."],["Una regola non espressa dai gateway standard","Un join deve continuare quando tre qualsiasi di cinque rami in ingresso terminano. Quale gateway rappresenta questa sincronizzazione personalizzata?","Exclusive, Parallel e Inclusive non esprimono direttamente questa soglia.","Un Complex Gateway viene usato per sincronizzazione o instradamento complesso non coperto dagli altri tipi."],["Dividere in lavoro parallelo richiesto","Dopo l’accettazione di un ordine bisogna riservare inventario e generare la fattura. Non è mostrato un gateway finale. Quale elemento deve creare entrambi i rami?","Non dedurre la risposta da un + corrispondente più avanti: non c’è.","Un Parallel Gateway attiva tutti i rami in uscita."],["Avviare con un messaggio in ingresso","Una nuova istanza deve essere creata quando arriva un messaggio d’ordine.","La busta è un trigger catch nel cerchio sottile dello Start Event.","Un Message Start Event cattura il messaggio in ingresso e crea un’istanza."],["Avviare secondo un orario","Un processo di riconciliazione parte automaticamente ogni giorno lavorativo alle 09:00.","Cerca il marcatore a orologio nello Start Event.","Un Timer Start Event crea l’istanza secondo un orario o una condizione temporale."],["Avviare quando una condizione diventa vera","Un processo di monitoraggio parte quando lo stock scende sotto il livello di riordino.","È una condizione che diventa vera, non un orologio o un messaggio.","Un Conditional Start Event parte quando la condizione configurata è soddisfatta."],["Avviare da un segnale diffuso","Più processi indipendenti possono partire quando l’azienda diffonde il segnale 'Disastro dichiarato'.","I segnali sono broadcast e usano un triangolo.","Un Signal Start Event cattura un segnale broadcast corrispondente."],["Uno qualsiasi di più trigger può avviare","Un caso può partire da messaggio, segnale o altro trigger configurato; ne basta uno.","Il pentagono rappresenta Multiple.","Un Multiple Start Event parte quando si verifica uno dei trigger configurati."],["Sono necessari tutti i trigger","Un caso deve partire solo dopo che si sono verificati tutti i trigger configurati.","Il segno più nello Start Event rappresenta Parallel Multiple.","Un Parallel Multiple Start Event richiede tutti i trigger configurati."],["Escalation senza terminare il processo","Durante l’elaborazione, lancia un’escalation verso un livello superiore come evento intermedio throw.","Il marcatore Escalation è il chevron verso l’alto; in throw è riempito.","Un Throw Escalation Intermediate Event emette un’escalation dal flusso corrente."],["Attivare compensazione","Il processo deve lanciare un trigger di compensazione per lavoro già completato.","Compensation usa due triangoli verso sinistra; in throw sono riempiti.","Un Throw Compensation Intermediate Event attiva la gestione della compensazione."],["Catturare un errore di attività","Un’attività fallisce con un Errore BPMN; l’attività normale deve fermarsi e iniziare un percorso di eccezione.","I Boundary Error Event sono interrupting e usano il simbolo del fulmine.","Un Boundary Error Event cattura l’errore e interrompe l’attività collegata."],["Catturare compensazione sul bordo","Un’attività completata ha un handler di compensazione da invocare durante il rollback.","Cerca i due triangoli verso sinistra non riempiti sul bordo.","Un Boundary Compensation Event identifica l’handler di compensazione collegato."],["Catturare annullamento di transazione","Dentro una Transaction, un annullamento deve essere catturato sul bordo.","Cancel usa il marcatore X ed è specifico della semantica di Transaction.","Un Boundary Cancel Event cattura l’annullamento sul bordo di una Transaction."],["Nominare il lavoro","Scegli il miglior nome BPMN per un’attività che esamina una richiesta di business.","Usa un verbo attivo significativo più l’oggetto di business.","'Revisionare richiesta' descrive direttamente il lavoro senza nominare il tipo BPMN."],["Nominare ciò che è accaduto","Scegli il miglior nome per un Message Event quando arriva un ordine.","Gli eventi descrivono qualcosa che è accaduto, non lavoro da eseguire.","'Ordine ricevuto' descrive l’occorrenza di business con participio passato."],["Nominare il timer","Scegli il miglior nome per un Timer Event che scatta alle 09:00 di ogni giorno lavorativo.","I nomi dei Timer Event devono indicare la pianificazione.","'Ogni giorno lavorativo alle 09:00' comunica il trigger reale."],["Nominare il Data Object","Scegli il miglior nome per un Data Object che rappresenta un ordine di acquisto approvato.","Usa il nome dell’oggetto di business e, se utile, il suo stato tra parentesi quadre.","'Ordine di acquisto [Approvato]' identifica l’informazione e il suo stato."],["Nominare il punto decisionale","Scegli il miglior nome per un Exclusive Gateway divergente sull’approvazione del pagamento.","Un Exclusive Gateway divergente si nomina preferibilmente con una frase interrogativa.","'Pagamento approvato?' rende esplicita la domanda di instradamento."],["Nominare la condizione in uscita","La domanda del gateway è 'Pagamento approvato?'. Scegli la migliore etichetta del Sequence Flow di successo.","Nomina le condizioni in uscita come risultati.","'Approvato' è un risultato conciso coerente con la domanda."],["Nominare il flusso default","Qual è il miglior nome per il Default Sequence Flow?","La barra identifica già il percorso default.","La buona pratica è normalmente lasciare il Default Sequence Flow senza nome."],["Nominare la Pool","Una Pool black box rappresenta l’azienda esterna che elabora i pagamenti. Scegli il miglior nome.","Le Pool si nominano con i Participant, non con i processi.","'Provider di pagamento' nomina il Participant rappresentato dalla Pool."],["Nominare la Lane","Una Lane raggruppa le persone responsabili delle fatture fornitori. Scegli il miglior nome.","Le Lane si nominano per categorie come ruoli, sistemi o reparti.","'Contabilità fornitori' identifica la categoria organizzativa responsabile."]],"diagram":{"record":"Registrare ordine","prepare":"Preparare ordine","deliver":"Consegnare ordine","check":"Verificare disponibilità","available":"Camera disponibile","noneAvailable":"Nessuna camera","main":"Preparare piatto principale","side":"Preparare contorno","flowA":"Altra condizione","fallback":"Fallback","form":"Modulo d’ordine","tax":"Calcolare imposta","shipment":"Preparare spedizione","restaurant":"Ristorante","cashier":"Cassa","kitchen":"Cucina","provider":"Provider di pagamento","unknown":"Processo interno non mostrato","request":"Richiesta di pagamento","evaluate":"Valutare richiesta","approved":"Approvato","rejected":"Rifiutato","document":"Preparare documento","signature":"Ottenere firma","continue":"Continuare","gift":"Confezione regalo","insurance":"Assicurazione","reply":"Risposta ricevuta","timeout":"Timeout","wait":"Attendere messaggio","service":"Chiamare servizio","flowB":"Lavoro parallelo","reminder":"Inviare promemoria"},"elements":{"startNone":["Evento iniziale","Avvia un’istanza del processo."],"intermediateNone":["Evento Intermedio","Avviene durante un processo in esecuzione."],"endNone":["Evento finale","Termina il flusso corrente."],"task":["Task","Unità atomica di lavoro."],"userTask":["User Task","Lavoro umano con software."],"manualTask":["Manual Task","Lavoro umano senza software."],"serviceTask":["Service Task","Lavoro automatizzato di applicazione o servizio."],"businessRuleTask":["Business Rule Task","Valuta regole di business."],"scriptTask":["Script Task","Esegue uno script del motore di processo."],"sendTask":["Send Task","Invia un messaggio come lavoro."],"receiveTask":["Receive Task","Attende un messaggio come lavoro."],"subProcess":["Sottoprocesso compresso","Nasconde il dettaglio del processo interno."],"callActivity":["Call Activity","Invoca un’atti function animate(id,pts,d=850){
  const z=document.getElementById(id);
  if(!z||S.motion==='reduced')return Promise.resolve();
  const [sx,sy]=pts[0];
  return new Promise(resolve=>{
    let done=false;
    const finish=()=>{if(done)return;done=true;clearTimeout(timer);resolve()};
    const timer=setTimeout(finish,d+350);
    try{
      const a=z.animate(
        pts.map((p,i)=>({transform:`translate(${p[0]-sx}px,${p[1]-sy}px)`,offset:pts.length>1?i/(pts.length-1):1})),
        {duration:d,easing:'ease-in-out',fill:'forwards'}
      );
      a.onfinish=finish;
      a.oncancel=finish;
      if(a.finished&&typeof a.finished.then==='function')a.finished.then(finish,finish);
    }catch(err){finish()}
  });
}
async function runAnimation(m,ok){if(!document.getElementById('token')&&!document.getElementById('tok1'))return new Promise(r=>setTimeout(r,120));if(m.diagram==='exclusive'&&ok){const upper=randomInt(2)===0;const path=upper?[[45,125],[235,125],[370,125],[500,65],[610,65]]:[[45,125],[235,125],[370,125],[500,185],[610,185]];await animate('token',path,950);return}if(m.qid==='EV-TIMER-WAIT'&&ok){

}
if((m.diagram==='parallel'||m.diagram==='parallelNoJoin')&&ok){await animate('token',[[45,125],[210,125]],420);const svg=$('#missionDiagram svg');svg.insertAdjacentHTML('beforeend',token(210,125,'a1')+token(210,125,'a2','#48c78e'));await Promise.all([animate('a1',[[210,125],[430,65]],760),animate('a2',[[210,125],[430,185]],760)]);return}if(m.diagram==='implicitParallel'&&ok){await animate('token',[[45,125],[150,125],[250,125]],420);const svg=$('#missionDiagram svg');svg.insertAdjacentHTML('beforeend',token(250,125,'ip1')+token(250,125,'ip2','#48c78e'));await Promise.all([animate('ip1',[[250,125],[440,65]],650),animate('ip2',[[250,125],[440,185]],650)]);return}
if(m.diagram==='join'&&ok){await Promise.all([animate('tok1',[[230,60],[430,125]],700),animate('tok2',[[230,190],[430,125]],700)]);return}if(m.diagram==='terminate'&&ok){await animate('tok1',[[285,55],[595,55]],700);document.getElementById('tok2')?.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});return}const z=document.getElementById('token');if(z)await animate('token',[[+z.getAttribute('cx'),+z.getAttribute('cy')],[350,125],[620,125]],800)}

function doneCount(){return MISSIONS.filter((_,i)=>S.progress[i]?.complete).length}
function starCount(){return MISSIONS.reduce((a,_,i)=>a+(S.progress[i]?.stars||0),0)}
function idsForLesson(l){return MISSIONS.map((m,i)=>m.lesson===l?i:-1).filter(i=>i>=0)}
function lessonDone(l){return idsForLesson(l).every(i=>S.progress[i]?.complete)}
function lessonUnlocked(l){return l===0||lessonDone(l-1)}
function firstIncomplete(){const i=MISSIONS.findIndex((_,i)=>!S.progress[i]?.complete);return i<0?0:i}
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function home(){const done=doneCount();let cards='';for(let l=0;l<I18N[S.lang].lessons.length;l++){const ids=idsForLesson(l),c=ids.filter(i=>S.progress[i]?.complete).length,locked=!lessonUnlocked(l);cards+=`<button class="lessonCard ${locked?'locked':''}" data-lesson="${l}" ${locked?'disabled':''}><div class="lessonTop"><span>${esc(t('home.lesson'))} ${l+1}</span><span>${lessonDone(l)?esc(t('home.done')):`${c}/${ids.length}`}</span></div><h3>${esc(lt(l,0))}</h3><p>${esc(lt(l,1))}</p><div class="progressTrack"><span style="width:${c/ids.length*100}%"></span></div></button>`}$('#home').innerHTML=`<div class="hero">${idTag('HOME')}<div class="kicker">${esc(t('home.kicker'))}</div><h1>${esc(t('home.title'))}</h1><p class="lead">${esc(t('home.lead'))}</p><p><button id="go" class="primary" style="width:100%">${esc(done?t('home.continue'):t('home.start'))}</button></p><div class="stats"><div class="stat"><b>${done}/${MISSIONS.length}</b><span>${esc(t('home.completed'))}</span></div><div class="stat"><b>${starCount()}</b><span>${esc(t('home.stars'))}</span></div><div class="stat"><b>${Array.from({length:I18N[S.lang].lessons.length},(_,i)=>i).filter(lessonDone).length}/${I18N[S.lang].lessons.length}</b><span>${esc(t('home.lessons'))}</span></div></div></div><div class="sectionHead"><h2>${esc(t('home.course'))}</h2><span>${Math.round(done/MISSIONS.length*100)}%</span></div><div class="lessonList">${cards}</div>`;$('#go').onclick=()=>openMission(firstIncomplete());$$('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.lesson))}
function openLesson(l){const ids=idsForLesson(l);openMission(ids.find(i=>!S.progress[i]?.complete)??ids[0])}
function randomInt(n){
  if(globalThis.crypto?.getRandomValues){
    const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;
  }
  return Math.floor(Math.random()*n);
}
function shuffledOptions(options,previous=[]){
  const a=[...options];
  for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}
  if(previous.length===a.length&&a.every((v,i)=>v===previous[i])&&a.length>1){
    const shift=1+randomInt(a.length-1);return a.slice(shift).concat(a.slice(0,shift));
  }
  return a;
}
function openMission(i){S.mission=i;S.selected=null;S.tries=0;S.hint=false;S.optionOrder=shuffledOptions(MISSIONS[i].options,S.optionOrder);persist();show('mission');mission()}
function mission(){
  const i=S.mission,m=MISSIONS[i],x=I18N[S.lang].missions[i];

  $$('[data-choice]').forEach(b=>b.onclick=()=>{S.selected=b.dataset.choice;mission()});

}
function revealSelectedChoice(){
  const b=document.querySelector('.choice.selected');

async function runMission(){if(!S.selected)return;const i=S.mission,m=MISSIONS[i],ok=S.selected===m.answer,x=I18N[S.lang].missions[i];S.tries++;$('#run').disabled=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);await runAnimation(m,ok);const f=$('#fb');if(ok){revealSelectedChoice();const old=S.progress[i]||{},first=S.tries===1,score=S.hint?2:(first?3:1);S.progress[i]={...old,complete:true,stars:Math.max(old.stars||0,score),firstTry:old.complete?old.firstTry:first,hint:old.hint||S.hint,attempts:Math.max(old.attempts||0,S.tries)};persist();f.className='feedback show ok';f.innerHTML=`<b>${esc(t('mission.correct'))} ${stars(Math.max(old.stars||0,score))}</b><br>${esc(x[3])}`;const last=idsForLesson(m.lesson).at(-1)===i;$('#run').disabled=false;$('#run').textContent=last?t('mission.toDebrief'):t('mission.next');$('#run').onclick=()=>last?openDebrief(m.lesson):openMission(i+1)}else{

function missionErrorReview(i){
  const p=S.progress[i], wrong=p?.wrongChoices||[];
  if(!wrong.length)return '';
  const counts={};wrong.forEach(id=>counts[id]=(counts[id]||0)+1);

  return Object.entries(counts).map(([id,n])=>`<div class="card" style="margin-top:8px">
    <b>M${String(i+1).padStart(2,'0')} — ${esc(I18N[S.lang].missions[i][0])}</b>

    <small>${esc(e(correct)[1])}</small></p>
    <p><strong>${esc(t('debrief.rule'))}:</strong> ${esc(rule)}</p>
  </div>`).join('');
}
function lessonErrorReview(l){

}
function finalErrorReview(){
  const pairs={};
  MISSIONS.forEach((m,i)=>{
    const wrong=S.progress[i]?.wrongChoices||[];
    wrong.forEach(id=>{
      const k=id+'→'+m.answer;
      pairs[k]=pairs[k]||{wrong:id,correct:m.answer,count:0,missions:[]};
      pairs[k].count++; if(!pairs[k].missions.includes(i))pairs[k].missions.push(i);
    });
  });
  const rows=Object.values(pairs).sort((a,b)=>b.count-a.count);
  if(!rows.length)return `<p class="lead">${esc(t('final.noErrors'))}</p>`;
  return rows.map(r=>`<div class="card" style="margin-top:8px">
    <b>${esc(e(r.wrong)[0])} → ${esc(e(r.correct)[0])}</b>
    <p>${r.count} ${esc(t('final.times'))} · ${r.missions.map(i=>'M'+String(i+1).padStart(2,'0')).join(', ')}</p>
    <small>${esc(e(r.wrong)[1])} → ${esc(e(r.correct)[1])}</small>
  </div>`).join('');
}
