 mobile puzzles.","hero.play":"Play Process Panic!","hero.article":"Read the article","m1.b":"7 lessons","m1.s":"Course order + naming best practices","m2.b":"5 languages","m2.s":"EN · PT · FR · ES · IT","m3.b":"21 missions","m3.s":"Randomly sampled from a larger bank","m4.b":"Installable","m4.s":"PWA + offline cache","sec.h":"The diagram is the game mechanic.","sec.p":"Instead of memorizing a symbol and receiving a right/wrong message, the player runs the process. Tokens split, synchronize, wait, disappear, or deadlock according to the selected BPMN element.","c1.h":"Execute semantics","c1.p":"Token animation makes routing, parallelism, synchronization and termination visible.","c2.h":"Repair models","c2.p":"Wrong choices produce observable process behavior before the explanation is shown.","c3.h":"Debrief","c3.p":"Each lesson ends with a debrief, and the course closes with an overall debrief.","cta.h":"Ready to rescue a process?","cta.p":"No account and no server are required. Progress stays on the device.","foot":"Process Panic! is an educational LUDES/PESC project. MIT License — Copyright (c) 2026 Geraldo Xexéo."},"pt":{"nav.about":"Sobre","nav.article":"Artigo","nav.play":"Jogar","hero.k":"Jogo de aprendizagem BPMN para celular","hero.h":"Aprenda BPMN fazendo o processo executar.","hero.p":"Escolha a notação, execute tokens, veja falhas e analise o modelo. Process Panic! transforma a semântica BPMN em pequenos puzzles para celular.","hero.play":"Jogar Process Panic!","hero.article":"Ler o artigo","m1.b":"7 aulas","m1.s":"Ordem do curso + boas práticas de nomes","m2.b":"5 idiomas","m2.s":"EN · PT · FR · ES · IT","m3.b":"21 missões","m3.s":"Sorteadas de um banco maior","m4.b":"Instalável","m4.s":"PWA + cache offline","sec.h":"O diagrama é a mecânica do jogo.","sec.p":"Em vez de memorizar um símbolo e receber apenas certo/errado, o jogador executa o processo. Tokens se dividem, sincronizam, esperam, desaparecem ou travam conforme o elemento BPMN escolhido.","c1.h" :"Process Panic! est un projet pédagogique LUDES/PESC. Licence MIT — Copyright (c) 2026 Geraldo Xexéo."},"es":{"nav.about":"Acerca de","nav.article":"Artículo","nav.play":"Jugar","hero.k":"Juego móvil para aprender BPMN","hero.h":"Aprende BPMN haciendo que el proceso se ejecute.","hero.p":"Elige la notación, ejecuta tokens, observa fallos y analiza el modelo. Process Panic! convierte la semántica BPMN en pequeños puzzles móviles.","hero.play":"Jugar Process Panic!","hero.article":"Leer el artículo","m1.b":"7 lecciones","m1.s":"Orden del curso + buenas prácticas de nombres","m2.b":"5 idiomas","m2.s":"EN · PT · FR · ES · IT","m3.b":"21 misiones","m3.s":"Sorteadas de un banco más amplio","m4.b":"Instalable","m4.s":"PWA + caché offline","sec.h":"El diagrama es la mecánica del juego.","sec.p":"En lugar de memorizar un símbolo y recibir solo correcto/incorrecto, el jugador ejecuta el proceso. Los tokens se dividen, sincronizan, esperan, desaparecen o se bloquean según el elemento BPMN elegido.","c1.h":"Ejecuta la semántica","c1.p":"La animación de tokens hace visibles enrutamiento, paralelismo, sincronización y terminación.","c2.h":"Repara modelos","c2.p":"Las elecciones erróneas producen un comportamiento observable antes de mostrar la explicación.","c3.h":"Debrief","c3.p":"Cada lección termina con un debrief y el curso cierra con un debrief general.","cta.h":"¿Listo para rescatar un proceso?","cta.p":"No se requiere cuenta ni servidor. El progreso permanece en el dispositivo.","foot":"Process Panic! es un proyecto educativo de LUDES/PESC. Licencia MIT — Copyright (c) 2026 Geraldo Xexéo."},"it":{"nav.about":"Informazioni","nav.article":"Articolo","nav.play":"Gioca","hero.k":"Gioco mobile per imparare BPMN","hero.h":"Impara BPMN facendo eseguire il processo.","hero.p":"Scegli la notazione, esegui i token, osserva gli errori e analizza il modello. Process Panic! trasforma la semantica BPMN in brevi puzzle per cellulare.","hero.play":"Gioca a Process Panic!","hero.article":
