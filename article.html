<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101c"><link rel="manifest" href="manifest.webmanifest"><title>Process Panic! — Article</title><style>*{box-sizing:border-box}body{margin:0;background:#07101c;color:#f7fafc;font-family:Inter,system-ui,sans-serif;line-height:1.7}.wrap{width:min(760px,calc(100% - 30px));margin:auto}nav{position:sticky;top:0;background:#07101cee;border-bottom:1px solid #33465d;padding:10px 0}.nav{display:flex;gap:10px;align-items:center}.brand{font-weight:900;flex:1}select,.btn{border:1px solid #33465d;background:#0f1c2c;color:#f7fafc;border-radius:9px;padding:8px 10px}article{padding:48px 0}h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:1;letter-spacing:-.045em}.lead{font-size:1.25rem;color:#a8b6c8}p{color:#d8e0e9}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:28px}a{text-decoration:none}.primary{background:#49b6e9;color:#04111a;font-weight:800}</style></head><body><nav><div class="wrap nav"><div class="brand">Process Panic! <small>v0.2</small></div><select id="lang"><option value="en">EN</option><option value="pt">PT</option><option value="fr">FR</option><option value="es">ES</option><option value="it">IT</option></select></div></nav><article class="wrap"><h1 data-i="title"></h1><p class="lead" data-i="lead"></p><p data-i="p1"></p><p data-i="p2"></p><p data-i="p3"></p><p data-i="p4"></p><p data-i="p5"></p><div class="actions"><a class="btn" href="./" data-i="back"></a><a class="btn primary" href="play/" data-i="play"></a><a class="btn" href="https://www.bpmnquickguide.com/view-bpmn-quick-guide/" target="_blank" rel="noopener" data-i="ref"></a></div></article><script>const I18N={"en":{"title":"Why Process Panic?","lead":"A short design note on teaching BPMN through execution rather than symbol memorization.","p1":"BPMN is often introduced as a catalogue of shapes. That is necessary, but insufficient: the important knowledge is semantic. A learner should predict what happens to a process instance when a token reaches a gateway, when parallel paths reunite, when a timer fires on an activity, or when a message crosses a collaboration boundary.","p2":"Process Panic! therefore treats the process diagram as the game mechanic. Each mission presents a small situation and asks the player to complete or repair the model. The player then runs it. A wrong choice is allowed to produce a visible consequence before the explanation appears.","p3":"The v0.2 course follows the teaching sequence used in the supporting classes: introduction and token logic; flows, data and activities; pools, lanes and message flows; gateway semantics; and events. A lesson debrief follows each group, with a final debrief at the end.","p4":"Notation is redrawn as native SVG using the BPMN Quick Guide as the visual reference and OMG BPMN 2.0.2 as the normative specification. The game favors explicit gateways and readable layouts. Color is reserved for game state and token animation rather than treated as BPMN semantics.","p5":"The project is mobile-first, self-contained for the playable game, multilingual, installable as a PWA, and released under the MIT License. Its purpose is classroom use, workshops, individual study, and discussion about why apparently similar BPMN symbols produce different process behavior.","back":"Back to home","play":"Play the game","ref":"Notation reference"},"pt":{"title":"Por que Process Panic?","lead":"Uma breve nota de design sobre ensinar BPMN pela execução, e não apenas pela memorização de símbolos.","p1":"BPMN frequentemente é apresentada como um catálogo de formas. Isso é necessário, mas insuficiente: o conhecimento importante é semântico. O aluno deve prever o que acontece com uma instância quando um token chega a um gateway, quando caminhos paralelos se reencontram, quando um timer dispara numa atividade ou quando uma mensagem cruza o limite de uma colaboração.","p2":"Por isso Process Panic! trata o diagrama de processo como a própria mecânica do jogo. Cada missão apresenta uma situação curta e pede que o jogador complete ou conserte o modelo. Em seguida, ele o executa. Uma escolha errada pode produzir uma consequência visível antes que a explicação apareça.","p3":"O percurso da v0.2 segue a sequência didática das aulas de apoio: introdução e lógica de tokens; fluxos, dados e atividades; pools, raias e fluxos de mensagem; semântica de gateways; e eventos. Cada grupo termina com debrief, e há um debrief final.","p4":"A notação é redesenhada como SVG nativo, usando o BPMN Quick Guide como referência visual e a OMG BPMN 2.0.2 como especificação normativa. O jogo privilegia gateways explícitos e layouts legíveis. As cores ficam reservadas ao estado do jogo e à animação dos tokens, não à semântica BPMN.","p5":"O projeto é mobile-first, autocontido no jogo executável, multilíngue, instalável como PWA e distribuído sob Licença MIT. Destina-se a aulas, workshops, estudo individual e discussão sobre por que símbolos BPMN aparentemente parecidos produzem comportamentos diferentes.","back":"Voltar ao início","play":"Jogar","ref":"Referência de notação"},"fr":{"title":"Pourquoi Process Panic ?","lead":"Une courte note de conception sur l’enseignement de BPMN par l’exécution plutôt que par la seule mémorisation des symboles.","p1":"BPMN est souvent présenté comme un catalogue de formes. C’est nécessaire mais insuffisant : la connaissance importante est sémantique. L’apprenant doit prévoir ce qui arrive à une instance lorsqu’un jeton atteint un gateway, lorsque des chemins parallèles se rejoignent, lorsqu’un timer se déclenche sur une activité ou lorsqu’un message traverse une collaboration.","p2":"Process Panic! traite donc le diagramme de processus comme la mécanique même du jeu. Chaque mission présente une petite situation et demande de compléter ou réparer le modèle. Le joueur l’exécute ensuite. Un mauvais choix peut produire une conséquence visible avant l’explication.","p3":"Le parcours v0.2 suit l’ordre pédagogique des cours : introduction et logique des jetons ; flux, données et activités ; pools, lanes et Message Flows ; sémantique des gateways ; événements. Chaque groupe se termine par un débriefing, puis un débriefing final clôt le cours.","p4":"La notation est redessinée en SVG natif, avec BPMN Quick Guide comme référence visuelle et OMG BPMN 2.0.2 comme spécification normative. Le jeu privilégie les gateways explicites et les dispositions lisibles. La couleur sert à l’état du jeu et aux jetons, pas à la sémantique BPMN.","p5":"Le projet est mobile-first, autonome pour le jeu, multilingue, installable comme PWA et publié sous licence MIT. Il est destiné aux cours, ateliers, études individuelles et discussions sur les différences de comportement entre symboles BPMN.","back":"Retour à l’accueil","play":"Jouer","ref":"Référence de notation"},"es":{"title":"¿Por qué Process Panic?","lead":"Una breve nota de diseño sobre enseñar BPMN mediante ejecución y no solo memorizando símbolos.","p1":"BPMN suele presentarse como un catálogo de formas. Eso es necesario, pero insuficiente: el conocimiento importante es semántico. El alumno debe predecir qué ocurre con una instancia cuando un token llega a un gateway, cuando se reúnen rutas paralelas, cuando un temporizador se dispara sobre una actividad o cuando un mensaje cruza una colaboración.","p2":"Por eso Process Panic! trata el diagrama de proceso como la propia mecánica del juego. Cada misión presenta una situación pequeña y pide completar o reparar el modelo. Después se ejecuta. Una elección equivocada puede producir una consecuencia visible antes de mostrar la explicación.","p3":"El recorrido v0.2 sigue el orden didáctico de las clases: introducción y lógica de tokens; flujos, datos y actividades; pools, lanes y flujos de mensaje; semántica de gateways; y eventos. Cada grupo termina con un debrief y el curso con un debrief final.","p4":"La notación se redibuja como SVG nativo, usando BPMN Quick Guide como referencia visual y OMG BPMN 2.0.2 como especificación normativa. El juego favorece gateways explícitos y diseños legibles. El color se reserva al estado del juego y a los tokens, no a la semántica BPMN.","p5":"El proyecto es mobile-first, autocontenido en el juego ejecutable, multilingüe, instalable como PWA y publicado bajo Licencia MIT. Está pensado para clases, talleres, estudio individual y discusión sobre por qué símbolos BPMN parecidos producen comportamientos distintos.","back":"Volver al inicio","play":"Jugar","ref":"Referencia de notación"},"it":{"title":"Perché Process Panic?","lead":"Una breve nota di design sull’insegnamento di BPMN attraverso l’esecuzione, non solo la memorizzazione dei simboli.","p1":"BPMN viene spesso introdotto come un catalogo di forme. È necessario, ma insufficiente: la conoscenza importante è semantica. Chi apprende dovrebbe prevedere cosa accade a un’istanza quando un token raggiunge un gateway, quando percorsi paralleli si riuniscono, quando scatta un timer su un’attività o quando un messaggio attraversa una collaborazione.","p2":"Process Panic! tratta quindi il diagramma di processo come la meccanica stessa del gioco. Ogni missione presenta una piccola situazione e chiede di completare o riparare il modello. Poi il giocatore lo esegue. Una scelta errata può produrre una conseguenza visibile prima della spiegazione.","p3":"Il percorso v0.2 segue l’ordine didattico delle lezioni: introduzione e logica dei token; flussi, dati e attività; pool, lane e Message Flow; semantica dei gateway; eventi. Ogni gruppo termina con un debrief e il corso con un debrief finale.","p4":"La notazione è ridisegnata come SVG nativo, usando BPMN Quick Guide come riferimento visivo e OMG BPMN 2.0.2 come specifica normativa. Il gioco privilegia gateway espliciti e layout leggibili. Il colore è riservato allo stato del gioco e ai token, non alla semantica BPMN.","p5":"Il progetto è mobile-first, autocontenuto nel gioco, multilingue, installabile come PWA e distribuito con Licenza MIT. È pensato per lezioni, workshop, studio individuale e discussione sulle differenze di comportamento fra simboli BPMN simili.","back":"Torna alla home","play":"Gioca","ref":"Riferimento di notazione"}};let lang=localStorage.getItem('processpanic.lang')||((navigator.language||'en').slice(0,2));if(!I18N[lang])lang='en';function apply(){document.documentElement.lang={en:'en',pt:'pt-BR',fr:'fr',es:'es',it:'it'}[lang];document.querySelectorAll('[data-i]').forEach(x=>x.textContent=I18N[lang][x.dataset.i]||x.dataset.i);document.getElementById('lang').value=lang}document.addEventListener('DOMContentLoaded',()=>{apply();document.getElementById('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('processpanic.lang',lang);apply()};if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=0.2-r7',{updateViaCache:'none'})})</script></body></html>
